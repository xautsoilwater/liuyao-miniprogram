<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>周易研习</title>
  <style>
    :root {
      --ink: #1c1814;
      --ink-2: #2e261f;
      --ink-soft: #5c5146;
      --mist: rgba(28, 24, 20, 0.5);
      --paper: #ebe0c8;
      --paper-deep: #d9c9a8;
      --cream: #faf6ea;
      --cinnabar: #9b2d24;
      --cinnabar-deep: #7a221c;
      --cinnabar-soft: rgba(155, 45, 36, 0.1);
      --bronze: #6e5a3e;
      --bronze-soft: rgba(110, 90, 62, 0.14);
      --bronze-light: #a08a62;
      --line: rgba(28, 24, 20, 0.1);
      --line-strong: rgba(28, 24, 20, 0.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
      color: var(--ink);
      background: #dccdb0;
      letter-spacing: 0.02em;
      line-height: 1.8;
    }
    .atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 110% 58% at 50% -14%, rgba(250, 246, 234, 0.95), transparent 58%),
        radial-gradient(ellipse 48% 36% at 0% 88%, rgba(155, 45, 36, 0.04), transparent 52%),
        radial-gradient(ellipse 42% 32% at 100% 18%, rgba(110, 90, 62, 0.1), transparent 50%),
        linear-gradient(180deg, #f5edd9 0%, #ebe0c8 46%, #dccdb0 100%);
    }
    .atmosphere::after {
      content: "";
      position: absolute; inset: 0; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .watermark {
      position: fixed; right: 18px; top: 24%; width: 90px; height: 72px;
      opacity:.035; pointer-events:none; z-index:0;
      background:
        linear-gradient(90deg, rgba(28,24,20,.8) 0 42%, transparent 42% 58%, rgba(28,24,20,.8) 58%) 0 0/100% 6px no-repeat,
        linear-gradient(90deg, rgba(28,24,20,.8) 0 42%, transparent 42% 58%, rgba(28,24,20,.8) 58%) 0 22px/100% 6px no-repeat,
        linear-gradient(90deg, rgba(28,24,20,.8), rgba(28,24,20,.8)) 0 44px/100% 6px no-repeat;
    }
    .shell {
      position: relative; z-index: 1;
      width: min(393px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .nav {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center;
      min-height: 46px;
      padding: 4px 12px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 15px;
      font-family: "Songti SC", serif;
    }
    .nav.home-hidden { display: none; }
    .nav-title { display: none; }
    .nav-back {
      position: static;
      display: none; align-items: center; gap: 2px;
      border: 0; background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 15px; letter-spacing: 0.16em; text-indent: 0;
      padding: 8px 4px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .nav-back.show { display: inline-flex; }
    .nav-back .chev { color: var(--cinnabar); font-size: 21px; line-height: 1; margin-top: -1px; }
    .shell.swipe-hint { box-shadow: inset 3px 0 0 rgba(160, 40, 32, 0.35); }
    .content {
      padding: 10px 16px 40px;
      flex: 1;
      animation: pageIn .42s ease both;
    }
    .hero.quiet { padding: 8px 4px 2px; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

      src: url("data:font/woff;base64,d09GRgABAAAAAArgAAsAAAAAELAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAABPUy8yAAABeAAAAEUAAABgh92iHGNtYXAAAAHMAAAAMwAAADx30EMaZ2FzcAAACtgAAAAIAAAACP//AANnbHlmAAACCAAAB60AAAy8Q0w0iWhlYWQAAAEIAAAANgAAADYjLqvlaGhlYQAAAUAAAAAgAAAAJAgEBCpobXR4AAABwAAAAAwAAAAMC/8CVWxvY2EAAAIAAAAACAAAAAgD1wZebWF4cAAAAWAAAAAYAAAAIAAKAxVuYW1lAAAJuAAAAPIAAAHKI047XHBvc3QAAAqsAAAAKQAAADh67kVzAAEAAAABAAAFpUIrXw889QABBAAAAAAA2YsMDwAAAADmj1xgAPP/TwMNAxkAAAAZAAEAAAAAAAB4nGNgZGBgNvlvwnCGhYHhC8MnZj4GoAgKYAYAa8UEN3icY2BkYGBgZhZhYGMAAUYGNAAAA20AI3icY2Bm/s84gYGVgYEJCEEAQgOxMSMLkGZk42RgBAGQHAcDAigAAYNDSEaaMLPJfxOGM8xADBRmhJpxFqSEgQEAPmcIHQAAAAQAAD8EAAD0A/8BInicY2BgYGJgYGAGYhEgyQimWRg0gDQbkGZkYArJSBP+/5+BAUKvnjnzPVgVEAAApgMJngAAAAAAA9cGXnicTVbLjuRIFS3fuPFw2Gnnw2F3VnZ2ddlV6aGbgp60naaahwAJ8dAMSAiJH2DDYoQEEh+B+AP+gH/gU9jAjgWLgfUM54azxWT6EY6473vjnrgxN//58o9qRZ/TM31Gf6V/qVLtbm6S4dyYcA5tqAYbKhuaeWguw1AHvMehmevhMsiNyWk+TXGpa0BZB2OrobIV+AMeFm9cIgbDrm5sU9kGJCYIhww6GUQqCABF1Y1dmBsL9bYerLDOA1aEIpIE0NiqO03tNHfTOJz6cR776TK1/Tz18o1RZ0899EIKOJqvXPUwN/M0itVz3cgyjLZhsD0EXz0wnbGnrsVUO7Wh7U/9ZZrG/jKP3WU6Tef5MlfN4mJXNWcJB+SBYOjndrK9gQsVJNixN9GPJpgOroozVQO3QoiREV2woGvagIAjHOIeaONCFDgPInQcJmjGcBrCMELFOFQD/J2GqZ/784wRVs4wD7bhnqZeVkHWT7OQCI/M4r4Mp+gElsbl7mRK4oGwIXqTBEbsgZnVh6RKMmPWxVFh6yQYkC1jKBuhBEm4NL0kCamMJSEFMl3jI0QI69hXXd+GHvFB7hBga5qur+zYdUjCeQJjc57OTaytekCyltBfH6eu6ro2BlhuCAzIkcWUFcFGLlQKMofkN3YI9tw00B6zXg/jcIZRFWIoFYAa6XbCZSexyFjkCFwDDJZCvyDNEHOarA7nicrdhiwx4crIJ4o4kG/YMyV4WM2smNyeHgm/1FAubyZDy5vAQfLFRNcpGTlWehkp/BYOZjalu6d7DMkYSj9I0ZqOrX5vDH348ZE91AZdpyJdJBlR3arwZA1xviL66JRzVM3QsfJbUJU2wwMzssC8wuvnmPCRhHixhMhTKh6nbO1CSi7eq+LFKtqgVBqnmaOpbKDd6ZQ12ZTw5XnxE39mCcDVebdEQ6ZBFh4NqUQEsvG8VT9rrpH4v5uIaP4pHYh3Kw2vtNt4vl/ixup2i3fGDso1q9R5IyniVCKb2JLYQXf2yF5EFU5XLls0k/4D+J1m72GfZldopfPFLIdXMPjmooQbuFYQhu9vwcodQsMnNu+8MaucQwFm1p3/4h9Mn38vf0JKfJNoUFF020j0YRUVpU3e25q9mHCHQFy0KlKvFe+5CJBO/sBU6C1ywkibuAa791btYBLTjngjkRYLUzGrlMga6LAg2zwXKYV7U5X0Kyysf53r5JC5nF5qyY1YkDfwTy05KZXW986hcHW2oT2MUB46yIX0gdXm9s6YmIOPjz9xqd     /* frames */
    .frame {
      position: relative;
      border: 1px solid var(--line-strong);
      background: rgba(250, 246, 234, 0.72);
      padding: 18px 15px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(250,246,234,0.35);
    }
    .frame::before {
      content: "";
      position: absolute; inset: 6px;
      border: 1px solid rgba(28,24,20,0.07);
      pointer-events: none;
    }
    .corner {
      position: absolute; width: 12px; height: 12px; border-color: var(--bronze-light); border-style: solid; opacity: 0.75;
    }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .title-zh {
      font-family: "Songti SC", serif;
      font-size: 25px; font-weight: 400; letter-spacing: 0.28em; text-indent: 0.28em;
    }
    .subtitle { margin-top: 8px; color: var(--ink-soft); font-size: 14px; letter-spacing: 0.18em; }
    .muted { color: var(--mist); font-size: 15px; line-height: 1.85; }
    .seal {
      display: inline-block;
      color: var(--cinnabar);
      border: 1.5px solid rgba(155, 45, 36, 0.78);
      padding: 4px 10px;
      font-size: 13px;
      letter-spacing: 0.28em;
      background: rgba(155, 45, 36, 0.04);
      font-family: "Songti SC", serif;
      transform: rotate(-1.2deg);
      box-shadow: inset 0 0 0 1px rgba(155,45,36,0.12);
    }
    .ornament {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 12px 0; color: var(--bronze); letter-spacing: 0.24em; font-size: 13px;
    }
    .ornament::before, .ornament::after {
      content: ""; width: 34px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--bronze), transparent);
    }

    .btn {
      width: 100%; border-radius: 0; border: 1px solid var(--ink);
      padding: 13px 0; font-size: 16px; letter-spacing: 0.36em; text-indent: 0.36em;
      cursor: pointer; font-family: inherit; margin-bottom: 8px;
      transition: transform .15s ease, background .2s ease, color .2s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: linear-gradient(180deg, #9d9588, #81796e);
      color: #fff;
      border-color: #756e64;
      box-shadow: 0 10px 24px rgba(42,34,28,0.12);
    }
    .btn-ghost {
      background: linear-gradient(180deg, #9d9588, #81796e);
      color: #fff;
      border-color: #756e64;
    }
    .btn:disabled {
      opacity: 1; cursor: not-allowed; box-shadow: none;
      color: #fff; background: #9a9182; border-color: #8c8375;
    }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }

    input {
      width: 100%; margin-top: 6px; padding: 11px 0;
      border: none; border-bottom: 1px solid var(--line-strong);
      background: transparent; font-family: inherit; font-size: 17px;
      letter-spacing: 0.06em; color: var(--ink); outline: none;
    }

    /* hero */
    .hero { text-align: center; padding: 22px 4px 8px; position: relative; }
    .hero-bagua {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      margin: 8px auto 18px; opacity: 0.55;
    }
    .hero-bagua span {
      display: block; height: 3px; border-radius: 1px;
      background: var(--ink); animation: yaoBreath 2.8s ease-in-out infinite;
    }
    .hero-bagua .yang { width: 54px; }
    .hero-bagua .yin { width: 54px; background: transparent; border-top: 3px solid var(--ink); height: 0; position: relative; }
    .hero-bagua .yin::before, .hero-bagua .yin::after {
      content: ""; position: absolute; top: -3px; height: 3px; width: 22px; background: var(--ink);
    }
    .hero-bagua .yin::before { left: 0; }
    .hero-bagua .yin::after { right: 0; }
    .hero-bagua span:nth-child(2) { animation-delay: .15s; }
    .hero-bagua span:nth-child(3) { animation-delay: .3s; }
    .hero-bagua span:nth-child(4) { animation-delay: .45s; }
    .hero-bagua span:nth-child(5) { animation-delay: .6s; }
    .hero-bagua span:nth-child(6) { animation-delay: .75s; }
    @keyframes yaoBreath {
      0%,100% { opacity: .35; transform: scaleX(.92); }
      50% { opacity: .8; transform: scaleX(1); }
    }
    .brand {
      font-size: 68px; line-height: .95; letter-spacing: 0.42em; text-indent: 0.42em;
      font-weight: 600; margin: 4px 0 2px;
      text-shadow: 0 1px 0 rgba(246,237,216,0.35);
    }
    .brand-sub {
      font-size: 19px; letter-spacing: 0.84em; text-indent: 0.84em; color: var(--bronze);
      margin-bottom: 4px;
    }
    .hero-copy {
      max-width: 330px; margin: 0 auto 8px; color: var(--mist); font-size: 15.5px; line-height: 1.95;
    }
    .feature-strip {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin: 18px 0 16px;
    }
    .feature {
      text-align: center; padding: 12px 6px;
      border: 1px solid var(--line);
      background: rgba(246,237,216,0.4);
    }
    .feature b {
      display: block; font-size: 16px; letter-spacing: 0.2em; margin-bottom: 4px; font-weight: 600;
    }
    .feature span { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.08em; }
    .link-row {
      display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 14px;
    }
    .text-link {
      letter-spacing: 0.3em; font-size: 15px; color: var(--ink); padding: 8px 2px; cursor: pointer;
      border-bottom: 1px solid transparent;
    }
    .text-link:active { border-bottom-color: var(--cinnabar); color: var(--cinnabar); }
    .dot { color: var(--bronze); opacity: .7; }

    /* cast */
    .mode-row { display: flex; border-bottom: 1px solid var(--line); margin: 12px 0 16px; }
    .mode {
      flex: 1; text-align: center; padding: 11px 0; font-size: 15px; letter-spacing: 0.18em;
      color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
    }
    .mode.on { color: var(--cinnabar); border-bottom-color: var(--cinnabar); }
    .progress {
      display: flex; justify-content: center; gap: 8px; margin: 4px 0 14px;
    }
    .bead {
      width: 10px; height: 10px; border: 1px solid var(--bronze); transform: rotate(45deg);
      background: transparent; transition: background .25s ease, border-color .25s ease;
    }
    .bead.on { background: var(--cinnabar); border-color: var(--cinnabar); }
    .stage-live {
      display: flex; gap: 14px; align-items: stretch;
      margin-top: 8px; overflow: visible; padding-top: 118px;
    }
    .coin-stage {
      flex: 1.15; text-align: center;
      display: flex; flex-direction: column; overflow: visible;
    }
    .coin-stage .btn { margin-bottom: 0; }
    .gua-side {
      flex: 0.85; min-width: 96px; min-height: 180px; padding: 0 2px 0 10px;
      border-left: 1px dashed var(--line); box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .stage-live .gua-side { min-height: 0; border-left: 1px dashed var(--line); }
    .gua-side .gua-lab {
      margin: 0 0 10px; font-size: 14px; letter-spacing: 0.28em; text-indent: 0.28em;
      color: var(--bronze); text-align: center;
    }
    .stage-live .gua-side .gua-lab {
      position: absolute; left: 10px; right: 2px; top: -28px; margin: 0;
    }
    .gua-side .gua-lines {
      flex: 1; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; gap: 0;
    }
    .yao-bar {
      display: block; width: 56px; height: 5px; margin: 0 auto; position: relative; box-sizing: border-box;
    }
    .yao-bar.sm { width: 42px; height: 4px; }
    .yao-bar.lg { width: 88px; height: 7px; }
    .yao-bar.yang { background: var(--ink); }
    .yao-bar.yin {
      background: linear-gradient(90deg, var(--ink) 0 42%, transparent 42% 58%, var(--ink) 58% 100%);
    }
    .yao-bar.moving::after {
      content: ""; position: absolute; right: -10px; top: 50%; width: 5px; height: 5px;
      margin-top: -2.5px; border-radius: 50%; background: var(--cinnabar);
    }
    .mini-yao {
      height: 11px; margin: 0 auto; position: relative; width: 78px;
      background: rgba(20,15,12,0.1);
    }
    .mini-yao.filled.yang { background: var(--ink); }
    .mini-yao.filled.yin {
      background: linear-gradient(90deg, var(--ink) 0 42%, transparent 42% 58%, var(--ink) 58% 100%);
    }
    .mini-yao.filled.moving::after {
      content: ""; position: absolute; right: -12px; top: 50%; width: 7px; height: 7px;
      margin-top: -3.5px; border-radius: 50%; background: var(--cinnabar);
    }
    .coins {
      position: relative;
      display: flex; justify-content: center; gap: 10px; margin: 0 0 4px;
      height: 72px; min-height: 72px; align-items: flex-end; padding-bottom: 12px;
      box-sizing: border-box; overflow: visible; perspective: 640px;
      transform-style: preserve-3d;
    }
    .coins::after {
      content: ""; position: absolute; left: 12%; right: 12%; bottom: 10px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(90,70,40,.28), transparent);
      pointer-events: none;
    }
    .shake .coin-body {
      transform-style: preserve-3d; transform-origin: center center;
      animation: toss-drop 1.35s cubic-bezier(.33,.02,.2,1) both;
      will-change: transform;
    }
    .shake .coin:nth-child(1) .coin-body {
      animation-name: toss-drop-a; animation-duration: 1.32s; animation-delay: 0ms;
    }
    .shake .coin:nth-child(2) .coin-body {
      animation-name: toss-drop-b; animation-duration: 1.4s; animation-delay: 55ms;
    }
    .shake .coin:nth-child(3) .coin-body {
      animation-name: toss-drop-c; animation-duration: 1.48s; animation-delay: 110ms;
    }
    .shake .coin-shadow {
      animation: toss-shadow 1.35s cubic-bezier(.33,.02,.2,1) both;
      will-change: transform, opacity;
    }
    .shake .coin:nth-child(1) .coin-shadow {
      animation-name: toss-shadow-a; animation-duration: 1.32s; animation-delay: 0ms;
    }
    .shake .coin:nth-child(2) .coin-shadow {
