<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>周易研习</title>
  <style>
    :root {
      --ink: #1c1814;
      --ink-2: #2e261f;
      --ink-soft: #5c5146;
      --mist: rgba(28, 24, 20, 0.5);
      --paper: #ebe0c8;
      --paper-deep: #d9c9a8;
      --cream: #faf6ea;
      --cinnabar: #9b2d24;
      --cinnabar-deep: #7a221c;
      --cinnabar-soft: rgba(155, 45, 36, 0.1);
      --bronze: #6e5a3e;
      --bronze-soft: rgba(110, 90, 62, 0.14);
      --bronze-light: #a08a62;
      --line: rgba(28, 24, 20, 0.1);
      --line-strong: rgba(28, 24, 20, 0.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
      color: var(--ink);
      background: #dccdb0;
      letter-spacing: 0.02em;
      line-height: 1.8;
    }
    .atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 110% 58% at 50% -14%, rgba(250, 246, 234, 0.95), transparent 58%),
        radial-gradient(ellipse 48% 36% at 0% 88%, rgba(155, 45, 36, 0.04), transparent 52%),
        radial-gradient(ellipse 42% 32% at 100% 18%, rgba(110, 90, 62, 0.1), transparent 50%),
        linear-gradient(180deg, #f5edd9 0%, #ebe0c8 46%, #dccdb0 100%);
    }
    .atmosphere::after {
      content: "";
      position: absolute; inset: 0; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .watermark {
      position: fixed; right: 18px; top: 24%; width: 90px; height: 72px;
      opacity:.035; pointer-events:none; z-index:0;
      background:
        linear-gradient(90deg, rgba(28,24,20,.8) 0 42%, transparent 42% 58%, rgba(28,24,20,.8) 58%) 0 0/100% 6px no-repeat,
        linear-gradient(90deg, rgba(28,24,20,.8) 0 42%, transparent 42% 58%, rgba(28,24,20,.8) 58%) 0 22px/100% 6px no-repeat,
        linear-gradient(90deg, rgba(28,24,20,.8), rgba(28,24,20,.8)) 0 44px/100% 6px no-repeat;
    }
    .shell {
      position: relative; z-index: 1;
      width: min(393px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .nav {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center;
      min-height: 46px;
      padding: 4px 12px;
      background: linear-gradient(180deg, rgba(245,237,217,0.98), rgba(235,224,200,0.96));
      color: var(--ink-soft);
      font-size: 15px;
      font-family: "Songti SC", serif;
    }
    .nav.home-hidden { display: none; }
    .nav-title { display: none; }
    .nav-back {
      position: static;
      display: none; align-items: center; gap: 2px;
      border: 0; background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 15px; letter-spacing: 0.16em; text-indent: 0;
      padding: 8px 4px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .nav-back.show { display: inline-flex; }
    .nav-back .chev { color: var(--cinnabar); font-size: 21px; line-height: 1; margin-top: -1px; }
    .shell.swipe-hint { box-shadow: inset 3px 0 0 rgba(160, 40, 32, 0.35); }
    .content {
      padding: 10px 16px 40px;
      flex: 1;
      animation: pageIn .42s ease both;
    }
    .content.has-page-footer {
      padding-bottom: calc(112px + env(safe-area-inset-bottom));
    }
    .page-footer {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: min(361px, calc(100vw - 32px));
      display: flex;
      gap: 10px;
      padding: 18px 0 max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      border-top: 1px solid rgba(110,90,62,.18);
      background: linear-gradient(180deg, rgba(235,224,200,.82), rgba(235,224,200,.98) 18px, #dccdb0 100%);
      box-shadow: 0 -10px 24px rgba(28,24,20,.08);
    }
    .page-footer .btn {
      flex: 1;
      width: auto;
      min-width: 0;
      margin: 0 !important;
    }
    .page-footer.single .btn { width: 100%; }
    .hero.quiet { padding: 8px 4px 2px; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* frames */
    .frame {
      position: relative;
      border: 1px solid var(--line-strong);
      background: rgba(250, 246, 234, 0.72);
      padding: 18px 15px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(250,246,234,0.35);
    }
    .frame::before {
      content: "";
      position: absolute; inset: 6px;
      border: 1px solid rgba(28,24,20,0.07);
      pointer-events: none;
    }
    .corner {
      position: absolute; width: 12px; height: 12px; border-color: var(--bronze-light); border-style: solid; opacity: 0.75;
    }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .title-zh {
      font-family: "Songti SC", serif;
      font-size: 25px; font-weight: 400; letter-spacing: 0.28em; text-indent: 0.28em;
    }
    .subtitle { margin-top: 8px; color: var(--ink-soft); font-size: 14px; letter-spacing: 0.18em; }
    .cast-title {
      text-align: center; font-size: 32px; line-height: 1.25;
    }
    .cast-subtitle {
      margin-top: 6px; text-align: center; font-size: 16px;
      letter-spacing: .2em; text-indent: .2em;
    }
    .muted { color: var(--mist); font-size: 15px; line-height: 1.85; }
    .seal {
      display: inline-block;
      color: var(--cinnabar);
      border: 1.5px solid rgba(155, 45, 36, 0.78);
      padding: 4px 10px;
      font-size: 13px;
      letter-spacing: 0.28em;
      background: rgba(155, 45, 36, 0.04);
      font-family: "Songti SC", serif;
      transform: rotate(-1.2deg);
      box-shadow: inset 0 0 0 1px rgba(155,45,36,0.12);
    }
    .ornament {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 12px 0; color: var(--bronze); letter-spacing: 0.24em; font-size: 13px;
    }
    .ornament::before, .ornament::after {
      content: ""; width: 34px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--bronze), transparent);
    }

    .btn {
      width: 100%; border-radius: 0; border: 1px solid var(--ink);
      padding: 13px 0; font-size: 16px; letter-spacing: 0.36em; text-indent: 0.36em;
      cursor: pointer; font-family: inherit; margin-bottom: 8px;
      transition: transform .15s ease, background .2s ease, color .2s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: linear-gradient(180deg, #9d9588, #81796e);
      color: #fff;
      border-color: #756e64;
      box-shadow: 0 10px 24px rgba(42,34,28,0.12);
    }
    .btn-ghost {
      background: linear-gradient(180deg, #9d9588, #81796e);
      color: #fff;
      border-color: #756e64;
    }
    .btn:disabled {
      opacity: 1; cursor: not-allowed; box-shadow: none;
      color: #fff; background: #9a9182; border-color: #8c8375;
    }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }

    input {
      width: 100%; margin-top: 6px; padding: 11px 0;
      border: none; border-bottom: 1px solid var(--line-strong);
      background: transparent; font-family: inherit; font-size: 17px;
      letter-spacing: 0.06em; color: var(--ink); outline: none;
    }

    /* hero */
    .hero { text-align: center; padding: 22px 4px 8px; position: relative; }
    .hero-bagua {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      margin: 8px auto 18px; opacity: 0.55;
    }
    .hero-bagua span {
      display: block; height: 3px; border-radius: 1px;
      background: var(--ink); animation: yaoBreath 2.8s ease-in-out infinite;
    }
    .hero-bagua .yang { width: 54px; }
    .hero-bagua .yin { width: 54px; background: transparent; border-top: 3px solid var(--ink); height: 0; position: relative; }
    .hero-bagua .yin::before, .hero-bagua .yin::after {
      content: ""; position: absolute; top: -3px; height: 3px; width: 22px; background: var(--ink);
    }
    .hero-bagua .yin::before { left: 0; }
    .hero-bagua .yin::after { right: 0; }
    .hero-bagua span:nth-child(2) { animation-delay: .15s; }
    .hero-bagua span:nth-child(3) { animation-delay: .3s; }
    .hero-bagua span:nth-child(4) { animation-delay: .45s; }
    .hero-bagua span:nth-child(5) { animation-delay: .6s; }
    .hero-bagua span:nth-child(6) { animation-delay: .75s; }
    @keyframes yaoBreath {
      0%,100% { opacity: .35; transform: scaleX(.92); }
      50% { opacity: .8; transform: scaleX(1); }
    }
    .brand {
      font-size: 68px; line-height: .95; letter-spacing: 0.42em; text-indent: 0.42em;
      font-weight: 600; margin: 4px 0 2px;
      text-shadow: 0 1px 0 rgba(246,237,216,0.35);
    }
    .brand-sub {
      font-size: 19px; letter-spacing: 0.84em; text-indent: 0.84em; color: var(--bronze);
      margin-bottom: 4px;
    }
    .hero-copy {
      max-width: 330px; margin: 0 auto 8px; color: var(--mist); font-size: 15.5px; line-height: 1.95;
    }
    .feature-strip {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin: 18px 0 16px;
    }
    .feature {
      text-align: center; padding: 12px 6px;
      border: 1px solid var(--line);
      background: rgba(246,237,216,0.4);
    }
    .feature b {
      display: block; font-size: 16px; letter-spacing: 0.2em; margin-bottom: 4px; font-weight: 600;
    }
    .feature span { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.08em; }
    .link-row {
      display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 14px;
    }
    .text-link {
      letter-spacing: 0.3em; font-size: 15px; color: var(--ink); padding: 8px 2px; cursor: pointer;
      border-bottom: 1px solid transparent;
    }
    .text-link:active { border-bottom-color: var(--cinnabar); color: var(--cinnabar); }
    .dot { color: var(--bronze); opacity: .7; }

    /* cast */
    .mode-row { display: flex; border-bottom: 1px solid var(--line); margin: 12px 0 16px; }
    .mode {
      flex: 1; text-align: center; padding: 11px 0; font-size: 15px; letter-spacing: 0.18em;
      color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
    }
    .mode.on { color: var(--cinnabar); border-bottom-color: var(--cinnabar); }
    .progress {
      display: flex; justify-content: center; gap: 8px; margin: 4px 0 14px;
    }
    .cast-shake-slot {
      position: relative; display: block;
      width: 150px; height: 56px; min-height: 0;
      margin: 4px auto 8px; padding: 0;
      overflow: hidden; border-width: 2px;
      border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
      color: #fff8e8;
      border-color: #56442f;
      background: linear-gradient(180deg, #8b7451, #655139);
      box-shadow: inset 0 0 0 4px rgba(255,248,225,.12), inset 0 1px 0 rgba(255,255,255,.2), 0 3px 8px rgba(73,54,34,.14);
    }
    .cast-shake-slot .shell-inset {
      position: absolute; inset: 7px 18px;
      border: 1px solid rgba(255,244,211,.45);
      border-radius: 50%; pointer-events: none;
    }
    .cast-shake-slot .shell-inset::before,
    .cast-shake-slot .shell-inset::after {
      content: ""; position: absolute; left: 50%; top: -5%;
      width: 1px; height: 110%; background: rgba(255,244,211,.24);
      transform-origin: 50% 50%;
    }
    .cast-shake-slot .shell-inset::before { transform: rotate(34deg); }
    .cast-shake-slot .shell-inset::after { transform: rotate(-34deg); }
    .cast-shake-slot .shell-label {
      position: relative; z-index: 2; letter-spacing: .22em; text-indent: .22em;
    }
    .bead {
      width: 10px; height: 10px; border: 1px solid var(--bronze); transform: rotate(45deg);
      background: transparent; transition: background .25s ease, border-color .25s ease;
    }
    .bead.on { background: var(--cinnabar); border-color: var(--cinnabar); }
    .stage-live {
      display: flex; gap: 14px; align-items: stretch;
      margin-top: 4px; overflow: visible; padding-top: 108px;
    }
    .coin-stage {
      flex: 1.15; text-align: center;
      display: flex; flex-direction: column; overflow: visible;
    }
    .coin-stage .btn { margin-bottom: 0; }
    .gua-side {
      flex: 0.85; min-width: 96px; min-height: 180px; padding: 0 2px 0 10px;
      border-left: 1px dashed var(--line); box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .stage-live .gua-side {
      min-height: 0; border-left: 1px dashed var(--line);
      transform: translateY(-10px);
    }
    .gua-side .gua-lab {
      margin: 0 0 10px; font-size: 14px; letter-spacing: 0.28em; text-indent: 0.28em;
      color: var(--bronze); text-align: center;
    }
    .stage-live .gua-side .gua-lab {
      position: absolute; left: 10px; right: 2px; top: -28px; margin: 0;
    }
    .gua-side .gua-lines {
      flex: 1; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; gap: 0;
    }
    .yao-bar {
      display: block; width: 56px; height: 5px; margin: 0 auto; position: relative; box-sizing: border-box;
    }
    .yao-bar.sm { width: 42px; height: 4px; }
    .yao-bar.lg { width: 88px; height: 7px; }

    .shake .coin-body {
      transform-style: preserve-3d; transform-origin: center center;
      animation: toss-drop 1.35s cubic-bezier(.33,.02,.2,1) both;
      will-change: transform;
    }
    .shake .coin:nth-child(1) .coin-body {
      animation-name: toss-drop-a; animation-duration: 1.32s; animation-delay: 0ms;
    }
    .shake .coin:nth-child(2) .coin-body {
      animation-name: toss-drop-b; animation-duration: 1.4s; animation-delay: 55ms;
    }
    .shake .coin:nth-child(3) .coin-body {
      animation-name: toss-drop-c; animation-duration: 1.48s; animation-delay: 110ms;
    }
    .shake .coin-shadow {
      animation: toss-shadow 1.35s cubic-bezier(.33,.02,.2,1) both;
      will-change: transform, opacity;
    }
    .shake .coin:nth-child(1) .coin-shadow {
      animation-name: toss-shadow-a; animation-duration: 1.32s; animation-delay: 0ms;
    }
    .shake .coin:nth-child(2) .coin-shadow {
      animation-name: toss-shadow-b; animation-duration: 1.4s; animation-delay: 55ms;

    @keyframes toss-drop-a {
      0% { transform: translate3d(-4px, -20px, 0) rotateX(12deg) rotateY(0deg) rotateZ(-28deg) scale(.94); }
      12% { transform: translate3d(-10px, -112px, 0) rotateX(-8deg) rotateY(110deg) rotateZ(-12deg) scale(.9); }
      36% { transform: translate3d(-12px, 2px, 0) rotateX(6deg) rotateY(290deg) rotateZ(16deg) scale(1.04); }
      48% { transform: translate3d(-8px, -38px, 0) rotateX(-4deg) rotateY(400deg) rotateZ(-10deg) scale(.97); }
      62% { transform: translate3d(-5px, 1px, 0) rotateX(3deg) rotateY(500deg) rotateZ(8deg) scale(1.02); }
      74% { transform: translate3d(-3px, -15px, 0) rotateX(-2deg) rotateY(580deg) rotateZ(-4deg) scale(.99); }
      86% { transform: translate3d(-1px, 1px, 0) rotateX(1deg) rotateY(660deg) rotateZ(2deg) scale(1.005); }
      100% { transform: translate3d(0, 0, 0) rotateX(0) rotateY(720deg) rotateZ(0) scale(1); }
    }
    @keyframes toss-drop-b {
      0% { transform: translate3d(0, -14px, 0) rotateX(8deg) rotateY(20deg) rotateZ(10deg) scale(.95); }
      10% { transform: translate3d(2px, -122px, 0) rotateX(-12deg) rotateY(160deg) rotateZ(4deg) scale(.88); }
      34% { transform: translate3d(3px, 3px, 0) rotateX(8deg) rotateY(340deg) rotateZ(-14deg) scale(1.05); }
      46% { transform: translate3d(1px, -44px, 0) rotateX(-6deg) rotateY(450deg) rotateZ(10deg) scale(.96); }
      60% { transform: translate3d(1px, 2px, 0) rotateX(4deg) rotateY(540deg) rotateZ(-6deg) scale(1.02); }
      72% { transform: translate3d(0, -17px, 0) rotateX(-2deg) rotateY(610deg) rotateZ(4deg) scale(.99); }
      85% { transform: translate3d(0, 1px, 0) rotateX(1deg) rotateY(680deg) rotateZ(-1deg) scale(1.005); }
      100% { transform: translate3d(0, 0, 0) rotateX(0) rotateY(720deg) rotateZ(0) scale(1); }
    }
    @keyframes toss-drop-c {
      0% { transform: translate3d(5px, -18px, 0) rotateX(10deg) rotateY(-15deg) rotateZ(24deg) scale(.93); }
      13% { transform: translate3d(12px, -106px, 0) rotateX(-6deg) rotateY(-130deg) rotateZ(8deg) scale(.9); }
      38% { transform: translate3d(14px, 2px, 0) rotateX(5deg) rotateY(-300deg) rotateZ(-18deg) scale(1.04); }
      50% { transform: translate3d(9px, -35px, 0) rotateX(-3deg) rotateY(-410deg) rotateZ(12deg) scale(.97); }
      64% { transform: translate3d(5px, 1px, 0) rotateX(2deg) rotateY(-510deg) rotateZ(-7deg) scale(1.02); }
      76% { transform: translate3d(3px, -13px, 0) rotateX(-1deg) rotateY(-590deg) rotateZ(3deg) scale(.99); }
      88% { transform: translate3d(1px, 1px, 0) rotateX(1deg) rotateY(-670deg) rotateZ(-1deg) scale(1.005); }
      100% { transform: translate3d(0, 0, 0) rotateX(0) rotateY(-720deg) rotateZ(0) scale(1); }
    }
    @keyframes toss-shadow-a {
      0% { transform: translateX(-2px) scaleX(.55); opacity: .12; }
      12% { transform: translateX(-5px) scaleX(.28); opacity: .05; }
      36% { transform: translateX(-6px) scaleX(1.18); opacity: .42; }

      62% { transform: translateX(-3px) scaleX(1.1); opacity: .36; }
      74% { transform: translateX(-2px) scaleX(.62); opacity: .16; }
      86% { transform: translateX(-1px) scaleX(1.04); opacity: .3; }
      100% { transform: translateX(0) scaleX(1); opacity: .28; }
    }
    @keyframes toss-shadow-b {
      0% { transform: scaleX(.55); opacity: .12; }
      10% { transform: scaleX(.24); opacity: .04; }
      34% { transform: scaleX(1.22); opacity: .44; }
      46% { transform: scaleX(.42); opacity: .1; }

    @keyframes toss-shadow-c {

    @keyframes toss-drop {

      "六五：悔亡，失得勿恤，往吉无不利。",

  "明夷": {

  "家人": {

  "睽": {

  "蹇": {

      "九三：往蹇来反。",
      "六四：往蹇来连。",

      "上六：往蹇来硕，吉；利见大人。"

  "解": {
    "nameWhy": "外震为雷、内坎为水。雷雨作而百果草木皆甲拆，险难纾解，故名「解」。解有缓解、解脱之义。",
    "guaci": "利西南，无所往，其来复吉。有攸往，夙吉。",
    "yaoci": [

      "六五：君子维有解，吉；有孚于小人。",

  "损": {
    "nameWhy": "外艮为山、内兑为泽。山下有泽，损下益上，减损之象，故名「损」。损有减损、损己益人之义。",

      "六四：损其疾，使遄有喜，无咎。",
      "六五：或益之，十朋之龟弗克违，元吉。",

  "益": {
    "nameWhy": "外巽为风、内震为雷。风雷相益，损上益下，民说无疆，故名「益」。益有增益、进益之义。",

  "夬": {

      "九五：苋陆夬夬，中行无咎。",

  "姤": {

  "萃": {

      "六三：萃如，嗟如，无攸利，往无咎，小吝。",
      "九四：大吉，无咎。",

  "升": {

  "困": {

  "井": {

  "革": {

  "鼎": {

  "震": {

  "艮": {

  "渐": {

  "归妹": {

  "丰": {

  "旅": {

  "巽": {

  },
  "兑": {

  "涣": {

  "节": {

  "中孚": {

  "小过": {

function linesToCode(lines) {

const BAIHUA = {"乾":{"g":"卦辞说「元亨利贞」：像春天播种、夏天生长、秋天收获、冬天收藏——事情从开始到完成，要走完整正的过程。整体意思是：这条路可以走，而且能走通；但要守正，不能乱来。","y":"乾卦六爻全是阳，像天一样刚强、不停运转。它鼓励你自强、担当、开创；也提醒：太刚到顶点会折断。新手记住两句就够——「能做就认真做，快到顶就别再硬冲」。","z":["多主事业、升学、开创、领导、男性求测者自身状态。","宜进取、担当、公开做事；忌骄傲、急躁、盛气凌人。","若问「能不能成」：有气、有进象时偏可成，但上爻动要防乐极生悲。","普通人用法：把精力用在可验证的下一步，不拿一时顺遂当永久成功。"],"yao":["初九「潜龙勿用」：能力还没露头，像龙潜在水底。这时别急着强出头，先学习、先准备，时机未到硬冲容易碰壁。","九二「见龙在田」：开始被看见了，有表现机会。宜主动接触靠谱的人、把成果亮出来，但仍要稳。","九三「终日乾乾」：白天努力、晚上反省。事情进入忙碌期，勤能补拙；粗心、松劲就会出事。","九四「或跃在渊」：可上可下，进退两可。别一把梭，先试探、再决定是否全力跃起。","九五「飞龙在天」：正当其位、力量最足。适合拍板、推进、承担责任；仍要守正，勿飘。","上九「亢龙有悔」：过刚则折，再往上冲会后悔。宜见好就收、留余地，别在最高点硬加码。"]},"姤":{"g":"姤是「突然相遇」。像路上忽然碰到一个人、一个机会。卦辞提醒：这种相遇有力量，但未必适合立刻「全盘接受」——尤其不能因为一时吸引就定终身。","y":"一阴生在五阳之下，象征新因素悄悄进来。可能是机会，也可能是干扰。新手要做的是：先观察、慢绑定，别一见倾心就签字、借钱、交心。","z":["多主偶遇、新机会、新关系、突发消息。","宜接触、了解、小范围试；忌立刻深度绑定或重仓投入。","感情上尤忌「见色起意、立刻定局」；合作上忌口头热乎就合伙。","动爻若在初，多是事端刚起；宜控节奏。"],"yao":["初六：新因素刚露头，像车轮被销住。先稳住，别急着往前冲；有约会、有机会，也先看清对方。","九二：怀里有「鱼」——有所得，但不宜到处炫耀或随便请客分享核心利益。","九三：走得艰难，像皮肤破了。行动不便，宜缓，勿硬撑大场面。","九四：空有形式、没有实惠。别被表面热闹骗了，核实内容再动。","九五：外表光鲜，内有章法。可从容应对突发，也可能有从天而降的变动，保持清醒。","上九：走到角落，进退别扭。相遇已到尾声，强求无益，收场即可。"]},"遁":{"g":"遁是「退避、抽身」。不是怂，而是天时不利时保存力量。卦辞说小有利贞：可以守住原则，但别硬闯。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，小利贞。」。","y":"天下有山，山再高也顶不到天——说明有界限。当环境变差，主动退后一步，才能以后再进。新手常误以为「退=失败」；其实乱进才失败。","z":["多主离职、分手缓冲、撤资、回避冲突、暂时低调。","宜抽身、减负、止损；忌硬刚、恋战、面子工程。","问「要不要退」：遁卦常支持有计划地退，不是狼狈逃。","退时留后路、留体面，勿撕破脸。（结合你的实际情况慢慢对照即可。）"],"yao":["初六：逃得太晚、尾部还露在外面，危险。该断就断，别拖泥带水。","六二：像被黄牛皮捆住，动不了也拆不掉。宜坚守既定退路，勿临时变卦。","九三：想退又被牵住（疾病、下属、琐事）。先处理拖累，再谈脱身。","九四：君子知机而退则吉，看不清还硬撑的人则凶。关键在「认不认账」。","五爻（核心位置）：九五：漂亮的撤退，时机对、姿态稳，值得肯定。经文大意是「嘉遁，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：退得彻底、轻快，无不利。适合彻底放下、换赛道。经文大意是「肥遁，无不利。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"否":{"g":"否是「不通、闭塞」。上下不来往，像领导听不进话、合作谈不拢、消息传不动。卦辞说对君子不利硬撑正道去硬闯——不是不守正，而是环境暂不允许硬顶。","y":"天地不交，万物不通。这不是「你不行」，常是「局不对」。新手策略：收缩开支与期望，先活下来，等局面松动再进取。","z":["多主冷战、政策收紧、合作破裂、求职碰壁、沟通失效。","宜守成、节省、少开新战线；忌强推、死磕、赌气加码。","问「能不能成」：短期内多偏难，除非有明确转机（如倾否之象）。","可做：复盘、补短板、维持基本盘。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：同类一起退守，守住本分反而通达。别一个人硬冲。经文大意是「拔茅茹，以其汇，贞吉亨。」。零基础可记：看清这一步该进还是该守，别跳步。","六二：小人得势时的「包容」或表面承顺；大人宜承认否塞、勿装没事。","三爻（进退关口）：六三：包藏羞耻之事，局面难堪。宜止损，别再遮掩。经文大意是「包羞。」。零基础可记：看清这一步该进还是该守，别跳步。","九四：有命令、有转机，无咎。闭塞中出现规则或安排，可借力。","五爻（核心位置）：九五：停止否塞，大人吉。局面开始好转，仍须谨慎操作。经文大意是「休否，大人吉。其亡其亡，系于苞桑。」。零基础可记：看清这一步该进还是该守，别跳步。","上九：否极泰来的翻转。先苦后喜，但别在翻转前一刻放弃原则。"]},"观":{"g":"观是「看、观察、示范」。卦辞用祭祀前洗手却不急着献祭作比喻：先诚敬地看清楚，再行动。对普通人：先调研，再决策。","y":"风吹过地面，一切无所遁形。这卦教你两件事：①把眼睛擦亮；②自己也要经得起看。新手别急着表态，先搞清楚事实。","z":["多主考察、面试观察期、旅游观光、看盘、旁观局势。","宜调研、学习、旁听；忌草率下注、窥私、道听途说就下结论。","问「能不能成」：往往还在观察阶段，未到拍板时。","童观（看太浅）要不得；要看全局与人心。"],"yao":["初六：像小孩看热闹，只见皮毛。适合随便看看；正经人这样看会吃亏。","六二：门缝里看人，格局小。女性问家事或可；大事上格局不够。","三爻（进退关口）：六三：观察自己的进退。该进该退，对照自身条件定。经文大意是「观我生，进退。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：看见国家/组织的光彩，适合做宾客、参与大场面。经文大意是「观国之光，利用宾于王。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：反观自己的人生，君子无咎。重在自我检视。经文大意是「观我生，君子无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","上九：观察他人的生命状态，君子无咎。重在客观旁观，勿妄评。"]},"剥":{"g":"剥是「剥落、被削掉」。床脚被砍、基础被啃。卦辞说不利有攸往——这时候不适合大举进攻或扩张。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「不利有攸往。」。","y":"山塌在地上，高处往下掉。新手要听懂：先止损、固本，别在地基松时盖楼。留下「硕果」（火种、核心能力）比面子重要。","z":["多主流失、被边缘化、裁员风险、身体亏虚、关系冷淡。","宜收缩、保养、守核心；忌扩张、硬刚、死撑门面。","问「还能不能做」：宜减配，不宜加仓。","上九有硕果：最坏时仍可留后路。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：床脚被剥，根基开始坏。小事也要当大事，尽早补。经文大意是「剥床以足，蔑贞凶。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：剥到床板，危险加重。蔑视警告会凶。经文大意是「剥床以辨，蔑贞凶。」。零基础可记：看清这一步该进还是该守，别跳步。","六三：在剥落中反而无咎——可能是及时抽身、不跟坏局沉沦。","四爻（接近结果）：六四：剥到肌肤，伤及自身。必须停损。经文大意是「剥床以肤，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：像串鱼一样被宫人宠——以柔顺得安，不宜逞强。经文大意是「贯鱼，以宫人宠，无不利。」。零基础可记：看清这一步该进还是该守，别跳步。","上九：大果子没被吃掉。君子得车（有承接），小人剥庐（连住的都没了）。留住核心资产。"]},"晋":{"g":"晋是「前进、晋升、太阳升起」。康侯白天多次被接见、赏赐——表示被看见、被肯定、往上走。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「康侯用锡马蕃庶，昼日三接。」。","y":"明出地上，光明展开。新手可把晋理解成：表现期、升职窗口、名声扩散。仍要实，不要像「鼫鼠」只想占位。","z":["多主升职、评优、曝光、成绩公布、事业上台阶。","宜表现、汇报、争取可见度；忌弄虚作假、急于求成。","问「能不能升」：象偏进，但要看是否实至名归。","失得勿恤：别患得患失，往前做。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：前进受挫，仍守正就吉。暂时不被信，也从容。经文大意是「晋如摧如，贞吉。罔孚，裕无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：边进边愁，但终受大福。焦虑正常，别停。经文大意是「晋如愁如，贞吉。受兹介福，于其王母。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：众人信任，悔消。靠群众/同事认可推进。经文大意是「众允，悔亡。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：像田鼠一样贪进则危。别用歪门邪道抢位置。经文大意是「晋如鼫鼠，贞厉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：别计较得失，往前则吉。心态放宽。经文大意是「悔亡，失得勿恤，往吉无不利。」。零基础可记：看清这一步该进还是该守，别跳步。","上九：用角去攻城，宜伐邑——只适合局部整顿，不宜盲目全面开战。"]},"大有":{"g":"大有是「大有收获、资源很多」。元亨——整体通达。像盘子里东西已经很多，关键在会不会用、会不会守。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「元亨。」。","y":"火在天上，光明普照。新手记住：有了不等于守得住。谦虚、分享、制度化，比炫耀重要。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主财帛丰厚、项目成果、人气、资源聚合。","宜善用资源、建立规则；忌骄傲、挥霍、树敌。","问求财：偏有成象，仍看用神是否落实。","自天祐之：顺势守正，反而更稳。（结合你的实际情况慢慢对照即可。）"],"yao":["初九：无交害，还没牵扯复杂关系，无咎。开始阶段保持单纯。","二爻（进展）：九二：大车装得动，可以远行。有承载力再扩张。经文大意是「大车以载，有攸往，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：王公宴享天子——到了大场面，守礼节。经文大意是「公用亨于天子，小人弗克。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：不要太膨胀（匪其彭），无咎。收敛锋芒。经文大意是「匪其彭，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：诚信交接又有威严，吉。软硬都要有。经文大意是「厥孚交如，威如，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：得天助，吉无不利。圆满收官之象，仍勿狂。经文大意是「自天祐之，吉无不利。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"坤":{"g":"卦辞大意：利于像母马那样稳健、顺从正道；君子有所往时，抢先容易迷路，随后有主心骨才顺利；偏西南得朋友，东北可能失朋友；安于正道则吉。","y":"坤是地，六爻皆阴，强调承载、配合、后发。新手常误以为「顺=软弱」；其实坤是「把事情托住」的力量。先站稳位置，再谈进取。","z":["多主家宅、土地、母亲长辈、下属、配合方、女性求测者。","宜守成、协助、积累；忌抢功、争先、硬刚。","问「能不能成」：偏慢、偏稳，条件齐了才成。","先迷后得主：别一上来就当大哥，先找对方向与依靠。"],"yao":["初六「履霜坚冰至」：脚下有霜，坚冰快来了。坏事刚露头就要防，别等结成冰。","六二「直方大」：内心正直、行为端方。不靠小聪明，反而处处顺利。","六三「含章可贞」：才华先含着，跟从公事可有好结果，但别把功劳全据为己有。","六四「括囊」：把口袋扎紧——少说话、少出风头，这样无咎也无夸。适合低调期。","六五「黄裳元吉」：居中守谦，像穿黄色下衣（中正之色），大吉。","上六「龙战于野」：阴走到极端与阳相战，血色玄黄。关系或局势打到头破血流——宜收，勿再斗。"]},"复":{"g":"复是「回来、重启」。一阳从头生出，像冬天过后地气回暖。卦辞说出入无疾、朋友来无咎，七天一个来回——象征周期转折，宜回归正道。","y":"雷在地中，能量还小，但方向对了。新手要抓住：跌倒不可怕，怕的是迷复（迷了路还不肯回头）。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主复合、康复、改过、重启项目、周期回转。","宜回到正确做法；忌执迷不悟、原地打转。","问「还有没有希望」：复卦常给「有转机」的信号，但仍要行动配合。","应期可参考「七日来复」这类周期提示（示意，非死板天数）。"],"yao":["初爻（开始）：初九：走不远就回头，大吉。错得早、改得快最好。经文大意是「不远复，无祗悔，元吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：安静美好的回复，吉。经文大意是「休复，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","六三：频繁反复，虽危险但无大咎——别养成反复无常的习惯。","四爻（接近结果）：六四：中途独自返回正道，难能可贵。经文大意是「中行独复。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：敦厚地回复，无悔。经文大意是「敦复，无悔。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：迷途不返则凶，有灾。最忌死不认错。经文大意是「迷复，凶，有灾眚。用行师，终有大败，以其国君凶，至于十年不克征。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"临":{"g":"临是「临近、督导、以上临下」。机会或责任正在靠近，适合亲自到场。但卦辞提醒「至于八月有凶」——旺势不会永远，盛时要想退路。","y":"地在上、泽在下，有亲临、监控、管理之象。新手可理解为：该出面了，但别被短期顺利冲昏头。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主管理岗、巡视、面试临近、机会将至、领导关注。","宜亲临、落实、给期限；忌只画饼、只甘言抚慰。","问时机：偏近，可推进，但设好止损。（结合你的实际情况慢慢对照即可。）","甘临无实：光说好听的没用，要做事。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：以感召临人，守正吉。经文大意是「咸临，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：感召而临，无往不利。经文大意是「咸临，吉无不利。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：只用甜言蜜语临人，无益；知忧则无咎。经文大意是「甘临，无攸利。既忧之，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：亲身到位，无咎。经文大意是「至临，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：以智慧临人，适合领导。经文大意是「知临，大君之宜，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：敦厚地临人，吉无咎。经文大意是「敦临，吉无咎。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"泰":{"g":"泰是「通泰、顺利」。小的去、大的来，上下能通气。像团队齐心、渠道打通、心情舒畅。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「小往大来，吉亨。」。","y":"地天泰：地气上升、天气下降，阴阳交。新手记住：通的时候要做事，也要记得「没有只平不陂」——顺久必有起伏，提前留余地。","z":["多主合作顺、家庭和、项目推进、交通顺畅。","宜沟通、签约、推进；忌得意忘形。（结合你的实际情况慢慢对照即可。）","问「能不能成」：偏可成，条件在「通」——人通、信息通。","城复于隍：盛极时别穷兵黩武。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：连根拔茅草，志同道合者一起前进则吉。经文大意是「拔茅茹，以其汇，征吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：心胸宽，能涉险，不遗弃远人。经文大意是「包荒，用冯河，不遐遗，朋亡，得尚于中行。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：没有只平不坡、只往不回。顺利中保持警惕。经文大意是「无平不陂，无往不复，艰贞无咎。勿恤其孚，于食有福。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：虚心往来，不靠财富压人，靠邻居/伙伴。经文大意是「翩翩不富，以其邻，不戒以孚。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：帝乙嫁妹，以实惠得吉——关系落地要实在。经文大意是「帝乙归妹，以祉元吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：城墙塌回护城河。不要再兴师动众，宜收。经文大意是「城复于隍，勿用师。自邑告命，贞吝。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"大壮":{"g":"大壮是「很强壮」。雷在天上，气势足。卦辞只强调「利贞」——力量大时更要走正道，否则壮变成莽。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利贞。」。","y":"新手最容易在大壮时「觉得自己行」就硬刚。古人用公羊撞篱笆：角卡住，进退两难——就是警告。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主体能、气势、强势谈判、扩张期。（结合你的实际情况慢慢对照即可。）","宜守正用力；忌用壮（仗势欺人）、硬撞规则。","问竞争：有力，但输赢看是否合规、是否过度。","藩决不羸：障碍真打开了才可进。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：脚上用壮，冒进则凶。基础未稳别冲。经文大意是「壮于趾，征凶，有孚。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：守正就吉。经文大意是「贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：小人用壮，君子用网（节制）；硬撞会危。经文大意是「小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：守正悔亡，篱笆开了，壮力可用。经文大意是「贞吉悔亡，藩决不羸，壮于大舆之輹。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：在易地丢羊，无悔——有时放手反而没事。经文大意是「丧羊于易，无悔。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：羊角卡在篱笆，进退不能。最忌死撑。经文大意是「羝羊触藩，不能退，不能遂，无攸利，艰则吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"夬":{"g":"夬是「决断、清除」。要在公开场合讲清楚、下决心。不利动武硬闯，而利于有准备地前往处理。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「扬于王庭，孚号，有厉，告自邑，不利即戎，利有攸往。」。","y":"泽水上天，装不住了，必须决口。新手理解：该摊牌就摊牌，但要走程序、留证据，不要情绪化乱砍。","z":["多主开除、分手决断、改革、揭发、了断。","宜公开、依法、果断；忌偷偷摸摸或暴力。","问「要不要断」：夬支持决，但方式要正。","无号终有凶：优柔寡断拖到最后反而凶。"],"yao":["初爻（开始）：初九：脚趾壮，往而不胜，自取其咎。准备不足别先冲。经文大意是「壮于前趾，往不胜为咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：夜里警惕有戎事，不必怕——有防则安。经文大意是「惕号，莫夜有戎，勿恤。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：脸面用壮凶；君子独自决断，遇雨湿衣也无咎。经文大意是「壮于頄，有凶。君子夬夬，独行遇雨，若濡有愠，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：坐不稳、走不稳，牵羊（跟人走）可悔亡。经文大意是「臀无肤，其行次且。牵羊悔亡，闻言不信。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：中行无咎，按中正之路决断。经文大意是「苋陆夬夬，中行无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：没号令、没收尾则终凶。必须有结果。经文大意是「无号，终有凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"需":{"g":"需是「等待、需要时间」。云在天上还没下雨——不是不下雨，是时候未到。有诚信、走正道则吉，甚至可闯大川。","y":"新手最怕「等」：一等就焦虑。需卦教你：等的时候也要准备（饮食宴乐=养身体、养条件），不是干坐。","z":["多主等结果、等款、等批复、等时机。（结合你的实际情况慢慢对照即可。）","宜耐心准备；忌催逼、撕破脸。（结合你的实际情况慢慢对照即可。）","问「何时有」：偏有，但在「需」——看节点与冲合。","需于泥、需于血：等的位置危险时要换环境。"],"yao":["初爻（开始）：初九：在郊外等，持之以恒，无咎。离危险还远。经文大意是「需于郊，利用恒，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：在沙滩等，有小闲话，最终吉。经文大意是「需于沙，小有言，终吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：在泥里等，容易招贼。位置太差，快撤离。经文大意是「需于泥，致寇至。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：在血泊/险地等，要从洞穴出来——脱离险境。经文大意是「需于血，出自穴。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：在酒食中等，得时则吉。正当其时，从容。经文大意是「需于酒食，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：入穴又来不速之客，恭敬对待终吉。意外来客别敌视。经文大意是「入于穴，有不速之客三人来，敬之终吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"比":{"g":"比是「亲近、依附、团结」。原筮元永贞——一开始就要选对可长期亲近的人。后来晚到、不真心的，反而凶。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「吉。原筮元永贞，无咎。不宁方来，后夫凶。」。","y":"水在地上，亲密无间。新手择友、择合作：宁缺毋滥。后夫凶=别当备胎，也别收留不真心的人。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主合作、入伙、交友、团队归属、相亲亲近。","宜选正人、早沟通；忌攀附小人、迟到敷衍。","问「能不能在一起/合作」：看双方是否真心相比。","比之匪人：跟错人最伤。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：有诚信地亲近，无咎。经文大意是「有孚比之，无咎。有孚盈缶，终来有他，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：从内部亲近，守正吉。经文大意是「比之自内，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：亲近的不是好人，危险。经文大意是「比之匪人。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：向外亲近贤人，守正吉。经文大意是「外比之，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","九五：光明正大地比附，王者三驱——网开一面，不赶尽杀绝。","上爻（收尾）：上六：比附却无头领/无结果，凶。经文大意是「比之无首，凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"震":{"g":"震是雷、是震动、是突然的事。卦辞说：雷来时吓得发抖，之后又能谈笑；震惊百里，手中祭器不丢——意思是：被吓到没关系，关键别丢了主心骨。","y":"接连的雷声，让人害怕也会让人清醒。新手遇到突变：先稳住呼吸和原则，再处理细节。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主突发、惊吓、变动、迁移、响动。（结合你的实际情况慢慢对照即可。）","宜定神应变；忌惊慌失措、乱承诺。（结合你的实际情况慢慢对照即可。）","问安危：重在「受惊后能否不失主见」。","震惊之后若能笑言哑哑，反而是过关。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：先惧后笑，吉。受惊后恢复平常心。经文大意是「震来虩虩，后笑言哑哑，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","六二：震动危险，丢了财物爬上高陵——先避险，财物以后再算。","三爻（进退关口）：六三：吓得软掉，但行走无灾。怕归怕，该走还是走。经文大意是「震苏苏，震行无眚。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：震陷在泥里，动弹难。经文大意是「震遂泥。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：来来回回都危险，但大事不丢，仍有事可办。经文大意是「震往来厉，亿无丧，有事。」。零基础可记：看清这一步该进还是该守，别跳步。","上六：吓得眼神涣散，出征凶；若灾不在自身在邻居，无咎——别往枪口上撞。"]},"豫":{"g":"豫是快乐、预备、鼓动人心。利于封侯、行军——适合发动、鼓舞，但快乐过头会「鸣豫」变凶。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利建侯行师。」。","y":"雷出地奋，情绪与行动都被点燃。新手要快乐，更要准备；只嗨不准备，乐极生悲。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主娱乐、动员、喜事、士气。（结合你的实际情况慢慢对照即可。）","宜筹备后行动；忌沉溺享乐。（结合你的实际情况慢慢对照即可。）","介于石：看清苗头要快决断。（结合你的实际情况慢慢对照即可。）","建侯行师：适合组织与启动。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：自鸣得意的快乐，凶。经文大意是「鸣豫，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：耿介如石，一天都等不到——见机要快。经文大意是「介于石，不终日，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：仰视他人的快乐而后悔，晚了更悔。经文大意是「盱豫，悔。迟有悔。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：快乐由你而来，大有所得。经文大意是「由豫，大有得。勿疑。朋盍簪。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：正固却有疾，长病不死——拖延的消耗。经文大意是「贞疾，恒不死。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：昏冥之乐，若能改变则无咎。经文大意是「冥豫，成有渝，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"解":{"g":"解是缓解、解开。利于西南（往温和处）；没事就回来休息吉，有事就早点去办吉。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利西南，无所往，其来复吉。有攸往，夙吉。」。","y":"雷雨作，草木破壳。紧张期过去后，要及时处理余患，别解除警报又躺平。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主纠纷缓解、病退、障碍解除。（结合你的实际情况慢慢对照即可。）","宜趁缓解期收尾；忌放任不管。（结合你的实际情况慢慢对照即可。）","负且乘：名实颠倒会再招祸。（结合你的实际情况慢慢对照即可。）","有攸往夙吉：有行动要趁早。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：无咎。刚解，先安。经文大意是「无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：田猎得狐得矢，守正吉——清理隐患要准。经文大意是「田获三狐，得黄矢，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：背着东西又乘车，招贼。能力与排场不匹配危险。经文大意是「负且乘，致寇至，贞吝。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：解开大脚趾，朋友才来信——先放下不该抓的。经文大意是「解而拇，朋至斯孚。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：君子有解则吉，取信于小人也靠化解。经文大意是「君子维有解，吉；有孚于小人。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：射高墙上的隼，除害要到位。经文大意是「公用射隼于高墉之上，获之，无不利。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"恒":{"g":"恒是长久、恒常。亨通无咎，利守正，利有所往——适合长期主义，不适合三天打鱼。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，无咎，利贞，利有攸往。」。","y":"雷风相与，持续互动。新手谈感情、事业：看的是稳定性，不是一时热。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主婚姻长久、契约、习惯、长期项目。","宜守诺、持续；忌朝三暮四。（结合你的实际情况慢慢对照即可。）","不恒其德：无常则羞。（结合你的实际情况慢慢对照即可。）","妇人吉夫子凶：角色不同要求不同。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：求深太急的恒，凶。开始别要求一步永恒。经文大意是「浚恒，贞凶，无攸利。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：悔亡。经文大意是「悔亡。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：不能恒其德，会受羞辱。经文大意是「不恒其德，或承之羞，贞吝。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：田里无禽——方向不对，久也无获。经文大意是「田无禽。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：恒其德，妇人吉、男人凶——各安其位。经文大意是「恒其德，贞，妇人吉，夫子凶。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：震动式的恒（躁动），凶。经文大意是「振恒，凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"升":{"g":"升是上升。元亨，去见大人不必忧虑，南征吉——适合循序往上走。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「元亨，用见大人，勿恤，南征吉。」。","y":"地中生木，慢慢长高。新手升职、学业：积小步，别想一夜登顶。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主升迁、成绩上升、地位渐进。（结合你的实际情况慢慢对照即可。）","宜积累、求见贵人；忌一步登天。（结合你的实际情况慢慢对照即可。）","允升：有诚信才升得稳。（结合你的实际情况慢慢对照即可。）","南征：往明处、往有利方位/领域推进。"],"yao":["初爻（开始）：初六：被允许上升，大吉。经文大意是「允升，大吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：有诚信，薄祭也无咎——心诚比排场重要。经文大意是「孚乃利用禴，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：升入虚邑，畅通无阻。经文大意是「升虚邑。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：王在岐山祭祀，吉——借礼与权威上升。经文大意是「王用亨于岐山，吉无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：守正吉，一级级上台阶。经文大意是「贞吉，升阶。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：暗中上升，利于不停歇地守正——别停。经文大意是「冥升，利于不息之贞。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"井":{"g":"井改不了位置，邑可改。井水无得无失，人来人往都靠它。快汲到水却打翻瓶子，凶——资源在，取用方法错了也白搭。","y":"木上有水为井。新手理解：本事、人脉、产品都像井水，关键是管道通不通、会不会维护。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主资源、固定产业、专业技能、不动的基本盘。","宜修通取用路径；忌临门失手。（结合你的实际情况慢慢对照即可。）","井泥不食：先清淤。（结合你的实际情况慢慢对照即可。）","井收勿幕：成功后别独占，保持开放。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：井泥不能喝，旧井无鸟——荒废了。经文大意是「井泥不食，旧井无禽。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：井谷射小鱼，瓮又破——手段小且工具坏。经文大意是「井谷射鲋，瓮敝漏。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：井淘干净了却无人喝，让人心疼——有才未被用。经文大意是「井渫不食，为我心恻，可用汲，王明，并受其福。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：修好井壁，无咎——维护期。经文大意是「井甃，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：井水清冷可饮——资源优质可用。经文大意是「井冽，寒泉食。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：收井勿盖，有诚信大吉——成果分享，源头不断。经文大意是「井收勿幕，有孚元吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"大过":{"g":"栋梁弯了（栋桡），仍利有所往、亨——说明非常时期要用非常办法，但不能硬撑到断。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「栋桡，利有攸往，亨。」。","y":"泽灭木，中间强两端弱。新手：负担过重时，先改结构（减负、换梁），别死撑面子。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主压力过大、非常决策、年龄/结构失衡。","宜调整结构；忌硬扛。（结合你的实际情况慢慢对照即可。）","过涉灭顶：再冒险会灭顶。（结合你的实际情况慢慢对照即可。）","独立不惧：非常时要有担当，但方法要对。"],"yao":["初爻（开始）：初六：用白茅垫着，谨慎无咎。开始越小心越好。经文大意是「藉用白茅，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：枯杨生芽，老夫得女妻——反常却有生机。经文大意是「枯杨生稊，老夫得其女妻，无不利。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：栋桡，凶。梁真弯了。经文大意是「栋桡，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：栋隆，吉，另有小吝。梁抬起来了。经文大意是「栋隆，吉；有它吝。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：枯杨开花，老妇得士夫——热闹过，难长久。经文大意是「枯杨生华，老妇得其士夫，无咎无誉。」。零基础可记：看清这一步该进还是该守，别跳步。","上六：过河灭顶，凶，但无咎于心——尽人事后的凶，问心可安。"]},"随":{"g":"随是跟随、随缘。元亨利贞，无咎——跟对了人与势，路就通。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「元亨利贞，无咎。」。","y":"泽中有雷，动而悦。新手：跟随不是盲从，是选择值得跟随的方向与人。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主跟随领导、随大流中的选择、随行。","宜选对跟随对象；忌跟错人。（结合你的实际情况慢慢对照即可。）","有获贞凶：得利时更要守正。（结合你的实际情况慢慢对照即可。）","所随不正则失。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：官职有变，守正吉——随势调整角色。经文大意是「官有渝，贞吉。出门交有功。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：系住小子，失去丈夫——格局小，失大。经文大意是「系小子，失丈夫。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：系住丈夫，失去小子——取大舍小。经文大意是「系丈夫，失小子。随有求得，利居贞。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：跟随有收获，但守正防凶，要有诚信。经文大意是「随有获，贞凶。有孚在道，以明，何咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：信于嘉美，吉。经文大意是「孚于嘉，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：被拘束仍跟随，像绑住——随到极致。经文大意是「拘系之，乃从维之。王用亨于西山。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"巽":{"g":"巽是风、是进入、是反复叮嘱。小亨，利有所往，利见大人——柔顺地渗透，反复沟通，能见贵人。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「小亨，利有攸往，利见大人。」。","y":"风无孔不入。新手：硬推不动时，用沟通、用文件、用一次次说明进入核心。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主命令传达、风闻、渗透、谈判切入。","宜柔进、反复沟通；忌下跪式讨好失原则。","进退利武人：关键时要有决断力。（结合你的实际情况慢慢对照即可。）","巽在床下：太卑反失工具（资斧）。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：进退不定，利于像军人一样果断。经文大意是「进退，利武人之贞。」。零基础可记：看清这一步该进还是该守，别跳步。","九二：巽在床下，用祝史巫祝纷乱，吉无咎——通过多方沟通化解。","三爻（进退关口）：九三：频繁巽顺，吝——太反复反而小弊。经文大意是「频巽，吝。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：悔亡，田猎有获。经文大意是「悔亡，田获三品。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：守正吉，无初有终——结尾比开头重要。经文大意是「贞吉悔亡，无不利。无初有终，先庚三日，后庚三日，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：巽在床下，丢了斧子，守正也凶——卑过头失去手段。经文大意是「巽在床下，丧其资斧，贞凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"小畜":{"g":"小畜是小有积蓄。密云不雨，从西郊来——雨还没下，力量在攒。亨，但还不到倾盆时。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨。密云不雨，自我西郊。」。","y":"风行天上，所积尚小。新手：别把蓄势当已经成功；继续存、继续练，别提前挥霍。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主小储蓄、小成果、力量积聚中。（结合你的实际情况慢慢对照即可。）","宜积少成多；忌一次铺开。（结合你的实际情况慢慢对照即可。）","密云不雨：事未落地。（结合你的实际情况慢慢对照即可。）","夫妻反目：密时内部易吵，沟通。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：返回自己的道路，何咎之有。经文大意是「复自道，何其咎，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：被牵着返回，吉。经文大意是「牵复，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：车脱辐，夫妻反目——硬进导致内部冲突。经文大意是「舆说辐，夫妻反目。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：有诚信，血去惕出——化险。经文大意是「有孚，血去惕出，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：有诚信相系，与邻共富。经文大意是「有孚挛如，富以其邻。」。零基础可记：看清这一步该进还是该守，别跳步。","上九：既雨既处，德积到了——雨终于下，可告一段落，仍防满。"]},"家人":{"g":"家人利于女正——内部秩序先正。风自火出，家道由内而外。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利女贞。」。","y":"女正位乎内，男正位乎外。新手看家庭/团队：先把家里的规矩与分工理顺，再对外做事。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主家庭、室友、小团队内部。（结合你的实际情况慢慢对照即可。）","宜定规矩、各安其位；忌嘻哈无度或家暴式严苛。","闲有家：防患于未然。（结合你的实际情况慢慢对照即可。）","有孚威如：有信又有威。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：家中有防范，悔亡。经文大意是「闲有家，悔亡。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：无专遂，在中馈，守正吉——把分内事做好。经文大意是「无攸遂，在中馈，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：家人严厉，虽悔厉但吉；妇子嘻嘻终吝。经文大意是「家人嗃嗃，悔厉吉；妇子嘻嘻，终吝。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：富家大吉。经文大意是「富家，大吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：王来到家，勿恤吉——上位者关怀家庭/团队。经文大意是「王假有家，勿恤吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：有诚信又威严，终吉。经文大意是「有孚威如，终吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"益":{"g":"益是增益。利有所往，利涉大川——适合行动、适合闯关。上损下益，好处往下走。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利有攸往，利涉大川。」。","y":"风雷益，行动带来增益。新手：有资源时要用于正事与助人，迁善改过，增益才实。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主加薪、帮助、投资于人、扩大成果。","宜进取、分享；忌贪得无厌。（结合你的实际情况慢慢对照即可。）","中行告公：正大光明求增益。（结合你的实际情况慢慢对照即可。）","莫益或击：再贪会被打。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：利于大作为，元吉无咎。经文大意是「利用为大作，元吉，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：或益之十朋之龟，永贞吉——厚赠，守正。经文大意是「或益之，十朋之龟弗克违，永贞吉。王用享于帝，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：用增益应对凶事，无咎，有信走中道。经文大意是「益之用凶事，无咎。有孚中行，告公用圭。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：中行告公，利于依此迁国——重大调整靠中正。经文大意是「中行，告公从。利用为依迁国。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：有信惠心，勿问元吉——真心给人好处。经文大意是「有孚惠心，勿问元吉。有孚惠我德。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：没人再益你，或打击你，心不恒则凶。经文大意是「莫益之，或击之，立心勿恒，凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"无妄":{"g":"无妄是不虚妄。元亨利贞；若不正，有灾，不利有所往——好运建立在本分上，妄想则灾。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「元亨利贞。其匪正有眚，不利有攸往。」。","y":"天下雷行，物与无妄。新手：做好该做的，别走捷径、别侥幸；有时无妄之灾是飞来横祸，更要守常。","z":["多主本分事、意外之灾、不可妄求。（结合你的实际情况慢慢对照即可。）","宜守正业；忌投机取巧。（结合你的实际情况慢慢对照即可。）","不耕而获不可想。（结合你的实际情况慢慢对照即可。）","无妄之疾勿药：有时不必乱治，先观察。"],"yao":["初爻（开始）：初九：无妄而往，吉。经文大意是「无妄，往吉。」。零基础可记：看清这一步该进还是该守，别跳步。","六二：不耕而获、不垦而耕则利——在自然节奏中得，非强求。","三爻（进退关口）：六三：无妄之灾，或系之牛——无辜受连累，防飞来横祸。经文大意是「无妄之灾，或系之牛，行人之得，邑人之灾。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：可贞无咎。经文大意是「可贞，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：无妄之疾，勿用药有喜——别乱治，自愈或观察。经文大意是「无妄之疾，勿药有喜。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：无妄而行有灾，无攸利——到头了还妄动则不利。经文大意是「无妄，行有眚，无攸利。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"噬嗑":{"g":"噬嗑是咬合。嘴里有物，咬开才能合。亨，利用狱——适合处理梗阻、明辨是非。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨。利用狱。」。","y":"中间有障碍就要咬开，不是绕开装看不见。新手：问题点名、证据到位，才能真正合上。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主官司、处罚、清除奸佞、解决卡点。","宜依法据理；忌私刑泄愤。（结合你的实际情况慢慢对照即可。）","用狱：程序与证据重要。（结合你的实际情况慢慢对照即可。）","灭趾灭耳：惩罚轻重不同。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：脚镣灭趾，无咎——小惩大诫。经文大意是「履校灭趾，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：咬皮肉灭鼻，无咎——惩得稍重但有效。经文大意是「噬肤灭鼻，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：咬腊肉遇毒，小吝无咎——难啃但过得去。经文大意是「噬腊肉，遇毒。小吝，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：咬干骨得金矢，利艰贞——艰难中得利器。经文大意是「噬干胏，得金矢，利艰贞，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：咬干肉得黄金，贞厉无咎——有收获仍须谨慎。经文大意是「噬干肉，得黄金，贞厉，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：何校灭耳，凶——惩罚到头，听不进去最凶。经文大意是「何校灭耳，凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"颐":{"g":"颐是养。守正吉。看人怎么养嘴、怎么养身——自己求口中食。慎言语、节饮食。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「贞吉。观颐，自求口实。」。","y":"山下有雷，口动要有节。新手：身体、口才、供养关系，都看「养得正不正」。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主养生、饮食、口才、供养父母子女。","宜规律作息；忌暴饮暴食、妄语。（结合你的实际情况慢慢对照即可。）","朵颐：只羡慕别人吃相则凶。（结合你的实际情况慢慢对照即可。）","由颐：得养可涉大川。（结合你的实际情况慢慢对照即可。）"],"yao":["初九：放下灵龟去看别人吃，凶——别丢掉自己的根本去羡慕。","二爻（进展）：六二：颠倒求养，征凶。经文大意是「颠颐，拂经，于丘颐，征凶。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：拂颐，守正也凶，十年勿用——养法大错。经文大意是「拂颐，贞凶，十年勿用，无攸利。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：颠颐吉，虎视眈眈——专注求养。经文大意是「颠颐吉，虎视眈眈，其欲逐逐，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：拂经居贞吉，不可涉大川——守即可，勿冒险。经文大意是「拂经，居贞吉，不可涉大川。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：由颐厉吉，利涉大川——担当供养之责，可闯关。经文大意是「由颐，厉吉，利涉大川。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"蛊":{"g":"蛊是败坏已久的事。元亨，利涉大川；先甲三日后甲三日——治理要有计划、有开始有结束。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「元亨，利涉大川。先甲三日，后甲三日。」。","y":"山下有风，腐朽要整肃。新手：旧问题拖着会更大；整治要有时间表，别「裕父之蛊」敷衍。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主整顿、改革、清理历史遗留、家族旧账。","宜有计划整改；忌拖延粉饰。（结合你的实际情况慢慢对照即可。）","干父之蛊：处理长辈/前任遗留。（结合你的实际情况慢慢对照即可。）","先甲后甲：事前事后都要安排。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：干父之蛊，有子则父无咎——后人收拾前人手尾。经文大意是「干父之蛊，有子，考无咎，厉终吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：干母之蛊，不可贞——柔性处理，勿死板。经文大意是「干母之蛊，不可贞。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：干父之蛊，小悔无大咎。经文大意是「干父之蛊，小有悔，无大咎。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：宽裕地对待父蛊，往则见吝——太宽松会坏事。经文大意是「裕父之蛊，往见吝。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：干父用誉——整治得好，得名声。经文大意是「干父之蛊，用誉。」。零基础可记：看清这一步该进还是该守，别跳步。","上九：不事王侯，高尚其事——也可以选择不入局，守自己的清高。"]},"坎":{"g":"坎是水、是险。有诚信维系内心则亨，行动有赏。习坎=重重险阻，要有信心地走。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「习坎，有孚，维心亨，行有尚。」。","y":"水流动不盈满，在险中仍守信。新手遇连续困难：一次只求小得，别再主动跳新坑。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主风险、低谷、流动、水路、诈骗防备。","宜心亨、稳步；忌再入险。（结合你的实际情况慢慢对照即可。）","求小得可。（结合你的实际情况慢慢对照即可。）","习坎：困难可能一波接一波。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：习坎，落入坎穴，凶——刚开始就陷。经文大意是「习坎，入于坎窞，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：坎有险，求小得——险中只求小进展。经文大意是「坎有险，求小得。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：来去都是坎，枕着危险——处境被动。经文大意是「来之坎坎，险且枕，入于坎窞，勿用。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：樽酒簋贰用缶——简约诚信地度过。经文大意是「樽酒簋贰，用缶，纳约自牖，终无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：坎不盈，既平无咎——险未满，趋于平。经文大意是「坎不盈，祗既平，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：绳索捆住丢进荆棘，三年不得——困久，宜求救。经文大意是「系用徽纆，寘于丛棘，三岁不得，凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"节":{"g":"节是节制。亨。但苦节不可贞——太苦的节制不能长久当正道。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨。苦节不可贞。」。","y":"泽上有水，有容也有限。新手：定规矩、控预算，但别极端禁欲导致反弹。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主制度、节约、分寸、时间管理。（结合你的实际情况慢慢对照即可。）","宜适度规则；忌过严或放纵。（结合你的实际情况慢慢对照即可。）","不出户庭：该止则止。（结合你的实际情况慢慢对照即可。）","苦节贞凶：过苦则凶。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：不出户庭，无咎——管住第一步。经文大意是「不出户庭，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：不出门庭，凶——该出门时死宅则误事。经文大意是「不出门庭，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：不节则叹，无咎——知叹能改。经文大意是「不节若，则嗟若，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：安节，亨——安于合理的节制。经文大意是「安节，亨。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：甘节，吉——甘美适度的节制。经文大意是「甘节，吉；往有尚。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：苦节，守正也凶，悔可亡——极端要回头。经文大意是「苦节，贞凶，悔亡。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"屯":{"g":"屯是初生之难。元亨利贞，但勿用有攸往——别急着大举进攻；利于建侯——先立根基、立带头人。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「元亨利贞，勿用有攸往，利建侯。」。","y":"云雷郁结，万事开头难。新手创业/开局：先把人和规矩立住，别一上来就扩张。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主创业初期、项目启动、关系未定。（结合你的实际情况慢慢对照即可。）","宜立本、选对人；忌冒进。（结合你的实际情况慢慢对照即可。）","婚恋宜缓。（结合你的实际情况慢慢对照即可。）","建侯：找核心伙伴/负责人。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：磐桓难进，利居贞、利建侯——稳住，先立主心骨。经文大意是「磐桓，利居贞，利建侯。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：进退两难，婚媾未可急——别强求马上结合。经文大意是「屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：追鹿无向导，不如放弃——没条件别硬追。经文大意是「即鹿无虞，惟入于林中，君子几不如舍，往吝。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：求婚媾，往吉——时机对了再求。经文大意是「乘马班如，求婚媾，往吉，无不利。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：屯其膏，小吉大凶——好处屯着不施，大事难成。经文大意是「屯其膏，小贞吉，大贞凶。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：泣血涟如——困到极点，宜止。经文大意是「乘马班如，泣血涟如。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"既济":{"g":"既济是已经渡过。亨小，利贞，初吉终乱——开头好，结尾容易乱，要慎终。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，小利贞，初吉终乱。」。","y":"水在火上，阴阳各正其位，看似完成。新手：事成后最容易松劲，细节和收尾决定会不会翻车。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主完成、成交后、成功后的维护。（结合你的实际情况慢慢对照即可。）","宜慎终如始；忌庆功过头。（结合你的实际情况慢慢对照即可。）","初吉终乱是核心提醒。（结合你的实际情况慢慢对照即可。）","濡其尾：收尾别马虎。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：拖住轮子、沾湿尾巴，无咎——开始宁慢勿闪失。经文大意是「曳其轮，濡其尾，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：妇人丢头巾，别追，七天自得——丢失之物勿慌。经文大意是「妇丧其茀，勿逐，七日得。」。零基础可记：看清这一步该进还是该守，别跳步。","九三：高宗伐鬼方三年克之，小人勿用——大功告成勿用小人。","四爻（接近结果）：六四：彩舟有敝衣，终日戒——成功中仍戒备。经文大意是「繻有衣袽，终日戒。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：东邻杀牛不如西邻薄祭受实福——诚比奢重要。经文大意是「东邻杀牛，不如西邻之禴祭，实受其福。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：濡其首，厉——头也湿了，过满则危。经文大意是「濡其首，厉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"革":{"g":"革是变革。己日才有信——改革要选对时机、先取信，才元亨利贞、悔亡。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「己日乃孚，元亨利贞，悔亡。」。","y":"泽中有火，不得不变。新手：变之前先让人信你；汤武革命也强调顺天应人，不是瞎折腾。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主改革、换赛道、制度更新、整容式变化。","宜先取信再变革；忌朝令夕改。（结合你的实际情况慢慢对照即可。）","己日乃孚：时机与信任。（结合你的实际情况慢慢对照即可。）","小人革面：表面变了别全信。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：用黄牛之革固定——先巩固，勿急变。经文大意是「巩用黄牛之革。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：己日乃革之，征吉无咎——时机到了再变。经文大意是「己日乃革之，征吉，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：征凶，革言三就有孚——反复说明才取信。经文大意是「征凶，贞厉，革言三就，有孚。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：悔亡，有孚改命吉——有信则改命。经文大意是「悔亡，有孚改命，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：大人虎变，未占有孚——领导层大变，自然有信。经文大意是「大人虎变，未占有孚。」。零基础可记：看清这一步该进还是该守，别跳步。","上六：君子豹变，小人革面；征凶居贞吉——小变可，大举冒进凶。"]},"丰":{"g":"丰是丰盛。亨，王亲临，勿忧，宜日中——盛时要把握中午般的光明时刻，也防阴影。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，王假之，勿忧，宜日中。」。","y":"雷电皆至，又明又动。新手：风口上做事，同时防「丰其蔀」被遮蔽、盛极转空。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主高峰、旺季、流量、庆典。（结合你的实际情况慢慢对照即可。）","宜趁盛办事；忌透支、蔽明。（结合你的实际情况慢慢对照即可。）","宜日中：抓黄金窗口。（结合你的实际情况慢慢对照即可。）","窥户无人：热闹后可能空。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：遇配主，虽均无咎，往有尚——遇对的人可进。经文大意是「遇其配主，虽旬无咎，往有尚。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：丰大却被障蔽，日中见斗，有疑，有信则发若吉。经文大意是「丰其蔀，日中见斗，往得疑疾，有孚发若，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：丰其沛，折右肱，无咎——得助力受损，仍无大咎。经文大意是「丰其沛，日中见沫，折其右肱，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：丰蔀见斗，遇夷主吉——遇平和之主。经文大意是「丰其蔀，日中见斗，遇其夷主，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：来章有庆誉，吉。经文大意是「来章，有庆誉，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：丰屋蔀家，三年不见人，凶——封闭自蔽。经文大意是「丰其屋，蔀其家，窥其户，阒其无人，三岁不觌，凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"明夷":{"g":"明夷是光明受伤。利艰贞——在艰难中守正。像日落入地，暂时暗。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利艰贞。」。","y":"内明外柔，蒙难。新手：被打压、被误解时，先藏锋、守住底线，勿硬刚暴露底牌。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主压抑、不公、潜伏期、明主受伤。（结合你的实际情况慢慢对照即可。）","宜晦藏守正；忌硬碰。（结合你的实际情况慢慢对照即可。）","利艰贞是核心。（结合你的实际情况慢慢对照即可。）","箕子：在难中保持清醒。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：飞而垂翼，君子于行——带伤离开，宜走。经文大意是「明夷于飞，垂其翼。君子于行，三日不食，有攸往，主人有言。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：伤左股，用壮马拯救。经文大意是「明夷，夷于左股，用拯马壮，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：南狩得大首——在暗中除害。经文大意是「明夷于南狩，得其大首，不可疾贞。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：入左腹获明夷之心——看清黑暗内情。经文大意是「入于左腹，获明夷之心，出于门庭。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：箕子之明夷，利贞——艰难中守正。经文大意是「箕子之明夷，利贞。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：不明晦，先登天后人地——先明后暗的结局，戒。经文大意是「不明晦，初登于天，后入于地。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"师":{"g":"师是众、是军队。守正，由有经验的「丈人」带领则吉无咎——集体行动要有主将和纪律。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「贞，丈人吉，无咎。」。","y":"地中有水，蓄众。新手带团队：立规矩、定一人拍板，最忌多头指挥（舆尸）。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主团队、竞争、官司群体、项目管理。","宜立主将与纪律；忌乌合之众。（结合你的实际情况慢慢对照即可。）","长子帅师：合适的人带队。（结合你的实际情况慢慢对照即可。）","小人勿用。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：出师以律，否臧凶——军纪第一。经文大意是「师出以律，否臧凶。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：在师中吉，王三次赐命——得中得宠。经文大意是「在师中，吉无咎，王三锡命。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：师或舆尸，凶——多头指挥或载尸而归。经文大意是「师或舆尸，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：师左次，无咎——撤退整顿无妨。经文大意是「师左次，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：田有禽，利执言；长子帅师，弟子舆尸凶。经文大意是「田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：大君有命，开国承家，小人勿用。经文大意是「大君有命，开国承家，小人勿用。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"离":{"g":"离是火、是附丽、是光明。利贞亨，畜牝牛吉——柔顺地附着在正道上，像养温顺的牛。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利贞，亨。畜牝牛，吉。」。","y":"两明相继。新手：要发光，也要有依附（平台、贵人、规则）；越亮越要内心清醒。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主文书、文明、眼睛、网络曝光、依附。","宜附正道、守中；忌突发冲动（突如其来）。","畜牝牛：柔顺积蓄。（结合你的实际情况慢慢对照即可。）","出征折首：名实要符。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：脚步错乱，敬之无咎——开始恭敬谨慎。经文大意是「履错然，敬之无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：黄离元吉——中正的光明，大吉。经文大意是「黄离，元吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：日昃之离，不鼓缶而歌——盛极将衰，及时节制。经文大意是「日昃之离，不鼓缶而歌，则大耋之嗟，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：突如其来，焚死弃——突发灾难之象，防不测。经文大意是「突如其来如，焚如，死如，弃如。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：出涕戚嗟，吉——忧惧反而吉。经文大意是「出涕沱若，戚嗟若，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：王出征有嘉，折首——除恶务尽，奖赏分明。经文大意是「王用出征，有嘉折首，获匪其丑，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"旅":{"g":"旅是旅途、寄居。小亨，旅贞吉——在外要守本分，才能小有通达。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「小亨，旅贞吉。」。","y":"火在山上，不稳定。新手出差、寄人篱下、过渡阶段：安顿、守分寸，别把客地当家。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主出行、寄居、客地发展、过渡期。（结合你的实际情况慢慢对照即可。）","宜安顿、谨慎；忌琐碎取灾、失火失助。","即次怀资：先安顿好住与钱。（结合你的实际情况慢慢对照即可。）","焚巢：失其所安最凶。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：旅途琐碎计较，自取灾。经文大意是「旅琐琐，斯其所取灾。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：住进客舍，怀财得童仆，守正。经文大意是「旅即次，怀其资，得童仆贞。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：客舍被烧，童仆失，贞厉。经文大意是「旅焚其次，丧其童仆，贞厉。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：有住处得斧资，心仍不快——物质有、心不安。经文大意是「旅于处，得其资斧，我心不快。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：射雉一矢亡，终以誉命——小失终有名。经文大意是「射雉一矢亡，终以誉命。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：鸟焚其巢，先笑后哭，丧牛于易，凶。经文大意是「鸟焚其巢，旅人先笑后号咷。丧牛于易，凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"鼎":{"g":"鼎是鼎器，元吉亨——更新、养贤、定新格局。像换新锅重起炉灶。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「元吉，亨。」。","y":"木上有火，烹饪成新。新手：换团队、换制度、换阶段，重在「人要配得上器」。鼎折足=担不起。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主换新、任命、机构重整。（结合你的实际情况慢慢对照即可。）","宜选对人、定新规；忌力不胜任。（结合你的实际情况慢慢对照即可。）","鼎有实：内容要实。（结合你的实际情况慢慢对照即可。）","玉铉：得中正之助。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：鼎颠趾，利出否——倒出废物，得妾有子，无咎。经文大意是「鼎颠趾，利出否，得妾以其子，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：鼎有实，仇人有疾不能害我，吉。经文大意是「鼎有实，我仇有疾，不我能即，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：鼎耳变，走不动，雉膏不食——通道堵，美物吃不上。经文大意是「鼎耳革，其行塞，雉膏不食，方雨亏悔，终吉。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：鼎折足，倾覆王公之羹，形渥凶——不胜任大凶。经文大意是「鼎折足，覆公餗，其形渥，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：鼎黄耳金铉，利贞——得中正提梁。经文大意是「鼎黄耳金铉，利贞。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：鼎玉铉，大吉无不利。经文大意是「鼎玉铉，大吉，无不利。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"未济":{"g":"未济是还没渡完。亨，但小狐狸几乎渡过去却湿了尾巴，无攸利——最后一步最容易功亏一篑。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，小狐汔济，濡其尾，无攸利。」。","y":"火在水上，未交。新手：越接近成功越要谨慎，别提前庆祝。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主收尾阶段、临门一脚、未完成项目。","宜谨慎收官；忌大意。（结合你的实际情况慢慢对照即可。）","小狐汔济是核心意象。（结合你的实际情况慢慢对照即可。）","有孚于饮酒：成功后也勿失度。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：湿尾巴，吝——开始就冒失。经文大意是「濡其尾，吝。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：拖住轮子，守正吉——控制节奏。经文大意是「曳其轮，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","六三：未济征凶，利涉大川——时机未到硬征凶，但方向可对。","四爻（接近结果）：九四：守正悔亡，震伐鬼方三年有赏——长期努力有赏。经文大意是「贞吉，悔亡，震用伐鬼方，三年有赏于大国。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：守正无悔，君子之光有孚吉。经文大意是「贞吉，无悔，君子之光，有孚，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：饮酒有信无咎，但湿头则失——乐而忘形会失正。经文大意是「有孚于饮酒，无咎，濡其首，有孚失是。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"蒙":{"g":"蒙是蒙昧、启蒙。亨。不是我求蒙童，是蒙童来求我；初问告诉你，再三渎问就不告诉——学习要诚。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。」。","y":"山下出泉，水未通。新手：不懂就拜师；老师也要包蒙，不要一棒打死。反复纠缠式提问无益。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主求学、考试启蒙、小孩教育、迷茫期。","宜求教、发蒙；忌自以为是、渎问。（结合你的实际情况慢慢对照即可。）","包蒙吉：包容地教。（结合你的实际情况慢慢对照即可。）","击蒙：该严格时严格，但勿为寇。（结合你的实际情况慢慢对照即可。）"],"yao":["初六：发蒙，用刑人，说桎梏，以往吝——启蒙可严，过严则吝。","二爻（进展）：九二：包蒙吉，纳妇吉，子克家——包容蒙昧，能成家。经文大意是「包蒙吉，纳妇吉，子克家。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：勿用取女，见金夫不有躬——见利忘身，勿取。经文大意是「勿用取女，见金夫，不有躬，无攸利。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：困蒙，吝——困在蒙昧里。经文大意是「困蒙，吝。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：童蒙，吉——以童心受教，吉。经文大意是「童蒙，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上九：击蒙，不利为寇，利御寇——打击蒙蔽是为了防护，不是侵害。"]},"涣":{"g":"涣是离散。亨。王到宗庙，利涉大川，利贞——散中要重新立心、立庙，才能再聚。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨。王假有庙，利涉大川，利贞。」。","y":"风行水上，冰散水流。新手：团队散、心散时，先立共同目标（庙），再谈渡大川。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主解散、分流、心散、改革中的重组。","宜立核心再聚；忌任其涣散。（结合你的实际情况慢慢对照即可。）","涣其群：解散小圈子反而吉。（结合你的实际情况慢慢对照即可。）","涣汗大号：号令要畅通。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：用壮马拯救，吉。经文大意是「用拯马壮，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：涣奔其机，悔亡——奔向可依靠的几案。经文大意是「涣奔其机，悔亡。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：涣其躬，无悔——散掉一身私累。经文大意是「涣其躬，无悔。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：涣其群元吉，涣有丘——散小群成大丘。经文大意是「涣其群，元吉。涣有丘，匪夷所思。」。零基础可记：看清这一步该进还是该守，别跳步。","九五：涣汗其大号，涣王居无咎——号令如汗出，不可收回，居正无咎。","上爻（收尾）：上九：涣其血去逖出，无咎——远离血光，出走无咎。经文大意是「涣其血，去逖出，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"讼":{"g":"讼是争讼。有信但窒塞、要警惕；中间过程可能吉，最终常凶。利见大人，不利涉大川——找公正权威，别扩大战线。","y":"天与水违行，志向不合。新手：能和解就和解；争到最后往往两败。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主官司、争执、投诉。（结合你的实际情况慢慢对照即可。）","宜调解、见大人（律师/权威）；忌纠缠到底。","终凶是警告。（结合你的实际情况慢慢对照即可。）","不利涉大川：别顺便开战新战场。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：不长久争执，小有言语，终吉。经文大意是「不永所事，小有言，终吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：争不过就归逃，躲到小邑，无灾。经文大意是「不克讼，归而逋，其邑人三百户，无眚。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：吃旧德，守正虽危终吉；从王事无成——别强求功。经文大意是「食旧德，贞厉，终吉。或从王事，无成。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：争不过就回头认命改变，安贞吉。经文大意是「不克讼，复即命渝，安贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：讼，元吉——中正的裁判，大吉。经文大意是「讼，元吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：或赐大带，一天被剥三次——争赢了也羞辱。经文大意是「或锡之鞶带，终朝三褫之。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"同人":{"g":"同人于野，亨。利涉大川，利君子贞——在开阔处求同，能闯关；要正。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「同人于野，亨。利涉大川，利君子贞。」。","y":"火天同人，文明以健。新手：合作要公心，走大门；只跟小圈子「同人于宗」反而吝。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主合作、同盟、公开关系。（结合你的实际情况慢慢对照即可。）","宜求同存异、公开合作；忌搞小团伙。（结合你的实际情况慢慢对照即可。）","先号后笑：先难后合。（结合你的实际情况慢慢对照即可。）","同人于郊：在边缘仍无悔。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：同人于门，无咎——出门就有同志。经文大意是「同人于门，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：同人于宗，吝——只跟本家，格局小。经文大意是「同人于宗，吝。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：伏兵在草莽，登高陵——有戒备、有窥伺。经文大意是「伏戎于莽，升其高陵，三岁不兴。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：攻城不克，吉——知道停手反而吉。经文大意是「乘其墉，弗克攻，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：先哭后笑——先痛苦后会合。经文大意是「同人，先号咷而后笑。大师克相遇。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：同人于郊，无悔。经文大意是「同人于郊，无悔。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"艮":{"g":"艮是止。止其后背，不获其身；走在庭院看不见人，无咎——该止的止，内外都不妄动。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「艮其背，不获其身，行其庭，不见其人，无咎。」。","y":"两山重叠，止其所。新手：学会停止错误惯性，比盲目努力更重要。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主停止、边界、静养、叫停项目。（结合你的实际情况慢慢对照即可。）","宜止、静；忌当止不止。（结合你的实际情况慢慢对照即可。）","思不出其位：别越权。（结合你的实际情况慢慢对照即可。）","敦艮：止于至善。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：艮其趾，无咎，利永贞——从脚趾就止住。经文大意是「艮其趾，无咎，利永贞。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：艮其腓，不救其随，心不快——止得别扭。经文大意是「艮其腓，不拯其随，其心不快。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：艮其限，裂其夤，厉薰心——止在腰，伤及心。经文大意是「艮其限，列其夤，厉薰心。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：艮其身，无咎——止住自身。经文大意是「艮其身，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：艮其辅，言有序，悔亡——管住嘴。经文大意是「艮其辅，言有序，悔亡。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：敦艮，吉——厚实地止。经文大意是「敦艮，吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"贲":{"g":"贲是文饰。亨，小利有攸往——可以润色、包装，但只是小利，根本还是内容。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨。小利有攸往。」。","y":"山下有火，文明而有节。新手：简历、产品、形象可以修饰，但白贲（朴素）往往更无咎。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主包装、设计、礼仪、外表。（结合你的实际情况慢慢对照即可。）","宜适度文饰；忌金玉其外。（结合你的实际情况慢慢对照即可。）","文胜质则吝。（结合你的实际情况慢慢对照即可。）","白贲无咎：返璞。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：贲其趾，舍车而徒——修饰脚下，宁可徒步。经文大意是「贲其趾，舍车而徒。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：贲其须——修饰附属。经文大意是「贲其须。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：贲如濡如，永贞吉——润泽持久。经文大意是「贲如濡如，永贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：贲如皤如，白马翰如——素白之饰。经文大意是「贲如皤如，白马翰如，匪寇婚媾。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：贲于丘园，束帛戋戋——园中薄礼也吉。经文大意是「贲于丘园，束帛戋戋，吝，终吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：白贲，无咎——最终返朴。经文大意是「白贲，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"大畜":{"g":"大畜是大积蓄。利贞。不家食吉，利涉大川——蓄到一定程度要走出去，可闯关。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利贞，不家食吉，利涉大川。」。","y":"天在山中，大的蓄养。新手：学习、存钱、养势，蓄够了再发；童牛牿是提前装防护。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主深造、储蓄、蓄势待发。（结合你的实际情况慢慢对照即可。）","宜蓄养、外出就养；忌未蓄先发。（结合你的实际情况慢慢对照即可。）","不家食：外出发展。（结合你的实际情况慢慢对照即可。）","防患于未然。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：有危利于停止。经文大意是「有厉利已。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：车脱輹——被迫停，蓄力。经文大意是「舆说輹。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：良马追逐，利艰贞——有力仍艰难守正。经文大意是「良马逐，利艰贞。曰闲舆卫，利有攸往。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：童牛之牿，元吉——小牛装角套，防患。经文大意是「童牛之牿，元吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：豮豕之牙，吉——去势之猪牙，驯服其刚。经文大意是「豮豕之牙，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：何天之衢，亨——通天大道。经文大意是「何天之衢，亨。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"损":{"g":"损是减损。有诚信则元吉无咎，可守正，利有所往。二簋可用享——礼薄心诚即可。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。」。","y":"山下有泽，损下益上。新手：该减的开支、欲望、冗余减掉，成大事；有时「弗损益之」——不损反而益。","z":["多主减负、止损、精简、奉献。（结合你的实际情况慢慢对照即可。）","宜诚信地减；忌乱砍伤本。（结合你的实际情况慢慢对照即可。）","损疾有喜：去掉毛病是喜。（结合你的实际情况慢慢对照即可。）","二簋用享：诚比厚礼重要。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：事完速往，酌情减损，无咎。经文大意是「已事遄往，无咎，酌损之。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：利贞，征凶，弗损益之——不损反益。经文大意是「利贞，征凶，弗损益之。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：三人行减一人，一人行得友。经文大意是「三人行，则损一人；一人行，则得其友。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：损其疾，使速有喜。经文大意是「损其疾，使遄有喜，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：或益之十朋之龟，弗克违，元吉。经文大意是「或益之，十朋之龟弗克违，元吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：弗损益之，无咎，贞吉，利有攸往。经文大意是「弗损益之，无咎，贞吉，利有攸往，得臣无家。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"睽":{"g":"睽是乖离、分歧。小事吉——大方向不合时，只做小事、找小共识。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「小事吉。」。","y":"上火下泽，各走各的。新手：意见不合很正常；先做能一起做的小事，别急着统一世界观。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主分歧、分居、意见不合。（结合你的实际情况慢慢对照即可。）","宜求小同；忌强合。（结合你的实际情况慢慢对照即可。）","遇主于巷：意外相遇可解。（结合你的实际情况慢慢对照即可。）","载鬼一车：疑心生暗鬼。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：悔亡，丧马勿逐自复——丢的自己回来。经文大意是「悔亡，丧马勿逐，自复；见恶人无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：巷中遇主，无咎。经文大意是「遇主于巷，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：车拖牛掣，人受黥劓——艰难受辱。经文大意是「见舆曳，其牛掣，其人天且劓，无初有终。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：睽孤遇元夫，交孚，厉无咎。经文大意是「睽孤，遇元夫，交孚，厉无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：六五：悔亡，宗人噬肤，往何咎。经文大意是「悔亡，厥宗噬肤，往何咎。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：睽孤见豕负涂载鬼一车——疑心太重，先澄清。经文大意是「睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"履":{"g":"履是行走、履行。踩着虎尾而不被咬，亨——危险中仍可通过，靠的是礼与谨慎。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「履虎尾，不咥人，亨。」。","y":"天泽履，柔履刚。新手：规则内走路，步步小心，武人式莽撞会出事。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主履约、上班路径、险中行事。（结合你的实际情况慢慢对照即可。）","宜守礼谨慎；忌莽撞。（结合你的实际情况慢慢对照即可。）","履虎尾：知险而行。（结合你的实际情况慢慢对照即可。）","视履考祥：回头看脚印。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：素履往，无咎——朴素地走。经文大意是「素履，往无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：履道坦坦，幽人贞吉。经文大意是「履道坦坦，幽人贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：瞎能看、跛能走，武人当大君——能力不够硬撑凶。经文大意是「眇能视，跛能履，履虎尾，咥人，凶。武人为于大君。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：履虎尾愬愬，终吉——惧怕反而安全。经文大意是「履虎尾，愬愬，终吉。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：夬履，贞厉——刚决地走，守正仍危。经文大意是「夬履，贞厉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：视履考祥，其旋元吉——总结脚印，圆满。经文大意是「视履考祥，其旋元吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"中孚":{"g":"中孚是内心诚信。连豚鱼那样微小也感通，利涉大川，利贞——真心能渡险。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「豚鱼吉，利涉大川，利贞。」。","y":"泽上有风，诚在中间。新手：合作、感情、谈判，核心是「你是不是真的」；虚声（翰音）登天则凶。","z":["多主诚信、合约、感通、鸟类/信息。（结合你的实际情况慢慢对照即可。）","宜真心实意；忌虚名。（结合你的实际情况慢慢对照即可。）","鸣鹤在阴：声应气求。（结合你的实际情况慢慢对照即可。）","翰音登天：空名危险。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：虞吉，有它不燕——安于诚信，另起念头则不安。经文大意是「虞吉，有他不燕。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：鸣鹤在阴，其子和之——同类相应。经文大意是「鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：得敌，或鼓或罢或泣或歌——情绪起伏。经文大意是「得敌，或鼓或罢，或泣或歌。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：月几望，马匹亡，无咎——近满时有失，无大咎。经文大意是「月几望，马匹亡，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：有孚挛如，无咎——诚信相系。经文大意是「有孚挛如，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：翰音登于天，贞凶——虚名登天，凶。经文大意是「翰音登于天，贞凶。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"渐":{"g":"渐是渐进。女归吉，利贞——嫁娶、上升都要一步步来。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「女归吉，利贞。」。","y":"山上有木，慢慢长。新手：升职、感情、学习都宜循序；想跳步容易「夫征不复」。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主婚嫁程序、晋升阶梯、移民渐进。（结合你的实际情况慢慢对照即可。）","宜按步骤；忌跨越。（结合你的实际情况慢慢对照即可。）","鸿渐：鸿雁循序落点。（结合你的实际情况慢慢对照即可。）","三岁不孕终胜：久后有成。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：鸿渐于干，小子厉有言，无咎——刚上岸，有闲话。经文大意是「鸿渐于干，小子厉，有言，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：鸿渐于磐，饮食和乐，吉。经文大意是「鸿渐于磐，饮食衎衎，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：鸿渐于陆，夫征不复，妇孕不育，凶——进退失据。经文大意是「鸿渐于陆，夫征不复，妇孕不育，凶；利御寇。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：鸿渐于木，或得其桷，无咎——暂栖得所。经文大意是「鸿渐于木，或得其桷，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：鸿渐于陵，妇三岁不孕，终莫之胜，吉——久后胜。经文大意是「鸿渐于陵，妇三岁不孕，终莫之胜，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：鸿渐于陆，羽可用为仪，吉——仪表可观。经文大意是「鸿渐于陆，其羽可用为仪，吉。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"兑":{"g":"兑是悦、是说。亨，利贞——沟通能开局，但要正，悦不能邪。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，利贞。」。","y":"两泽相连，朋友讲习。新手：谈判、教学、联谊靠真诚；来兑（佞悦讨好）反凶。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主口才、谈判、聚会、喜悦。（结合你的实际情况慢慢对照即可。）","宜和兑、孚兑；忌佞口。（结合你的实际情况慢慢对照即可。）","商兑未宁：商量未定。（结合你的实际情况慢慢对照即可。）","朋友讲习：互相启发。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初九：和兑，吉——平和的喜悦。经文大意是「和兑，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：孚兑，吉，悔亡——诚信的喜悦。经文大意是「孚兑，吉，悔亡。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：来兑，凶——外来佞悦，凶。经文大意是「来兑，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：商兑未宁，介疾有喜——商量中有砥砺，终喜。经文大意是「商兑，未宁，介疾有喜。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：孚于剥，有厉——信了剥落小人，危。经文大意是「孚于剥，有厉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：引兑——引来喜悦，有引导、有收束。经文大意是「引兑。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"困":{"g":"困是受困。亨，贞，大人吉，无咎。有言不信——困时说话没人信，靠行动与志。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，贞，大人吉，无咎，有言不信。」。","y":"泽无水，穷困。新手：外在卡住时，先守住心志，少无效解释；酒食之困有时反藏转机。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主经济困、人际困、身体困。（结合你的实际情况慢慢对照即可。）","宜守志、少言多行；忌空辩。（结合你的实际情况慢慢对照即可。）","有言不信：别指望解释。（结合你的实际情况慢慢对照即可。）","动悔有悔：行动才能解。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：臀困于株木，入幽谷——困在底部。经文大意是「臀困于株木，入于幽谷，三岁不觌。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：九二：困于酒食，朱绂将至——困中有贵征。经文大意是「困于酒食，朱绂方来，利用亨祀，征凶，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：困于石，据蒺藜——进退皆刺。经文大意是「困于石，据于蒺藜，入于其宫，不见其妻，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：来徐徐，困于金车，吝有终。经文大意是「来徐徐，困于金车，吝，有终。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：劓刖，困于赤绂，徐有说——受刑仍徐徐解脱。经文大意是「劓刖，困于赤绂，乃徐有说，利用祭祀。」。零基础可记：看清这一步该进还是该守，别跳步。","上六：困于葛藟，曰动悔，有悔征吉——知道动才有悔，真动则吉。"]},"萃":{"g":"萃是聚集。亨。王到宗庙，利见大人，利贞，用大牲吉，利有攸往——人聚、资聚，要有共同信仰与中心。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨。王假有庙，利见大人，亨，利贞。用大牲吉，利有攸往。」。","y":"泽上于地，水聚。新手：聚会、集资、组团，先立「庙」（共同目标），否则聚而乱。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主聚会、集资、社团、人气。（结合你的实际情况慢慢对照即可。）","宜立共同目标；忌乌合。（结合你的实际情况慢慢对照即可。）","王假有庙：精神中心。（结合你的实际情况慢慢对照即可。）","赍咨涕洟：聚而未安则忧。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：有信不终，乃乱乃萃——信不长久则聚而乱。经文大意是「有孚不终，乃乱乃萃，若号一握为笑，勿恤，往无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：引吉无咎，孚乃利用禴——被引导聚，薄祭亦可。经文大意是「引吉，无咎，孚乃利用禴。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：萃如嗟如，往无咎小吝——聚中有叹。经文大意是「萃如，嗟如，无攸利，往无咎，小吝。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：大吉无咎。经文大意是「大吉，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。","九五：萃有位无咎，匪孚，元永贞悔亡——有位还要永久守正取信。","上爻（收尾）：上六：赍咨涕洟，无咎——忧惧涕泣，无咎。经文大意是「赍咨涕洟，无咎。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"咸":{"g":"咸是感应。亨，利贞，取女吉——相互感应是关系的开始，利于正当的结合。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，利贞，取女吉。」。","y":"山泽通气，二气感应。新手谈感情：要有互动，不要单相思；咸其辅颊舌只动嘴则戒。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主恋爱、感应、触动、婚姻启动。（结合你的实际情况慢慢对照即可。）","宜真诚互动；忌只动口不动心。（结合你的实际情况慢慢对照即可。）","取女吉：正当结合。（结合你的实际情况慢慢对照即可。）","憧憧往来：心思要专。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：咸其拇——感应在脚趾，刚开始。经文大意是「咸其拇。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：咸其腓，凶，居吉——动小腿凶，安居吉。经文大意是「咸其腓，凶，居吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：咸其股，执其随，往吝——跟着感觉走吝。经文大意是「咸其股，执其随，往吝。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：贞吉悔亡，憧憧往来，朋从尔思——心专则友来。经文大意是「贞吉悔亡，憧憧往来，朋从尔思。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：咸其脢，无悔——感应在背肉，无悔。经文大意是「咸其脢，无悔。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：咸其辅颊舌——只剩嘴上感应，戒空言。经文大意是「咸其辅颊舌。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"蹇":{"g":"蹇是跛行、艰难。利西南不利东北；利见大人，贞吉——难时往和缓处、找能帮忙的人，守正。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「利西南，不利东北；利见大人，贞吉。」。","y":"山上有水，见险而止。新手：前路难时，退一步、找贵人，比硬闯强。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主阻碍、行路难、求告。（结合你的实际情况慢慢对照即可。）","宜求助、退修；忌孤闯。（结合你的实际情况慢慢对照即可。）","利西南：往柔顺有利处。（结合你的实际情况慢慢对照即可。）","大蹇朋来：难中见真友。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：往蹇来誉——去难，回来有名声。经文大意是「往蹇，来誉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：王臣蹇蹇，匪躬之故——为公不是为私难。经文大意是「王臣蹇蹇，匪躬之故。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：往蹇来反——去难则回。经文大意是「往蹇来反。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：往蹇来连——连着难。经文大意是「往蹇来连。」。零基础可记：看清这一步该进还是该守，别跳步。","五爻（核心位置）：九五：大蹇朋来——大难中朋友来。经文大意是「大蹇朋来。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上六：往蹇来硕，吉，利见大人——回来丰硕，见大人。经文大意是「往蹇来硕，吉；利见大人。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"谦":{"g":"谦是谦虚。亨，君子有终——谦虚的人走到最后。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，君子有终。」。","y":"山在地中，高而能下。新手：退一步不是输；劳而能谦，反而有终局。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主退让、低调成功、礼仪。（结合你的实际情况慢慢对照即可。）","宜谦；忌骄。（结合你的实际情况慢慢对照即可。）","劳谦有终。（结合你的实际情况慢慢对照即可。）","侵伐也要以谦道有名。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：谦谦君子，用涉大川——越在下越谦，可闯关。经文大意是「谦谦君子，用涉大川，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","二爻（进展）：六二：鸣谦，贞吉——谦被听见，吉。经文大意是「鸣谦，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：九三：劳谦君子有终——有功劳仍谦。经文大意是「劳谦，君子有终，吉。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：六四：无不利，撝谦——发挥谦。经文大意是「无不利，撝谦。」。零基础可记：看清这一步该进还是该守，别跳步。","六五：不富以其邻，利用侵伐——不靠富压人，该出手也出手。","上爻（收尾）：上六：鸣谦，利用行师征邑国——谦声在，仍可整肃。经文大意是「鸣谦，利用行师，征邑国。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"小过":{"g":"小过是小有超过。亨，利贞，可小事不可大事。飞鸟留下声音，不宜上宜下，大吉——宜低调、做小、向下落实。","y":"山上有雷，小过。新手：修正细节可以，搞大事、向上硬冲容易「飞鸟以凶」。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主小节、修正、小心行事。（结合你的实际情况慢慢对照即可。）","宜做小；忌做大、向上冒险。（结合你的实际情况慢慢对照即可。）","不宜上宜下。（结合你的实际情况慢慢对照即可。）","密云不雨：未成大气候。（结合你的实际情况慢慢对照即可。）"],"yao":["初爻（开始）：初六：飞鸟以凶——刚飞就凶，勿躁。经文大意是「飞鸟以凶。」。零基础可记：看清这一步该进还是该守，别跳步。","六二：过其祖遇其妣，不及其君遇其臣，无咎——过与不及之间得宜。","三爻（进退关口）：九三：弗过防之，或戕之，凶——不过分防备反而被害。经文大意是「弗过防之，从或戕之，凶。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：无咎，弗过遇之，往厉必戒，勿用永贞。经文大意是「无咎，弗过遇之。往厉必戒，勿用永贞。」。零基础可记：看清这一步该进还是该守，别跳步。","六五：密云不雨，自我西郊，公弋取彼在穴——未雨，取穴中物。","上爻（收尾）：上六：弗遇过之，飞鸟离之，凶，是谓灾眚——过了头。经文大意是「弗遇过之，飞鸟离之，凶，是谓灾眚。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"归妹":{"g":"归妹是嫁妹、关系未正而结合。征凶，无攸利——名分不正就推进，多不利。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「征凶，无攸利。」。","y":"泽上有雷，动而悦，但位不当。新手：感情/合作没谈清名分与责任就落地，容易留后患。 对普通人：不必背术语，记住「局面是什么、我该进还是守、有没有过刚或过弱」三问即可。","z":["多主婚恋名分、偏房式安排、仓促结合。","宜正名分；忌急就章。（结合你的实际情况慢慢对照即可。）","愆期：时未到。（结合你的实际情况慢慢对照即可。）","承筐无实：有名无实。（结合你的实际情况慢慢对照即可。）"],"yao":["初九：归妹以娣，跛能履，征吉——以侧室/辅助身份反而可行。","二爻（进展）：九二：眇能视，利幽人之贞——有缺陷仍守静正。经文大意是「眇能视，利幽人之贞。」。零基础可记：看清这一步该进还是该守，别跳步。","三爻（进退关口）：六三：归妹以须，反归以娣——等变为侧。经文大意是「归妹以须，反归以娣。」。零基础可记：看清这一步该进还是该守，别跳步。","四爻（接近结果）：九四：归妹愆期，迟归有时——晚嫁有时。经文大意是「归妹愆期，迟归有时。」。零基础可记：看清这一步该进还是该守，别跳步。","六五：帝乙归妹，君袂不如娣袂良——主不如侧的装束，重实不重饰。","上爻（收尾）：上六：女承筐无实，士刲羊无血，无攸利——空礼无实。经文大意是「女承筐无实，士刲羊无血，无攸利。」。零基础可记：看清这一步该进还是该守，别跳步。"]},"遯":{"g":"遁是「退避、抽身」。不是怂，而是天时不利时保存力量。卦辞说小有利贞：可以守住原则，但别硬闯。 用更直白的话说：这卦在讲一种生活局面，不是算命口号。结合你的具体问题，先问自己「我现在处在开始、中间还是收尾」，再对照六爻。卦辞原文是「亨，小利贞。」。","y":"天下有山，山再高也顶不到天——说明有界限。当环境变差，主动退后一步，才能以后再进。新手常误以为「退=失败」；其实乱进才失败。","z":["多主离职、分手缓冲、撤资、回避冲突、暂时低调。","宜抽身、减负、止损；忌硬刚、恋战、面子工程。","问「要不要退」：遁卦常支持有计划地退，不是狼狈逃。","退时留后路、留体面，勿撕破脸。（结合你的实际情况慢慢对照即可。）"],"yao":["初六：逃得太晚、尾部还露在外面，危险。该断就断，别拖泥带水。","六二：像被黄牛皮捆住，动不了也拆不掉。宜坚守既定退路，勿临时变卦。","九三：想退又被牵住（疾病、下属、琐事）。先处理拖累，再谈脱身。","九四：君子知机而退则吉，看不清还硬撑的人则凶。关键在「认不认账」。","五爻（核心位置）：九五：漂亮的撤退，时机对、姿态稳，值得肯定。经文大意是「嘉遁，贞吉。」。零基础可记：看清这一步该进还是该守，别跳步。","上爻（收尾）：上九：退得彻底、轻快，无不利。适合彻底放下、换赛道。经文大意是「肥遁，无不利。」。零基础可记：看清这一步该进还是该守，别跳步。"]}}

g":"亨小，利贞，初吉终乱。","y":"水在火上，既济；终止则乱，其道穷。","z":["事已成，防终乱","濡尾无咎，慎终","东邻杀牛不如西邻禴祭，诚重于奢"]},"未济":{"g":"亨，小狐汔济，濡其尾，无攸利。","y":"火在水上，未济；辨物居方。","z":["未完成，最后勿大意","小狐濡尾，差一步仍凶","有孚饮酒，成功后勿失度"]},"遯":{"g":"亨，小利贞。天下有山，遁。","y":"刚当位而应，与时行也；退以成亨。","z":["宜退守、回避、抽身","好遁嘉遁为美，肥遁无不利","系遁有疾，藕断丝连则厉"]}}

function weaveSchool(base, extra) {
  const a = String(base || '').trim()
  const b = String(extra || '').trim()
  if (!b) return a
  if (!a) return b
  if (a.indexOf(b) >= 0) return a
  const head = /[。！？；]$/.test(a) ? a : a + '。'
  return head + b
}

function p(text) { return { type: 'p', text } }
function quote(text, from) { return { type: 'quote', text, from: from || '' } }
function list(items) { return { type: 'list', items } }
function note(text) { return { type: 'note', text } }

function buildGuaRecords() {
  const out = []
  for (const pk of PALACE_ORDER) {
    const palace = PALACES[pk]
    palace.gua.forEach((lines, si) => {
      const key = lines.join('')
      const meta = GUA64_NAMES[key]
      const alias = meta.alias
      const ci = getGuaCi(alias) || {}
      const lower = TRIGRAMS[linesToTrigramKey(lines.slice(0, 3))]
      const upper = TRIGRAMS[linesToTrigramKey(lines.slice(3, 6))]
      const theme = THEME[alias] || '审时度势，守正知变'
      const ex = EXTRA[alias] || EXTRA[meta.name] || {}
      const bh = getBaihua(alias) || getBaihua(meta.name) || null
      const mojia = getMojia(alias) || getMojia(meta.name) || null
      const yaoYiRaw = (bh && bh.yao) || YAO_YI[alias] || []
      const yaoYi = yaoYiRaw.map((line, i) => weaveSchool(line, mojia && mojia.yao && mojia.yao[i]))
      const shi = SHI_POS[si]
      // lines: 下→上；yaoView: 上→下（画面从上往下画六爻）
      const yaoView = lines.slice().reverse().map((v) => ({ yang: !!v }))
      out.push({
        alias,
        fullName: meta.name,
        palaceKey: pk,
        palaceName: palace.name,
        palaceWuxing: palace.wuxing,
        stage: STAGE[si],
        stageIndex: si,
        shiPos: shi,
        shiLabel: YAO_POS[shi],
        yingLabel: YAO_POS[(shi + 3) % 6],
        lines: lines.slice(),
        yaoView,
        lowerName: lower.name,
        upperName: upper.name,
        lowerNature: lower.nature,
        upperNature: upper.nature,
        nameWhy: ci.nameWhy || '',
        guaci: ci.guaci || '',
        yaoci: ci.yaoci || [],
        theme,
        // 白话优先用零基础详解
        guaciYi: weaveSchool((bh && bh.g) || ex.g || ('大意：' + theme), mojia && mojia.guaci),
        yili: weaveSchool((bh && bh.y) || ex.y || theme, mojia && mojia.yili),
        zhan: (bh && bh.z) || ex.z || [theme],
        yaoYi,
        mojia
      })
    })
  }
  return out
}

function blocksForGua(g, opts) {
  opts = opts || {}
  const blocks = []
  if (!opts.standalone) {
    blocks.push(p('━━━━━━━━━━━━━━━━'))
    blocks.push(p('【' + g.fullName + ' · ' + g.alias + '】'))

    + '  ·  下' + (lower.symbol || '') + lower.name + (lower.nature || '')
    + '·' + (lower.de || '') + (lower.family ? '（' + lower.family + '）' : '')

/** 正则转义（勿用 replace 的 '$&' 写法，嵌入 HTML 打包时会被当成特殊替换符） */
function escapeRegExp(s) {
  return String(s || '').replace(/[.*+?^${}()|[\]\\]/g, (ch) => '\\' + ch)
}

/** 句末补句号，便于连写 */
function ensureSentenceEnd(s) {
  let t = String(s || '').trim()
  if (!t) return ''
  if (!/[。．！？；…」』）)]$/.test(t)) t += '。'
  return t
}

/**
 * 拆成「原文 / 后文」便于原文加粗、白话不粗，仍连写不断行
 * 返回 { classic, rest, text }
 */
function joinYaoExplainFlow(classic, tip, sage) {
  const c = ensureSentenceEnd(classic)
  let t = String(tip || '').trim()
  let s = String(sage || '').trim()
  const restParts = []

  if (t) {
    if (c) {
      const cCore = c.replace(/[。．！？；…]+$/, '')
      const norm = (str) => String(str || '').replace(/[，,。．！？；：:\s「」『』]/g, '')
      // 白话与原文实质相同则跳过，避免「富家，大吉。富家大吉。」
      if (norm(t) && norm(t) === norm(cCore)) {
        t = ''
      } else if (t === cCore || t.indexOf(cCore) === 0) {
        t = t.slice(cCore.length).replace(/^[：:，,\s]+/, '')
      }
    }
    t = ensureSentenceEnd(t)
    if (t) restParts.push(t)
  }

  if (s) {
    s = s.replace(/^[。．\s]+/, '')
    if (s) restParts.push(s)
  }

  const rest = restParts.join('').replace(/。{2,}/g, '。').replace(/——。/g, '——').trim()
  const text = (c + rest).replace(/。{2,}/g, '。').trim()
  return { classic: c, rest, text }
}

/**
 * 爻辞解释区的白话：直接说意思，不重复位名、不贴套话。
 */
function cleanYaoExplain(tip, posLabel, classicBody) {
  let t = String(tip || '').trim()
  if (!t) return ''

  // 1) 先剥「四爻（接近结果）：」——须先于位名
  t = t.replace(/^[初上]爻（[^）]*）[：:]\s*/, '')
  t = t.replace(/^[二三四五]爻（[^）]*）[：:]\s*/, '')

  // 2) 剥位名 + 可选摘句：「初九「潜龙勿用」：」「六四：」
  const pos = String(posLabel || '')
  if (pos) {
    const ep = escapeRegExp(pos)
    t = t.replace(new RegExp('^' + ep + '「[^」]*」[：:]\\s*'), '')
    t = t.replace(new RegExp('^' + ep + '『[^』]*』[：:]\\s*'), '')
    t = t.replace(new RegExp('^' + ep + '[：:]\\s*'), '')
  }
  t = t.replace(/^(?:初[九六]|上[九六]|[九六][二三四五])「[^」]*」[：:]\s*/, '')
  t = t.replace(/^(?:初[九六]|上[九六]|[九六][二三四五])[：:]\s*/, '')

  // 3) 去掉「经文大意 / 零基础可记」套话
  t = t.replace(/。?\s*经文大意是「[^」]*」[。.]?/g, '')
  t = t.replace(/。?\s*零基础可记[：:][^。]*[。.]?/g, '')

  // 4) 「辞意复述——白话」：只留破折号后的直接解释
  const dashParts = t.split(/[—－]{1,2}/)
  if (dashParts.length >= 2) {
    const right = dashParts.slice(1).join('—').trim()
    if (right.length >= 2) t = right
  }

  // 5) 若仍以完整原文起头，剥掉
  if (classicBody) {
    const body = String(classicBody).replace(/[。．.]+$/, '').trim()
    if (body) {
      const esc = escapeRegExp(body)
      t = t.replace(new RegExp('^「' + esc + '」[：:]\\s*'), '')
      t = t.replace(new RegExp('^' + esc + '[：:，,\\s]*'), '')
    }
  }
  t = t.replace(/^「[^」]+」[：:]\s*/, '')

  t = t.replace(/。{2,}/g, '。').replace(/^[。\s]+/, '').trim()
  if (t === '。') t = ''
  return t
}
