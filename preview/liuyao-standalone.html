  const PREVIEW_ACCOUNT_KEY = 'liuyao_preview_account_v2'
  const PREVIEW_SESSION_KEY = 'liuyao_preview_session_v2'

  function accountEsc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
  }

  function cleanAccountNick(value, fallback = '研习者') {
    const clean = String(value == null ? '' : value)
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
    return Array.from(clean || fallback).slice(0, 20).join('')
  }

  function previewStoreGet(key) {
    try {
      const raw = window.localStorage.getItem(key)
      return raw ? JSON.parse(raw) : null
    } catch (e) {
      return null
    }
  }

  function previewStoreSet(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value))
      return true
    } catch (e) {
      return false
    }
  }

  function previewStoreRemove(key) {
    try {
      window.localStorage.removeItem(key)
    } catch (e) {
      // ignore
    }
  }

  function hydratePreviewAccount() {
    const account = previewStoreGet(PREVIEW_ACCOUNT_KEY)
    const session = previewStoreGet(PREVIEW_SESSION_KEY)
    state.account = account && account.id ? account : null
    state.user = state.account && session && session.accountId === state.account.id
      ? { ...state.account, loginAt: session.issuedAt, authenticated: true, localOnly: true }
      : null
    state.accountNick = state.account ? state.account.nickName : ''
    state.accountAvatar = state.account ? state.account.avatarUrl || '' : ''
  }

  function savePreviewAccount(account, signedIn) {
    state.account = account
    previewStoreSet(PREVIEW_ACCOUNT_KEY, account)
    if (signedIn) {
      const issuedAt = new Date().toISOString()
      const session = { version: 2, accountId: account.id, issuedAt }
      previewStoreSet(PREVIEW_SESSION_KEY, session)
      state.user = { ...account, loginAt: issuedAt, authenticated: true, localOnly: true }
    } else {
      previewStoreRemove(PREVIEW_SESSION_KEY)
      state.user = null
    }
  }

  function accountInitial(account) {
    const name = cleanAccountNick(account && account.nickName)
    return Array.from(name)[0] || '易'
  }

  function onSwipeStart(e) {
    const t = e.changedTouches && e.changedTouches[0]
    if (!t) return
    touchStartX = t.clientX
    touchStartY = t.clientY
    touchStartT = Date.now()
  }
  function onSwipeEnd(e) {
    const t = e.changedTouches && e.changedTouches[0]
    if (!t || stack.length <= 1) return
    const dx = t.clientX - touchStartX
    const dy = t.clientY - touchStartY
    const dt = Date.now() - touchStartT
    if (dt > 600) return
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.2) return
    const fromEdge = touchStartX <= 28 && dx > 70
    const swipeLeft = dx < -70
    if (!fromEdge && !swipeLeft) return
    back()
  }

  if (navBack) navBack.onclick = () => goHomeFromNav()
  if (shell) {
    shell.addEventListener('touchstart', onSwipeStart, { passive: true })

  /* ───────── 朝向跟随（预览）─────────
     目标：手机一转，盘面就转。
     iOS Safari 必须 HTTPS + 用户手势授权；安卓多数可 HTTP。
  */
  let compassTick = 0
  let pendingHeading = null
  let compassBound = false
  let orientHandler = null
  let motionHandler = null
  let absoluteSensor = null
  let sensorEventCount = 0
  let lastSensorNote = '未开启'
  let relativeAlphaZero = null

  function isIOS() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent || '')
  }

  function isSecureForSensors() {
    if (typeof window === 'undefined') return false
    if (window.isSecureContext) return true
    const host = String(location.hostname || '')
    return host === 'localhost' || host === '127.0.0.1'
  }

  function httpsPreviewUrl() {
    try {
      const u = new URL(location.href)
      u.protocol = 'https:'
      if (u.port === '8765' || !u.port) u.port = '8766'
      if (!u.searchParams.get('v')) u.searchParams.set('v', 'compass3')
      return u.toString()
    } catch (e) {
      return 'https://192.168.1.12:8766/liuyao-standalone.html?v=compass3'
    }
  }

  function setSensorNote(msg) {
    lastSensorNote = msg
    state._dragHint = msg
  }

  function headingFromOrientEvent(e) {
    if (!e) return null
    // iOS：正北夹角（度）
    if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading)) {
      return ((Number(e.webkitCompassHeading) % 360) + 360) % 360
    }
    if (e.alpha == null || Number.isNaN(Number(e.alpha))) return null
    const alpha = Number(e.alpha)
    // 绝对方位
    if (e.absolute === true || e.absolute === 1) {
      return ((360 - alpha) % 360 + 360) % 360
    }
    // 相对方位：以首次读数为 0，保证「手机转 → 盘转」
    if (relativeAlphaZero == null) relativeAlphaZero = alpha
    let rel = alpha - relativeAlphaZero
    rel = ((rel % 360) + 360) % 360
    return ((360 - rel) % 360 + 360) % 360
  }

  let orientSeenAt = 0
  let gyroYaw = 0
  let lastMotionT = 0

  function applyPreviewCompass(heading) {
    sensorEventCount += 1
    orientSeenAt = Date.now()
    const h = ((Number(heading) % 360) + 360) % 360
    pendingHeading = h
    const now = Date.now()
    if (now - compassTick < 16) {
      if (!applyPreviewCompass._raf) {
        applyPreviewCompass._raf = requestAnimationFrame(() => {
          applyPreviewCompass._raf = 0
          compassTick = Date.now()
          if (pendingHeading != null) applyLiveHeading(pendingHeading)
        })
      }
      return
    }
    compassTick = now
    applyLiveHeading(h)
  }

  function unbindDeviceOrientation() {
    if (orientHandler) {
      window.removeEventListener('deviceorientation', orientHandler, true)
      window.removeEventListener('deviceorientation', orientHandler, false)
      window.removeEventListener('deviceorientationabsolute', orientHandler, true)
      window.removeEventListener('deviceorientationabsolute', orientHandler, false)
      orientHandler = null
    }
    if (motionHandler) {
      window.removeEventListener('devicemotion', motionHandler, true)
      window.removeEventListener('devicemotion', motionHandler, false)
      motionHandler = null
    }
    compassBound = false
    if (absoluteSensor) {
      try { absoluteSensor.stop() } catch (e) { /* ignore */ }
      absoluteSensor = null
    }
  }

  function bindDeviceOrientation(force) {
    if (typeof window === 'undefined') return false
    if (!window.DeviceOrientationEvent && typeof AbsoluteOrientationSensor !== 'function') return false
    if (compassBound && !force) return true
    if (force) unbindDeviceOrientation()
    relativeAlphaZero = null
    sensorEventCount = 0
    orientSeenAt = 0
    lastMotionT = 0

    orientHandler = (e) => {
      const h = headingFromOrientEvent(e)
      if (h == null || Number.isNaN(h)) return
      applyPreviewCompass(h)
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', orientHandler, true)
      window.addEventListener('deviceorientation', orientHandler, false)
      window.addEventListener('deviceorientationabsolute', orientHandler, true)
      window.addEventListener('deviceorientationabsolute', orientHandler, false)
    }

    // 陀螺：orientation 静默时仍跟手（不抢占有 orientation 的时段）
    motionHandler = (e) => {
      if (Date.now() - orientSeenAt < 180) return
      const rr = e && e.rotationRate
      if (!rr || rr.alpha == null) return
      let rate = Number(rr.alpha)
      if (Number.isNaN(rate)) return
      // 部分浏览器给 rad/s
      if (Math.abs(rate) <= 0.8) rate = (rate * 180) / Math.PI
      const t = e.timeStamp || Date.now()
      if (!lastMotionT) {
        lastMotionT = t
        return
      }
      const dt = Math.min(0.05, Math.max(0, (t - lastMotionT) / 1000))
      lastMotionT = t
      gyroYaw = ((gyroYaw - rate * dt) % 360 + 360) % 360
      applyPreviewCompass(gyroYaw)
    }
    window.addEventListener('devicemotion', motionHandler, true)
    window.addEventListener('devicemotion', motionHandler, false)

    if (typeof AbsoluteOrientationSensor === 'function' && window.isSecureContext) {
      try {
        const sensor = new AbsoluteOrientationSensor({ frequency: 30, referenceFrame: 'device' })
        sensor.addEventListener('reading', () => {
          if (!sensor.quaternion) return
          const [x, y, z, w] = sensor.quaternion
          const siny = 2 * (w * z + x * y)
          const cosy = 1 - 2 * (y * y + z * z)
          let yaw = (Math.atan2(siny, cosy) * 180) / Math.PI
          yaw = ((-yaw % 360) + 360) % 360
          applyPreviewCompass(yaw)
        })
        sensor.start()
        absoluteSensor = sensor
      } catch (e) { /* ignore */ }
    }

    compassBound = true
    return true
  }

  /**
   * iOS：必须在用户手势同步调用栈里直接 requestPermission。
   * 不要在此函数开头 await/setTimeout，否则会“点了没反应”。
   */
  function requestCompassPermission(fromUser) {
    // 1) 先挂监听（同步）
    try { bindDeviceOrientation(true) } catch (e) { /* ignore */ }

    const DOE = window.DeviceOrientationEvent
    const DME = window.DeviceMotionEvent
    const needOri = !!(DOE && typeof DOE.requestPermission === 'function')
    const needMot = !!(DME && typeof DME.requestPermission === 'function')

    // 2) 立刻在手势栈内调权限（iOS 关键）
    if (needOri || needMot) {
      let oriP = Promise.resolve('granted')
      let motP = Promise.resolve('granted')
      try {
        if (needOri) oriP = DOE.requestPermission()
      } catch (e) {
        oriP = Promise.reject(e)
      }
      try {
        if (needMot) motP = DME.requestPermission()
      } catch (e) {
        motP = Promise.resolve('denied')
      }
      Promise.all([oriP.catch(() => 'denied'), motP.catch(() => 'denied')])
        .then(([ori]) => {
          relativeAlphaZero = null
          lastMotionT = 0
          try { bindDeviceOrientation(true) } catch (e) { /* ignore */ }
          if (fromUser && ori !== 'granted' && !state.compassReady) {
            setSensorNote('请允许「运动与方向」后再次点击盘面')
          }
          paintLuopanLive()
        })
      return true
    }

    // 3) 安卓等：无权限 API，直接听传感器
    paintLuopanLive()
    return true
  }

  /** 在传感器就绪前，每次点击/触摸都重新申请（避免 once 失败后永远不再弹） */
  function armCompassOnGesture() {
    const arm = () => {
      if (state.compassReady && sensorEventCount > 2) return
      requestCompassPermission(true)
    }
    document.addEventListener('touchend', arm, { capture: true, passive: true })
    document.addEventListener('click', arm, { capture: true })
    // 盘面区域额外绑定，保证点罗盘必触发
    document.addEventListener('touchstart', (ev) => {
      const t = ev.target
      if (!t) return
      if (t.closest && (t.closest('#luopan-wrap') || t.closest('#luopan-hud') || t.closest('.luopan-controls'))) {
        requestCompassPermission(true)
      }
    }, { capture: true, passive: true })
  }

  // 启动：先挂监听；非 iOS 直接开；iOS 等用户点盘面/屏幕
  try { bindDeviceOrientation(false) } catch (e) { /* ignore */ }
  if (!isIOS()) {
    try { requestCompassPermission(false) } catch (e) { /* ignore */ }
  }
  armCompassOnGesture()

  hydratePreviewAccount()
  window.addEventListener('scroll', syncLearnActiveFromScroll, { passive: true })
  window.__liuyaoPreview = {
    state, go, back, render, stack,
    requestCompassPermission,
    httpsPreviewUrl
  }
  try {
    render()
  } catch (e) {
    console.error('[liuyao] render failed', e)
    if (app) app.innerHTML = '<p style="padding:24px;line-height:1.6">页面加载异常，请刷新重试。</p>'
  }
})()

</script>
</body>
</html>
