<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>周易研习</title>
  <style>
    :root {
      --ink: #1c1814;
      --ink-2: #2e261f;
      --ink-soft: #5c5146;
      --mist: rgba(28, 24, 20, 0.5);
      --paper: #ebe0c8;
      --paper-deep: #d9c9a8;
      --cream: #faf6ea;
      --cinnabar: #9b2d24;
      --cinnabar-deep: #7a221c;
      --cinnabar-soft: rgba(155, 45, 36, 0.1);
      --bronze: #6e5a3e;
      --bronze-soft: rgba(110, 90, 62, 0.14);
      --bronze-light: #a08a62;
      --line: rgba(28, 24, 20, 0.1);
      --line-strong: rgba(28, 24, 20, 0.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
      color: var(--ink);
      background: #dccdb0;
      letter-spacing: 0.02em;
      line-height: 1.8;
    }
    .atmosphere {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 110% 58% at 50% -14%, rgba(250, 246, 234, 0.95), transparent 58%),
        radial-gradient(ellipse 48% 36% at 0% 88%, rgba(155, 45, 36, 0.04), transparent 52%),
        radial-gradient(ellipse 42% 32% at 100% 18%, rgba(110, 90, 62, 0.1), transparent 50%),
        linear-gradient(180deg, #f5edd9 0%, #ebe0c8 46%, #dccdb0 100%);
    }
    .atmosphere::after {
      content: "";
      position: absolute; inset: 0; opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .watermark {
      position: fixed; right: 18px; top: 24%; width: 90px; height: 72px;
      opacity:.035; pointer-events:none; z-index:0;
      background:
        linear-gradient(90deg, rgba(28,24,20,.8) 0 42%, transparent 42% 58%, rgba(28,24,20,.8) 58%) 0 0/100% 6px no-repeat,
        linear-gradient(90deg, rgba(28,24,20,.8) 0 42%, transparent 42% 58%, rgba(28,24,20,.8) 58%) 0 22px/100% 6px no-repeat,
        linear-gradient(90deg, rgba(28,24,20,.8), rgba(28,24,20,.8)) 0 44px/100% 6px no-repeat;
    }
    .shell {
      position: relative; z-index: 1;
      width: min(393px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .nav {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center;
      min-height: 46px;
      padding: 4px 12px;
      background: linear-gradient(180deg, rgba(245,237,217,0.98), rgba(235,224,200,0.96));
      color: var(--ink-soft);
      font-size: 15px;
      font-family: "Songti SC", serif;
    }
    .nav.home-hidden { display: none; }
    .nav-title { display: none; }
    .nav-back {
      position: static;
      display: none; align-items: center; gap: 2px;
      border: 0; background: transparent; color: var(--ink-soft);
      font: inherit; font-size: 15px; letter-spacing: 0.16em; text-indent: 0;
      padding: 8px 4px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .nav-back.show { display: inline-flex; }
    .nav-back .chev { color: var(--cinnabar); font-size: 21px; line-height: 1; margin-top: -1px; }
    .shell.swipe-hint { box-shadow: inset 3px 0 0 rgba(160, 40, 32, 0.35); }
    .content {
      padding: 10px 16px 40px;
      flex: 1;
      animation: pageIn .42s ease both;
    }
    .content.has-page-footer {
      padding-bottom: calc(112px + env(safe-area-inset-bottom));
    }
    .page-footer {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: min(361px, calc(100vw - 32px));
      display: flex;
      gap: 10px;
      padding: 18px 0 max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      border-top: 1px solid rgba(110,90,62,.18);
      background: linear-gradient(180deg, rgba(235,224,200,.82), rgba(235,224,200,.98) 18px, #dccdb0 100%);
      box-shadow: 0 -10px 24px rgba(28,24,20,.08);
    }
    .page-footer .btn {
      flex: 1;
      width: auto;
      min-width: 0;
      margin: 0 !important;
    }
    .page-footer.single .btn { width: 100%; }
    .hero.quiet { padding: 8px 4px 2px; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* frames */
    .frame {
      position: relative;
      border: 1px solid var(--line-strong);
      background: rgba(250, 246, 234, 0.72);
      padding: 18px 15px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(250,246,234,0.35);
    }
    .frame::before {
      content: "";
      position: absolute; inset: 6px;
      border: 1px solid rgba(28,24,20,0.07);
      pointer-events: none;
    }
    .corner {
      position: absolute; width: 12px; height: 12px; border-color: var(--bronze-light); border-style: solid; opacity: 0.75;
    }
    .corner.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .title-zh {
      font-family: "Songti SC", serif;
      font-size: 25px; font-weight: 400; letter-spacing: 0.28em; text-indent: 0.28em;
    }
    .subtitle { margin-top: 8px; color: var(--ink-soft); font-size: 14px; letter-spacing: 0.18em; }
    .cast-title {
      text-align: center; font-size: 32px; line-height: 1.25;
    }
    .cast-subtitle {
      margin-top: 6px; text-align: center; font-size: 16px;
      letter-spacing: .2em; text-indent: .2em;
    }
    .muted { color: var(--mist); font-size: 15px; line-height: 1.85; }
    .seal {
      display: inline-block;
      color: var(--cinnabar);
      border: 1.5px solid rgba(155, 45, 36, 0.78);
      padding: 4px 10px;
      font-size: 13px;
      letter-spacing: 0.28em;
      background: rgba(155, 45, 36, 0.04);
      font-family: "Songti SC", serif;
      transform: rotate(-1.2deg);
      box-shadow: inset 0 0 0 1px rgba(155,45,36,0.12);
    }
    .ornament {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin: 12px 0; color: var(--bronze); letter-spacing: 0.24em; font-size: 13px;
    }
    .ornament::before, .ornament::after {
      content: ""; width: 34px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--bronze), transparent);
    }

    .btn {
      width: 100%; border-radius: 0; border: 1px solid var(--ink);
      padding: 13px 0; font-size: 16px; letter-spacing: 0.36em; text-indent: 0.36em;
      cursor: pointer; font-family: inherit; margin-bottom: 8px;
      transition: transform .15s ease, background .2s ease, color .2s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: linear-gradient(180deg, #9d9588, #81796e);
      color: #fff;
      border-color: #756e64;
      box-shadow: 0 10px 24px rgba(42,34,28,0.12);
    }
    .btn-ghost {
      background: linear-gradient(180deg, #9d9588, #81796e);
      color: #fff;
      border-color: #756e64;
    }
    .btn:disabled {
      opacity: 1; cursor: not-allowed; box-shadow: none;
      color: #fff; background: #9a9182; border-color: #8c8375;
    }
    .row { display: flex; gap: 10px; }
    .row .btn { flex: 1; }

    input {
      width: 100%; margin-top: 6px; padding: 11px 0;
      border: none; border-bottom: 1px solid var(--line-strong);
      background: transparent; font-family: inherit; font-size: 17px;
      letter-spacing: 0.06em; color: var(--ink); outline: none;
    }

    /* hero */
    .hero { text-align: center; padding: 22px 4px 8px; position: relative; }
    .hero-bagua {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      margin: 8px auto 18px; opacity: 0.55;
    }
    .hero-bagua span {
      display: block; height: 3px; border-radius: 1px;
      background: var(--ink); animation: yaoBreath 2.8s ease-in-out infinite;
    }
    .hero-bagua .yang { width: 54px; }
    .hero-bagua .yin { width: 54px; background: transparent; border-top: 3px solid var(--ink); height: 0; position: relative; }
    .hero-bagua .yin::before, .hero-bagua .yin::after {
      content: ""; position: absolute; top: -3px; height: 3px; width: 22px; background: var(--ink);
    }
    .hero-bagua .yin::before { left: 0; }
    .hero-bagua .yin::after { right: 0; }
    .hero-bagua span:nth-child(2) { animation-delay: .15s; }
    .hero-bagua span:nth-child(3) { animation-delay: .3s; }
    .hero-bagua span:nth-child(4) { animation-delay: .45s; }
    .hero-bagua span:nth-child(5) { animation-delay: .6s; }
    .hero-bagua span:nth-child(6) { animation-delay: .75s; }
    @keyframes yaoBreath {
      0%,100% { opacity: .35; transform: scaleX(.92); }
      50% { opacity: .8; transform: scaleX(1); }
    }
    .brand {
      font-size: 68px; line-height: .95; letter-spacing: 0.42em; text-indent: 0.42em;
      font-weight: 600; margin: 4px 0 2px;
      text-shadow: 0 1px 0 rgba(246,237,216,0.35);
    }
    .brand-sub {
      font-size: 19px; letter-spacing: 0.84em; text-indent: 0.84em; color: var(--bronze);
      margin-bottom: 4px;
    }
    .hero-copy {
      max-width: 330px; margin: 0 auto 8px; color: var(--mist); font-size: 15.5px; line-height: 1.95;
    }
    .feature-strip {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin: 18px 0 16px;
    }
    .feature {
      text-align: center; padding: 12px 6px;
      border: 1px solid var(--line);
      background: rgba(246,237,216,0.4);
    }
    .feature b {
      display: block; font-size: 16px; letter-spacing: 0.2em; margin-bottom: 4px; font-weight: 600;
    }
    .feature span { font-size: 13px; color: var(--ink-soft); letter-spacing: 0.08em; }
    .link-row {
      display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 14px;
    }
    .text-link {
      letter-spacing: 0.3em; font-size: 15px; color: var(--ink); padding: 8px 2px; cursor: pointer;
      border-bottom: 1px solid transparent;
    }
    .text-link:active { border-bottom-color: var(--cinnabar); color: var(--cinnabar); }
    .dot { color: var(--bronze); opacity: .7; }

    /* cast */
    .mode-row { display: flex; border-bottom: 1px solid var(--line); margin: 12px 0 16px; }
    .mode {
      flex: 1; text-align: center; padding: 11px 0; font-size: 15px; letter-spacing: 0.18em;
      color: var(--ink-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
    }
    .mode.on { color: var(--cinnabar); border-bottom-color: var(--cinnabar); }
    .progress {
      display: flex; justify-content: center; gap: 8px; margin: 4px 0 14px;
    }
    .cast-shake-slot {
      position: relative; display: block;
      width: 150px; height: 56px; min-height: 0;
      margin: 4px auto 8px; padding: 0;
      overflow: hidden; border-width: 2px;
      border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
      color: #fff8e8;
      border-color: #56442f;
      background: linear-gradient(180deg, #8b7451, #655139);
      box-shadow: inset 0 0 0 4px rgba(255,248,225,.12), inset 0 1px 0 rgba(255,255,255,.2), 0 3px 8px rgba(73,54,34,.14);
    }
    .cast-shake-slot .shell-inset {
      position: absolute; inset: 7px 18px;
      border: 1px solid rgba(255,244,211,.45);
      border-radius: 50%; pointer-events: none;
    }
    .cast-shake-slot .shell-inset::before,
    .cast-shake-slot .shell-inset::after {
      content: ""; position: absolute; left: 50%; top: -5%;
      width: 1px; height: 110%; background: rgba(255,244,211,.24);
      transform-origin: 50% 50%;
    }
    .cast-shake-slot .shell-inset::before { transform: rotate(34deg); }
    .cast-shake-slot .shell-inset::after { transform: rotate(-34deg); }
    .cast-shake-slot .shell-label {
      position: relative; z-index: 2; letter-spacing: .22em; text-indent: .22em;
    }
    .bead {
      width: 10px; height: 10px; border: 1px solid var(--bronze); transform: rotate(45deg);
      background: transparent; transition: background .25s ease, border-color .25s ease;
    }
    .bead.on { background: var(--cinnabar); border-color: var(--cinnabar); }
    .stage-live {
      display: flex; gap: 14px; align-items: stretch;
      margin-top: 4px; overflow: visible; padding-top: 108px;
    }
    .coin-stage {
      flex: 1.15; text-align: center;
      display: flex; flex-direction: column; overflow: visible;
    }
    .coin-stage .btn { margin-bottom: 0; }
    .gua-side {
      flex: 0.85; min-width: 96px; min-height: 180px; padding: 0 2px 0 10px;
      border-left: 1px dashed var(--line); box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .stage-live .gua-side {
      min-height: 0; border-left: 1px dashed var(--line);
      transform: translateY(-10px);
    }
    .gua-side .gua-lab {
      margin: 0 0 10px; font-size: 14px; letter-spacing: 0.28em; text-indent: 0.28em;
      color: var(--bronze); text-align: center;
    }
    .stage-live .gua-side .gua-lab {
      position: absolute; left: 10px; right: 2px; top: -28px; margin: 0;
    }
    .gua-side .gua-lines {
      flex: 1; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center; gap: 0;
    }
    .yao-bar {
      display: block; width: 56px; height: 5px; margin: 0 auto; position: relative; box-sizing: border-box;
    }
    .yao-bar.sm { width: 42px; height: 4px; }
    .yao-bar.lg { width: 88px; height: 7px; }

    .shake .coin-body {
      transform-style: preserve-3d; transform-origin: center center;
      animation: toss-drop 1.35s cubic-bezier(.33,.02,.2,1) both;
      will-change: transform;
    }
    .shake .coin:nth-child(1) .coin-body {
      animation-name: toss-drop-a; animation-duration: 1.32s; animation-delay: 0ms;
    }
    .shake .coin:nth-child(2) .coin-body {
      animation-name: toss-drop-b; animation-duration: 1.4s; animation-delay: 55ms;
    }
    .shake .coin:nth-child(3) .coin-body {
      animation-name: toss-drop-c; animation-duration: 1.48s; animation-delay: 110ms;
    }
    .shake .coin-shadow {
      animation: toss-shadow 1.35s cubic-bezier(.33,.02,.2,1) both;
      will-change: transform, opacity;
    }
    .shake .coin:nth-child(1) .coin-shadow {
      animation-name: toss-shadow-a; animation-duration: 1.32s; animation-delay: 0ms;
    }
    .shake .coin:nth-child(2) .coin-shadow {
      animation-name: toss-shadow-b; animation-duration: 1.4s; animation-delay: 55ms;
    }
    .shake .coin:nth-child(3) .coin-shadow {
      animation-name: toss-shadow-c; animation-duration: 1.48s; animation-delay: 110ms;
    }
    @keyframes toss-drop-a {
      0% { transform: translate3d(-4px, -20px, 0) rotateX(12deg) rotateY(0deg) rotateZ(-28deg) scale(.94); }
      12% { transform: translate3d(-10px, -112px, 0) rotateX(-8deg) rotateY(110deg) rotateZ(-12deg) scale(.9); }
      36% { transform: translate3d(-12px, 2px, 0) rotateX(6deg) rotateY(290deg) rotateZ(16deg) scale(1.04); }
      48% { transform: translate3d(-8px, -38px, 0) rotateX(-4deg) rotateY(400deg) rotateZ(-10deg) scale(.97); }
      62% { transform: translate3d(-5px, 1px, 0) rotateX(3deg) rotateY(500deg) rotateZ(8deg) scale(1.02); }
      74% { transform: translate3d(-3px, -15px, 0) rotateX(-2deg) rotateY(580deg) rotateZ(-4deg) scale(.99); }
      86% { transform: translate3d(-1px, 1px, 0) rotateX(1deg) rotateY(660deg) rotateZ(2deg) scale(1.005); }
      100% { transform: translate3d(0, 0, 0) rotateX(0) rotateY(720deg) rotateZ(0) scale(1); }
    }
    @keyframes toss-drop-b {
      0% { transform: translate3d(0, -14px, 0) rotateX(8deg) rotateY(20deg) rotateZ(10deg) scale(.95); }
      10% { transform: translate3d(2px, -122px, 0) rotateX(-12deg) rotateY(160deg) rotateZ(4deg) scale(.88); }
      34% { transform: translate3d(3px, 3px, 0) rotateX(8deg) rotateY(340deg) rotateZ(-14deg) scale(1.05); }
      46% { transform: translate3d(1px, -44px, 0) rotateX(-6deg) rotateY(450deg) rotateZ(10deg) scale(.96); }
      60% { transform: translate3d(1px, 2px, 0) rotateX(4deg) rotateY(540deg) rotateZ(-6deg) scale(1.02); }
      72% { transform: translate3d(0, -17px, 0) rotateX(-2deg) rotateY(610deg) rotateZ(4deg) scale(.99); }
      85% { transform: translate3d(0, 1px, 0) rotateX(1deg) rotateY(680deg) rotateZ(-1deg) scale(1.005); }
      100% { transform: translate3d(0, 0, 0) rotateX(0) rotateY(720deg) rotateZ(0) scale(1); }
    }
    @keyframes toss-drop-c {
      0% { transform: translate3d(5px, -18px, 0) rotateX(10deg) rotateY(-15deg) rotateZ(24deg) scale(.93); }
      13% { transform: translate3d(12px, -106px, 0) rotateX(-6deg) rotateY(-130deg) rotateZ(8deg) scale(.9); }
      38% { transform: translate3d(14px, 2px, 0) rotateX(5deg) rotateY(-300deg) rotateZ(-18deg) scale(1.04); }
      50% { transform: translate3d(9px, -35px, 0) rotateX(-3deg) rotateY(-410deg) rotateZ(12deg) scale(.97); }
      64% { transform: translate3d(5px, 1px, 0) rotateX(2deg) rotateY(-510deg) rotateZ(-7deg) scale(1.02); }
      76% { transform: translate3d(3px, -13px, 0) rotateX(-1deg) rotateY(-590deg) rotateZ(3deg) scale(.99); }
      88% { transform: translate3d(1px, 1px, 0) rotateX(1deg) rotateY(-670deg) rotateZ(-1deg) scale(1.005); }
      100% { transform: translate3d(0, 0, 0) rotateX(0) rotateY(-720deg) rotateZ(0) scale(1); }
    }
    @keyframes toss-shadow-a {
      0% { transform: translateX(-2px) scaleX(.55); opacity: .12; }
      12% { transform: translateX(-5px) scaleX(.28); opacity: .05; }
      36% { transform: translateX(-6px) scaleX(1.18); opacity: .42; }
      48% { transform: translateX(-4px) scaleX(.48); opacity: .12; }
      62% { transform: translateX(-3px) scaleX(1.1); opacity: .36; }
      74% { transform: translateX(-2px) scaleX(.62); opacity: .16; }
      86% { transform: translateX(-1px) scaleX(1.04); opacity: .3; }
      100% { transform: translateX(0) scaleX(1); opacity: .28; }
    }
    @keyframes toss-shadow-b {
      0% { transform: scaleX(.55); opacity: .12; }
      10% { transform: scaleX(.24); opacity: .04; }
      34% { transform: scaleX(1.22); opacity: .44; }
      46% { transform: scaleX(.42); opacity: .1; }
      60% { transform: scaleX(1.12); opacity: .38; }
      72% { transform: scaleX(.58); opacity: .14; }
      85% { transform: scaleX(1.05); opacity: .3; }
      100% { transform: scaleX(1); opacity: .28; }
    }
    @keyframes toss-shadow-c {
      0% { transform: translateX(2px) scaleX(.55); opacity: .12; }
      13% { transform: translateX(6px) scaleX(.28); opacity: .05; }
      38% { transform: translateX(7px) scaleX(1.18); opacity: .42; }
      50% { transform: translateX(5px) scaleX(.48); opacity: .12; }
      64% { transform: translateX(3px) scaleX(1.1); opacity: .36; }
      76% { transform: translateX(2px) scaleX(.64); opacity: .16; }
      88% { transform: translateX(1px) scaleX(1.04); opacity: .3; }
      100% { transform: translateX(0) scaleX(1); opacity: .28; }
    }
    @keyframes toss-drop {
      0% { transform: translate3d(0, -20px, 0) rotateY(0) scale(.94); }
      100% { transform: translate3d(0, 0, 0) rotateY(720deg) scale(1); }
    }
    @keyframes toss-shadow {
      0% { transform: scaleX(.4); opacity: .1; }
      100% { transform: scaleX(1); opacity: .28; }

    .coin {

function normalizeArticle(article) {
  if (!article) return null
  if (article.blocks && article.blocks.length) return article
  const blocks = (article.content || []).map((text) => p(text))
  return Object.assign({}, article, { blocks, cover: article.cover || 'taiji' })
}

function getArticle(id) {
  const raw = ARTICLES.find((item) => item.id === id) || null
  const article = normalizeArticle(raw)
  if (!article) return null
  const meta = CATEGORY_META[article.category] || {}
  return Object.assign({}, article, {
    categoryLabel: meta.vol ? `${meta.vol} · ${article.category}` : article.category
  })
}

function volumeAnchorId(category) {
  const idx = CATEGORY_ORDER.indexOf(category)
  return idx >= 0 ? `learn-vol-${idx + 1}` : `learn-vol-${category}`
}

function groupByCategory() {
  const map = {}
  ARTICLES.forEach((item) => {
    if (!map[item.category]) map[item.category] = []
    map[item.category].push(normalizeArticle(item))
  })
  const keys = CATEGORY_ORDER.filter((c) => map[c]).concat(
    Object.keys(map).filter((c) => !CATEGORY_ORDER.includes(c))
  )
  return keys.map((category) => {
    const meta = CATEGORY_META[category] || {}
    return {
      category,
      vol: meta.vol || '',
      subtitle: meta.subtitle || '',
      label: meta.vol ? `${meta.vol} · ${category}` : category,
      anchorId: volumeAnchorId(category),
      items: map[category]
    }
  })
}

    for (let j = 0; j < palace.gua.length; j += 1) {
      if (linesKey(palace.gua[j]) === key) {
        return {
          palaceKey: pk,
          palaceName: palace.name,
          palaceWuxing: palace.wuxing,
          index: j,
          shiPos: SHI_POS[j],
          yingPos: (SHI_POS[j] + 3) % 6
        }
      }
    }
  }
  const upper = linesToTrigramKey(lines.slice(3, 6))
  const palace = PALACES[upper]
  return {
    palaceKey: upper,
    palaceName: palace.name,
    palaceWuxing: palace.wuxing,
    index: 0,
    shiPos: 5,
    yingPos: 2
  }
}

function liuqinOf(palaceWuxing, yaoWuxing) {
  if (yaoWuxing === palaceWuxing) return '兄弟'
  if (WUXING_SHENG[yaoWuxing] === palaceWuxing) return '父母'
  if (WUXING_SHENG[palaceWuxing] === yaoWuxing) return '子孙'
  if (WUXING_KE[palaceWuxing] === yaoWuxing) return '妻财'
  if (WUXING_KE[yaoWuxing] === palaceWuxing) return '官鬼'
  return '未知'
}

function buildLiushen(dayGan) {
  const start = DAY_GAN_LIUSHEN_START[dayGan] || 0
  return YAO_NAMES.map((_, idx) => LIUSHEN[(start + idx) % 6])
}

function najiaAt(trigramKey, idx) {
  return (NAJIA[trigramKey] || NAJIA.qian)[idx]
}

function buildYaoList(lines, changingFlags, palace, calendar) {
  const lowerKey = linesToTrigramKey(lines.slice(0, 3))
  const upperKey = linesToTrigramKey(lines.slice(3, 6))
  const liushen = buildLiushen(calendar.day.gan)
  const monthZhi = calendar.month.zhi

  return lines.map((yinYang, idx) => {
    const nj = idx < 3 ? najiaAt(lowerKey, idx) : najiaAt(upperKey, idx)
    const changing = !!(changingFlags && changingFlags[idx])
    const zhi = nj.zhi
    const kong = isKongWang(zhi, calendar.kongwang)
    const wangshuai = wangshuaiOf(nj.wuxing, monthZhi)
    const dm = dayMonthFlags({ zhi }, calendar)
    const liushenName = liushen[idx]
    return {
      index: idx,
      name: `${YAO_NAMES[idx]}${yinYang ? '九' : '六'}`,
      shortName: YAO_NAMES[idx],
      yinYang,
      symbol: yinYang ? '━━━━━' : '━━　━━',
      mark: changing ? (yinYang ? '○' : '×') : '',
      changing,
      gan: nj.gan,
      zhi,
      ganZhi: `${nj.gan}${nj.zhi}`,
      wuxing: nj.wuxing,
      liuqin: liuqinOf(palace.palaceWuxing, nj.wuxing),
      liushen: liushenName,
      liushenMeaning: LIUSHEN_MEANING[liushenName] || '',
      role: idx === palace.shiPos ? '世' : idx === palace.yingPos ? '应' : '',
      kong,
      wangshuai,
      dayMonth: dm,
      tags: [kong ? '空' : '', wangshuai, ...dm.tags].filter(Boolean),
      tagText: [kong ? '空' : '', wangshuai, ...dm.tags].filter(Boolean).join('')
    }
  })
}

function buildGuaDetail(lines, changingFlags, calendar, palaceHint) {
  const info = getGuaName(lines)
  const palace = palaceHint || findPalace(lines)
  const lowerKey = linesToTrigramKey(lines.slice(0, 3))
  const upperKey = linesToTrigramKey(lines.slice(3, 6))
  const yaosBottomUp = buildYaoList(lines, changingFlags, palace, calendar)

  return {
    lines,
    name: info.name,
    alias: info.alias,
    lower: TRIGRAMS[lowerKey],
    upper: TRIGRAMS[upperKey],
    palaceKey: palace.palaceKey,
    palaceName: palace.palaceName,
    palaceWuxing: palace.palaceWuxing,
    palaceIndex: palace.index,
    shiPos: palace.shiPos,
    yingPos: palace.yingPos,
    yaos: yaosBottomUp.slice().reverse(),
    yaosBottomUp
  }
}

/** 本宫八纯卦六爻（下到上），用于伏神 */
function buildPalacePureYaos(palaceKey, palaceWuxing) {
  const pureLines = PALACES[palaceKey].gua[0]
  const trigramKey = palaceKey
  return pureLines.map((yinYang, idx) => {
    const nj = najiaAt(trigramKey, idx)
    return {
      index: idx,
      name: `${YAO_NAMES[idx]}${yinYang ? '九' : '六'}`,
      yinYang,
      ganZhi: `${nj.gan}${nj.zhi}`,
      zhi: nj.zhi,
      wuxing: nj.wuxing,
      liuqin: liuqinOf(palaceWuxing, nj.wuxing)
    }
  })
}

/**
 * 伏神：用神未现时，取本宫纯卦中该六亲，伏于本卦同位飞神之下
 */
function findFushen(ben, liuqinName, calendar) {
  if (!liuqinName || liuqinName === '世爻') return null
  const present = ben.yaosBottomUp.some((y) => y.liuqin === liuqinName)
  if (present) return null
  const pure = buildPalacePureYaos(ben.palaceKey, ben.palaceWuxing)
  const fu = pure.find((y) => y.liuqin === liuqinName)
  if (!fu) return null
  const fei = ben.yaosBottomUp[fu.index]
  return {
    liuqin: fu.liuqin,
    ganZhi: fu.ganZhi,
    wuxing: fu.wuxing,
    posName: fu.name,
    index: fu.index,
    feishen: {
      liuqin: fei.liuqin,
      ganZhi: fei.ganZhi,
      wuxing: fei.wuxing,
      name: fei.name,
      role: fei.role
    },
    kong: isKongWang(fu.zhi, calendar.kongwang),
    wangshuai: wangshuaiOf(fu.wuxing, calendar.month.zhi),
    text: `${fu.liuqin}${fu.ganZhi}${fu.wuxing}伏于${fei.name}${fei.liuqin}${fei.ganZhi}下`
  }
}

function attachChangeInfo(ben, bian) {
  if (!bian) return
  const bianMap = {}
  bian.yaosBottomUp.forEach((y) => {
    bianMap[y.index] = y
  })
  ben.yaosBottomUp.forEach((y) => {
    if (!y.changing) return
    const to = bianMap[y.index]
    if (!to) return
    const analysis = analyzeChange(y, to)
    y.changeTo = {
      ganZhi: to.ganZhi,
      zhi: to.zhi,
      wuxing: to.wuxing,
      liuqin: to.liuqin,
      name: to.name,
      wangshuai: to.wangshuai,
      kong: to.kong,
      analysis,
      jinTui: analysis && analysis.jinTui,
      text: analysis ? analysis.text : `化${to.liuqin}${to.ganZhi}${to.wuxing}`
    }
  })
  ben.yaos.forEach((y) => {
    const src = ben.yaosBottomUp[y.index]
    y.changeTo = src.changeTo
  })
}

/** 变爻六亲按本宫五行论（纳甲随变卦，世应仍用变卦宫位） */
function applyBenPalaceLiuqin(bian, palaceWuxing) {
  if (!bian || !palaceWuxing) return
  const fix = (y) => {
    y.liuqin = liuqinOf(palaceWuxing, y.wuxing)
  }
  bian.yaosBottomUp.forEach(fix)
  bian.yaos.forEach(fix)
}

function buildRelations(ben) {
  const yaos = ben.yaosBottomUp
  const moving = yaos.filter((y) => y.changing)
  const links = []
  for (let i = 0; i < moving.length; i += 1) {
    for (let j = 0; j < yaos.length; j += 1) {
      const a = moving[i]
      const b = yaos[j]
      if (a.index === b.index) continue
      if (isChong(a.zhi, b.zhi)) links.push({ type: '冲', from: a, to: b, text: `${a.name}冲${b.name}` })
      if (isHe(a.zhi, b.zhi)) links.push({ type: '合', from: a, to: b, text: `${a.name}合${b.name}` })
      const rel = relationWuxing(a.wuxing, b.wuxing)
      if (rel === '生' || rel === '克') {
        links.push({ type: rel, from: a, to: b, text: `动${a.name}${rel}${b.name}${b.liuqin}` })
      }
    }
  }
  const sanhe = findSanHe(yaos.map((y) => y.zhi))
  const dayLinks = yaos
    .map((y) => {
      const tags = (y.dayMonth && y.dayMonth.tags) || []
      if (!tags.length) return null
      return { yao: y, tags, text: `${y.name}${y.ganZhi}${tags.join('、')}` }
    })
    .filter(Boolean)
  return { links, sanhe, dayLinks }
}

function yaosToLines(yaos) {
  return yaos.map((y) => y.yinYang)
}

function buildChangedLines(yaos) {
  return yaos.map((y) => (y.changing ? 1 - y.yinYang : y.yinYang))
}

const PALACE_STAGE = ['本宫', '一世', '二世', '三世', '四世', '五世', '游魂', '归魂']

const LIUQIN_PLAIN = {
  父母: '多主长辈、文书、房屋、庇护',
  兄弟: '多主同辈、竞争、分利耗财',
  子孙: '多主晚辈、医药、解忧，也能生财',
  妻财: '多主钱财、所求之物；男测亦常指对方',
  官鬼: '多主官职、压力、病症；女测亦常指夫星'
}

const WANG_PLAIN = {
  旺: '力气很足',
  相: '力气较足',
  休: '力气一般',
  囚: '力气偏弱',
  死: '力气很弱'
}

const STAGE_PLAIN = {
  本宫: '本宫起始，事体较「正」、根基在本宫',
  一世: '一世卦，变化刚起头',
  二世: '二世卦，变化推进一层',
  三世: '三世卦，变化到中段',
  四世: '四世卦，变化偏深',
  五世: '五世卦，接近转折',
  游魂: '游魂卦，常主游离、未定、心神外驰',
  归魂: '归魂卦，常主回归、收束、回到本宫气'
}

/**
 * 针对本卦例，生成排盘说明（专业说法并附说明；教学用）
 */
function buildPaipanGuide(cast) {
  if (!cast || !cast.ben) return []
  const { ben, bian, calendar, changingIndexes, fushenMap } = cast
  const sections = []
  const ci = getGuaCi(ben.alias)
  const shi = ben.yaosBottomUp.find((y) => y.role === '世')
  const ying = ben.yaosBottomUp.find((y) => y.role === '应')
  const movers = ben.yaosBottomUp.filter((y) => y.changing)
  const stage = PALACE_STAGE[ben.palaceIndex] || '本宫'

  // 0. 先看懂
  const lead = []
  lead.push(
    `先说这张盘：本卦是「${ben.name}」${ben.alias && ben.alias !== ben.name ? `（也叫「${ben.alias}」）` : ''}，下面「${ben.lower.symbol}${ben.lower.name}」、上面「${ben.upper.symbol}${ben.upper.name}」。`
  )
  lead.push(
    '下面三爻叫内卦（多主内里、自己这边），上面三爻叫外卦（多主外面、对方或环境）。两卦叠在一起，才是完整的六爻卦。'
  )
  if (movers.length) {
    lead.push(
      `这一卦有动爻：${movers.map((y) => `${y.name}${y.mark}`).join('、')}。动爻会阴阳对换，变出变卦「${bian ? bian.name : '—'}」。`
    )
    lead.push('本卦看眼下起点，变卦看往后怎么走；动爻是变化的关键，宜优先看。')
  } else {
    lead.push('这一卦六爻都没发动，没有另立变卦。')
    lead.push('局面相对稳，变化慢；重点看世应、用神和日月力量。')
  }
  if (shi) lead.push(`世爻在${shi.name}，代表你自己；应爻在${ying ? ying.name : '—'}，多代表对方或事体。`)
  lead.push('下面按「象辞 → 动变 → 世应纳甲 → 历日六神」分步说明；术语旁会附简短说明。')
  sections.push({ title: '先看懂这张盘', items: lead })

  // 1. 卦象与卦名
  const xiangItems = []
  xiangItems.push(
    `内卦「${ben.lower.symbol}${ben.lower.name}」：象${ben.lower.nature}，五行${ben.lower.wuxing}；外卦「${ben.upper.symbol}${ben.upper.name}」：象${ben.upper.nature}，五行${ben.upper.wuxing}。叠成「${ben.name}」。`
  )
  if (ci && ci.nameWhy) {
    xiangItems.push(ci.nameWhy)
  } else {
    xiangItems.push(
      `外${ben.upper.nature}、内${ben.lower.nature}相重，传统就用这个象来称呼本卦，再连到卦德与人事。`
    )
  }
  xiangItems.push(
    '先弄清「象」再读辞。象像一幅画——画没看清，后面的卦辞、爻辞和六亲就没有着落；别只看卦名两个字就断吉凶。'
  )
  sections.push({ title: '卦象与卦名', items: xiangItems })

  // 2. 卦辞
  if (ci && ci.guaci) {
    sections.push({
      title: '卦辞',
      items: [
        `《${ben.alias || ben.name}》卦辞：${ci.guaci}`,
        '卦辞是整卦的总提示，像开场白。占事时要和动爻、用神一起看，别单独摘一句当结论。'
      ]
    })
  }

  // 3. 爻辞
  if (ci && ci.yaoci && ci.yaoci.length) {
    const yaoItems = []
    if (movers.length) {
      yaoItems.push('六爻各有爻辞。动爻是变化关键，宜先读标了【动】的；静爻用来看全局时位。')
      yaoItems.push('【动】=这一爻正在变，最要紧；世=你，应=对方/事体。')
    } else {
      yaoItems.push('本卦六爻俱静，可通读六爻爻辞，看各阶段的进退；断事仍重世应、用神与日月。')
      yaoItems.push('没有动爻时，爻辞帮你理解「处在哪一步」；具体吉凶还要回到盘面数术。')
    }
    ben.yaosBottomUp.forEach((y, i) => {
      const line = ci.yaoci[i] || ''
      if (!line) return
      const tag = y.changing ? '【动】' : ''
      let role = ''
      if (y.role === '世') role = '（世·你）'
      else if (y.role === '应') role = '（应·对方/事体）'
      yaoItems.push(`${tag}${line}${role}`)
    })
    sections.push({ title: '爻辞', items: yaoItems })
  }

  // 4. 动爻与变卦
  const moveItems = []
  if (!movers.length) {
    moveItems.push('无老阳、老阴，六爻俱静，不另立变卦。')
    moveItems.push('辞象以本卦卦爻辞为主；力量与趋向则看世应、用神旺衰、日月生克。')
  } else {
    moveItems.push(
      `发动之爻：${movers.map((y) => `${y.name}${y.mark}`).join('、')}。动爻阴阳对换，得到变卦。`
    )
    moveItems.push('通例是「本卦看开始，变卦看结局与走向」。')
    if (bian) {
      moveItems.push(
        `变卦为「${bian.name}」：内${bian.lower.symbol}${bian.lower.name}（${bian.lower.nature}），外${bian.upper.symbol}${bian.upper.name}（${bian.upper.nature}）。`
      )
      const bianCi = getGuaCi(bian.alias)
      if (bianCi && bianCi.nameWhy) moveItems.push(`变卦取象：${bianCi.nameWhy}`)
      if (bianCi && bianCi.guaci) {
        moveItems.push(`变卦《${bian.alias || bian.name}》卦辞：${bianCi.guaci}`)
        moveItems.push('变卦卦辞提示「往后可能变成什么样」，宜与本卦对照读。')
      }
      movers.forEach((y) => {
        if (y.changeTo) {
          moveItems.push(`${y.name}动而化出：${y.changeTo.text}。`)
          const a = y.changeTo.analysis
          if (a && a.huiTou) {
            if (a.huiTou.type === '回头生') moveItems.push('变爻回头来生它，像自己给自己加油，偏顺。')
            if (a.huiTou.type === '回头克') moveItems.push('变爻回头来克它，像自己给自己添堵，偏滞。')
          }
          if (a && a.jinTui) {
            if (a.jinTui.type === '化进神') moveItems.push('化进神，事有向前推进的意思。')
            if (a.jinTui.type === '化退神') moveItems.push('化退神，事有回缩、放缓的意思。')
          }
        }
      })
    }
  }
  sections.push({ title: '动爻与变卦', items: moveItems })

  // 5. 八宫与世应
  const palaceItems = []
  palaceItems.push(
    `本卦「${ben.name}」属「${ben.palaceName}宫」（五行${ben.palaceWuxing}），宫次「${stage}」。${STAGE_PLAIN[stage] || ''}`
  )
  palaceItems.push(
    '八宫像八个「家族」，六十四卦各归一家。宫次告诉你这卦在本宫演变链条里走到哪一步；世爻随宫次移动，应爻与世爻隔两位。'
  )
  if (shi) {
    const wang = shi.wangshuai ? WANG_PLAIN[shi.wangshuai] || shi.wangshuai : ''
    palaceItems.push(
      `世爻（你）在${shi.name}：临${shi.liuqin}${shi.ganZhi}${shi.wuxing}${shi.kong ? '，逢空' : ''}${wang ? '，月令' + wang : ''}。`
    )
    palaceItems.push(
      `世爻=你自己。${LIUQIN_PLAIN[shi.liuqin] || ''}${shi.kong ? '；空亡表示眼下还不踏实。' : '。'}`
    )
  }
  if (ying) {
    const wang = ying.wangshuai ? WANG_PLAIN[ying.wangshuai] || ying.wangshuai : ''
    palaceItems.push(
      `应爻（对方/事体）在${ying.name}：临${ying.liuqin}${ying.ganZhi}${ying.wuxing}${ying.kong ? '，逢空' : ''}${wang ? '，月令' + wang : ''}。`
    )
    palaceItems.push(
      `应爻多指对方、环境或你问的那件事本身。${LIUQIN_PLAIN[ying.liuqin] || ''}`
    )
  }
  sections.push({ title: '八宫与世应', items: palaceItems })

  // 6. 纳甲与六亲
  const najiaItems = []
  najiaItems.push(
    `纳甲：内卦「${ben.lower.name}」装初、二、三爻，外卦「${ben.upper.name}」装四、五、上爻；以本宫五行「${ben.palaceWuxing}」为「我」，再定六亲。`
  )
  najiaItems.push(
    '纳甲=给每一爻配上天干地支。六亲=这爻相对「我」是什么角色（父母、兄弟、子孙、妻财、官鬼）。'
  )
  ben.yaosBottomUp.forEach((y) => {
    const role =
      y.role === '世' ? '（世·你）' : y.role === '应' ? '（应·对方/事体）' : ''
    const tags = y.tags && y.tags.length ? `；${y.tags.join('、')}` : ''
    const wang = y.wangshuai ? `，${WANG_PLAIN[y.wangshuai] || y.wangshuai}` : ''
    najiaItems.push(
      `${y.name}：${y.ganZhi}${y.wuxing}，六亲「${y.liuqin}」${role}${y.kong ? '，空' : ''}${wang}${tags}。`
    )
    najiaItems.push(`→ ${LIUQIN_PLAIN[y.liuqin] || '六亲角色见上'}。`)
  })
  sections.push({ title: '纳甲与六亲', items: najiaItems })

  // 7. 六神与历日
  const calItems = []
  if (calendar) {
    calItems.push(
      `历日：${calendar.year.text}年、${calendar.month.text}月、${calendar.day.text}日；旬空「${calendar.kongwang.text}」。`
    )
    if (calendar.calendarNote) calItems.push(`历法提示：${calendar.calendarNote}。`)
    calItems.push(
      '旬空=这旬里「落空」的两个地支，临空的爻常主虚而不实，要等冲实或出旬才踏实。'
    )
    calItems.push(
      `六神（从日干「${calendar.day.gan}」起）：${ben.yaosBottomUp.map((y) => `${y.shortName}${y.liushen}`).join('、')}。`
    )
    calItems.push(
      '六神是象意标签（如朱雀多主文书口舌，玄武多主隐匿），要和用神、动爻一起看，不能单独定吉凶。'
    )
    calItems.push(
      '月令定旺衰（力气大小）；爻旁若标「临日/临月」「冲/合」，用来权衡力量与大概何时有动静。'
    )
  } else {
    calItems.push('六神依日干而起；月令定旺衰，旬空看虚实。详见盘面标示。')
  }
  sections.push({ title: '六神与历日', items: calItems })

  // 8. 伏神
  const fuKeys = fushenMap ? Object.keys(fushenMap) : []
  if (fuKeys.length) {
    const fuItems = [
      `有的六亲没直接出现在盘上，就从本宫「${ben.palaceName}」纯卦里取出，伏在同位「飞神」下面，叫伏神。`,
      '伏神=目标或角色还藏着、没上台面；飞神=盖在它上面的那一爻。等飞神被冲开，或岁月引出伏神，事情更容易露出来。'
    ]
    fuKeys.forEach((k) => {

  return (zhi && ZHI_SHICHEN[zhi]) || null
}

function shichenOfDong(dongYao) {
  const n = Number(dongYao)
  return DONG_PERIOD[n] || null
}

function formatShichenHint(info) {
  if (!info) return ''
  if (info.label && info.clock && info.period) {
    return `${info.period}（${info.label || ''} ${info.clock}）`.replace(/\s+/g, ' ').trim()
  }
  if (info.period && info.clock) return `${info.period}（${info.clock}）`
  return info.period || info.clock || ''
}

/**
 * @param {string} question
 * @param {{label?: string}|null} topic
 */
function parseQuestion(question, topic) {
  const raw = String(question || '').trim()
  const fallback = topic && topic.label ? topic.label : '此事'
  if (!raw) {
    return {
      raw: '',
      focus: fallback,
      event: fallback,
      mode: 'outlook',
      whenKind: '',
      yesKind: '',
      answerShape: 'outlook',
      domain: 'general',
      domainLabel: '综合事务',
      topicHint: 'general',
      modes: ['outlook'],
      timeHint: '',
      shortAsk: fallback,
      modeLabel: '走势',
      choice: null,
      negativeEvent: false
    }
  }

  let timeHint = ''
  const timeM = raw.match(new RegExp(TIME_WORDS))
  if (timeM) timeHint = timeM[0]

  const domainInfo = detectDomain(raw)

  // —— 1) 侦测可能的问法（可多选）——
  const modes = []
  let whenKind = ''

  // 时刻：比「哪天」更具体，必须单独识别
  if (/几点钟|几点|几时|哪个时辰|什么时辰|哪个点|什么点|上午还是下午|早上还是晚上|白天还是晚上/.test(raw)) {
    modes.push('when')
    whenKind = 'clock'
  } else if (/哪天|几号|哪月|哪年|几月|几年|几日/.test(raw)) {
    modes.push('when')
    whenKind = 'day'
  } else if (/多久|多长时间|要等多久|等到什么时候/.test(raw)) {
    modes.push('when')
    whenKind = 'span'
  } else if (/什么时候|何时|应期|何时能|什么时候能|什么时候适合|何时可以/.test(raw)) {
    modes.push('when')
    whenKind = 'day'
  }

  if (/哪里|哪儿|何处|何方|什么地方|哪个方向|什么方向|方位|落在哪|丢在哪|人在哪|在哪个|去哪个/.test(raw)
    || /东南|西北|东北|西南/.test(raw)
    || /在哪儿|在哪里|去哪儿|去哪里|往哪儿|往哪里/.test(raw)) {
    modes.push('where')
  }
  if (isDegreeQuestion(raw)) {
    modes.push('degree')
  }
  if (/吉凶|凶吉|顺逆|安危|利不利|好不好|顺利吗|有利吗|凶险|平安吗|吉还是凶|吉利吗|吉利不|凶不凶|顺不顺|安不安全/.test(raw)) {
    modes.push('jixiong')
  }
  if (/谁|何人|哪个人|什么人|是男是女|对方是谁|找谁|靠谁|问谁/.test(raw)) {
    modes.push('who')
  }
  if (/还是|或者|选哪个|选哪|二选一|A还是B|去还是留|分还是合/.test(raw)) {
    modes.push('choice')
  }
  if (/怎么办|如何是好|怎么处理|怎样应对|如何做|怎么做|对策|破法|怎么破/.test(raw)) {
    modes.push('how')
  }
  const hasYesNo =
    /能不能|可不可以|可否|能否|会不会|是否|成不成|行不行|有没有希望|有没有机会|该不该|要不要|找不找|回不回|过不过|签不签|去不去|离不离|辞不辞|赢不赢|好不好得了|宜不宜|当不当|应不应|找不找得到|找得到吗/.test(raw)
    || /有没有|还有没有|适不适合|适合不适合|合不合适|适合吗|合适吗|可不可能|有没有可能/.test(raw)
    || /(?:^|[^不])能[^否].{0,8}吗/.test(raw)
    || /有人来吗|客人来吗|能到吗|到了吗/.test(raw)
  if (hasYesNo) modes.push('yesno')

  if (/怎么样|如何|走势|前景|结果会|后来怎样|发展如何|结果如何/.test(raw)) {
    modes.push('outlook')
  }
  if (!modes.length) {
    if (/吗$|么$|嘛$/.test(stripTailNoise(raw))) modes.push('yesno')
    else modes.push('outlook')
  }

  // 优先级：方位 > 时刻/应期 > 抉择 > 何人 > 轻重 > 吉凶 > 成否 > 对策 > 走势
  const order = ['where', 'when', 'choice', 'who', 'degree', 'jixiong', 'yesno', 'how', 'outlook']
  let mode = 'outlook'
  for (let i = 0; i < order.length; i++) {
    if (modes.indexOf(order[i]) >= 0) {
      mode = order[i]
      break
    }
  }
  if (mode !== 'when') whenKind = ''

  let yesKind = ''
  if (mode === 'yesno') yesKind = refineYesKind(raw)

  let core = stripTailNoise(raw)
    .replace(/^(请问|想问|想测|测一下|帮我看|麻烦看下|想知道)+/g, '')
    .replace(/(到底|究竟)/g, '')

  let choice = null
  if (mode === 'choice') {
    const mChoice = core.match(/(.+?)(?:还是|或者)(.+)$/)
    if (mChoice) {
      choice = {
        a: cleanFocus(mChoice[1].replace(/^(该|是|要|选)/, '')),
        b: cleanFocus(mChoice[2])
      }
      if (!choice.a || !choice.b) choice = null
    }
  }

  // —— 2) 事件焦点 —— //
  let focus = ''
  if (mode === 'choice' && choice) {
    focus = `${choice.a}还是${choice.b}`
  } else if (mode === 'where') {
    focus = extractEvent(core, 'where')
    focus = focus.replace(/^(我的|我|丢的|丢失的)/, '').replace(/丢$/g, '').trim() || focus
  } else if (mode === 'when') {
    focus = extractEvent(core, 'when', whenKind)
  } else if (mode === 'who') {
    focus = core
      .replace(/该找谁|找谁|靠谁|问谁|何人|是谁|哪个人|什么人/g, '')
      .replace(/比较好|更好|为宜/g, '')
    focus = cleanFocus(focus) || '相关之人'
  } else if (mode === 'how') {
    focus = cleanFocus(core.replace(/怎么办|如何是好|怎么处理|怎样应对|如何做|怎么做|对策|破法|怎么破/g, ''))
  } else if (mode === 'degree') {
    focus = cleanFocus(
      core.replace(/严不严重|轻不轻|重不重|大不大|多不多|强不强|远不远|快不快|高不高|深不深|难不难/g, '')
    )
  } else if (mode === 'jixiong') {
    focus = cleanFocus(
      core
        .replace(/吉凶如何|吉凶怎样|吉凶|凶吉|顺逆|安危/g, '')
        .replace(/吉利吗|吉利不|好不好|顺利吗|有利吗|凶不凶|顺不顺|安不安全/g, '')
    )
  } else if (mode === 'yesno') {
    let m =
      core.match(/^(.*?)(?:还能不能|能不能|可不可以|可否|能否|会不会|是否|该不该|要不要|宜不宜|当不当|应不应|还有没有|有没有|可不可能|有没有可能|适不适合|适合不适合|找不找得到)(.+)$/)
      || core.match(/^(.*?)(?:找不找|回不回|过不过|签不签|去不去|离不离|辞不辞|赢不赢)(.+)$/)
    if (yesKind === 'find') {
      focus = cleanFocus(
        core
          .replace(/找不找得到|找得到吗|还能找到|找得回来吗|寻得回/g, '')
          .replace(/吗$/g, '')
      )
    } else if (m) {
      let left = cleanFocus((m[1] || '').replace(new RegExp(TIME_WORDS, 'g'), ''))
      let right = cleanFocus(m[2] || '')
      left = left.replace(/还$/g, '').trim()
      if (yesKind === 'have' && right) focus = right
      else if (yesKind === 'should' && (left || right)) {
        focus = cleanFocus((left + right).replace(/宜不宜|当不当|应不应|见客/g, (x) => (x === '见客' ? '见客' : '')))
        if (/见客|会客/.test(core)) focus = focus.includes('见') ? focus : (focus ? focus : '见客')
        if (/见客/.test(core) && !/见/.test(focus)) focus = '见客'
      } else if (left && right) {
        if (right.length <= 2 && /^(辞|去|留|签|离|分|合|嫁|娶|搬|换|投|买|卖)$/.test(right)) {
          focus = right + left
        } else {
          focus = left + right
        }
      } else focus = right || left
    } else {
      let body = core.replace(new RegExp(`^(${TIME_WORDS})`), '').replace(/吗$/g, '')
      if (/适合|合适/.test(body)) {
        yesKind = 'suit'
        focus = cleanFocus(body.replace(/适不适合|适合不适合|合不合适|适合|合适|能|会|要|可能/g, ''))
      } else {
        focus = cleanFocus(body.replace(/^(还|再|就)/, '').replace(/能|会|要|可能|宜不宜|当不当/g, ''))
      }
    }
    if (timeHint) {
      const stripped = (focus || '').replace(new RegExp(timeHint, 'g'), '').trim()
      if (stripped) focus = stripped
    }
  } else {
    focus = cleanFocus(core.replace(/怎么样|如何|走势|前景|结果会怎样|后来怎样|发展如何|结果如何/g, ''))
  }

  if (!focus) focus = fallback

  // 来访/送达等：焦点收成事体核心（客人来 → 客人）
  if ((yesKind === 'occur' || domainInfo.domain === 'visit' || domainInfo.domain === 'seek') && focus) {
    focus = focus
      .replace(/(来访|来找|上门|拜访|串门)$/g, '')
      .replace(/来$/g, '')
      .replace(/有人/g, '人')
      .trim() || focus
  }
  if (domainInfo.domain === 'delivery' && focus) {
    focus = focus.replace(/(送到|到货|到达|到)$/g, '').trim() || focus
  }
  const event = focus

  // —— 3) 答复形态（给下游作答合同）——
  let answerShape = mode
  if (mode === 'when') answerShape = whenKind === 'clock' ? 'clock' : whenKind === 'span' ? 'span' : 'day'
  if (mode === 'yesno') answerShape = yesKind || 'can'
  if (mode === 'degree') answerShape = 'degree'

  let modeLabel = MODE_LABEL[mode] || '走势'
  if (mode === 'when' && whenKind && WHEN_KIND_LABEL[whenKind]) {
    modeLabel = WHEN_KIND_LABEL[whenKind]
  }
  if (mode === 'yesno' && yesKind === 'occur') modeLabel = '发生'
  if (mode === 'yesno' && yesKind === 'find') modeLabel = '寻得'

  const shortAsk = timeHint ? `${timeHint}·${focus}` : focus
  const negativeEvent = /第三者|大问题|异常|丢失|口舌|事故|风险|被骗|受伤/.test(raw)

  return {
    raw,
    focus,
    event,
    mode,
    whenKind,
    yesKind,
    answerShape,
    domain: domainInfo.domain,
    domainLabel: domainInfo.domainLabel,
    topicHint: domainInfo.topicHint,
    modes,
    timeHint,
    shortAsk,
    modeLabel,
    choice,
    negativeEvent
  }
}

function invertTone(tone) {
  if (tone === 'good') return 'bad'
  if (tone === 'bad') return 'good'
  return 'mid'
}

function safetyAdvice(parsed) {
  const domain = parsed && parsed.domain
  const focus = String((parsed && parsed.focus) || '')
  if (domain === 'health' || domain === 'pregnancy') {
    return '现实校验：卦象不能诊断病情、判断手术适应证、推断胎儿性别或替代产检；请以医生、检查结果和紧急症状处置为准。'
  }
  if (domain === 'invest' || domain === 'property') {
    return '现实校验：投资和大额买卖须核对现金流、合同、估值与最坏损失，不可仅据卦象下注。'
  }
  if (domain === 'lawsuit') {
    return '现实校验：是否报警、起诉或和解应依据事实证据、时限与专业法律意见；有人身危险时应立即求助或报警。'
  }
  if (domain === 'weather') {
    return '现实校验：天气与出行安全以官方预报、预警和现场交通信息为准。'
  }
  if (domain === 'lost' && /寻人|人/.test(focus)) {
    return '现实校验：人员失联应先联系亲友、核对行程；存在危险或异常失联时应及时报警，不要等待卦象应期。'
  }
  return ''
}

/** 高风险所问不能把传统象意包装成现实结论。 */
function safetyLevel(parsed) {
  const domain = parsed && parsed.domain
  const focus = String((parsed && parsed.focus) || '')
  if (domain === 'health' || domain === 'pregnancy') return '须医学评估'
  if (domain === 'lawsuit') return '须法律评估'
  if (domain === 'invest' || domain === 'property') return '须现实评估'
  if (domain === 'lost' && /寻人|人/.test(focus)) return '须立即查找'
  return ''
}

/** 高风险所问的正文结论：保留象意，但明确不得据此作关键决定。 */
function safetyJudgmentLine(parsed, tone) {
  const guardedLevel = safetyLevel(parsed)
  if (!guardedLevel) return ''
  const focus = String((parsed && parsed.focus) || '此事')
  const symbolic = tone === 'good' ? '偏顺' : tone === 'bad' ? '偏滞' : '未明'
  if (parsed.domain === 'health' || parsed.domain === 'pregnancy') {
    if (parsed.negativeEvent) {
      const risk = tone === 'good' ? '偏有' : tone === 'bad' ? '偏弱' : '未明'
      return `判断：传统问事层面的「${focus}」迹象${risk}；这不是医学结论，须以症状、检查与医生评估为准。`
    }
    return `判断：传统象意对「${focus}」目前${symbolic}；卦象不能诊断、承诺疗效或决定手术和孕产方案。`
  }
  if (parsed.domain === 'lawsuit') {
    return `判断：传统象意对「${focus}」目前${symbolic}；不得据此判断输赢、决定报警起诉或替代法律策略。`
  }
  if (parsed.domain === 'invest' || parsed.domain === 'property') {
    return `判断：传统象意对「${focus}」目前${symbolic}；这不等于实际收益或适合买卖，须完成尽调与风险评估。`
  }
  return `判断：传统象意对「${focus}」目前${symbolic}；人员失联不得等待卦象，应立即按现实线索查找并在必要时报警。`
}

/**
 * 直接答复：形态必须对上所问
 * extra: { place, whenHint, clockHint, choicePick, whoHint }
 */
function directReply(parsed, tone, level, extra) {
  const focus = parsed.focus || '此事'
  const raw = parsed.raw || focus
  const timeHint = parsed.timeHint || ''
  const place = (extra && extra.place) || ''
  const whenHint = (extra && extra.whenHint) || ''
  const clockHint = (extra && extra.clockHint) || whenHint
  const choicePick = (extra && extra.choicePick) || ''
  const whoHint = (extra && extra.whoHint) || ''
  const lv = String(level || '')
  const mild = /偏|勉|虚|待|小|两可|未明/.test(lv)
  const head = `就你问的「${raw}」：`
  const dayRef = timeHint || '近段'
  const outcomeTone = (extra && extra.outcomeTone) || tone
  const symbolic = outcomeTone === 'good' ? '偏顺' : outcomeTone === 'bad' ? '偏滞' : '未明'

  if (parsed.domain === 'health' || parsed.domain === 'pregnancy') {
    if (parsed.mode === 'degree') {
      return `${head}卦象不能判断医学上的轻重；传统象意目前${symbolic}，请以症状、检查和医生评估为准。`
    }
    if (/手术/.test(focus)) {
      return `${head}卦象不能决定是否手术；传统象意目前${symbolic}，适应证、风险和替代方案须由医生评估。`
    }
    if (/体检|异常/.test(focus)) {
      const risk = tone === 'good' ? '偏有' : tone === 'bad' ? '偏弱' : '未明'
      return `${head}传统问事层面的异常迹象${risk}，但卦象不能判断体检是否有问题；结论须看正式报告和医生解释。`
    }
    if (parsed.mode === 'when' || parsed.mode === 'yesno' || parsed.mode === 'jixiong') {
      return `${head}传统象意目前${symbolic}，但不能据此承诺康复、怀孕或生产结果；请以医疗评估和随访为准。`
    }
  }

  if (parsed.domain === 'lawsuit' && /报警|起诉/.test(focus) && parsed.mode === 'yesno') {
    return `${head}传统象意目前${symbolic}，但不能据卦决定是否报警或起诉；请按人身安全、证据、法定时限和律师意见处理。`
  }
  if (parsed.domain === 'lawsuit' && ['yesno', 'jixiong', 'how'].includes(parsed.mode)) {
    return `${head}传统象意目前${symbolic}，但不能据此判断诉讼输赢或替代法律策略；关键仍是证据、程序、时限和专业意见。`
  }
  if ((parsed.domain === 'invest' || parsed.domain === 'property') && ['yesno', 'jixiong', 'when', 'how'].includes(parsed.mode)) {
    return `${head}传统象意目前${symbolic}，不代表实际收益或适合交易；请先核对现金流、合同、估值和最坏损失。`
  }
  if (parsed.domain === 'lost' && /寻人|人/.test(focus)) {
    return `${head}传统象意目前${symbolic}，但人员失联不能等待卦象应期；请立即核对行程，异常或危险情形及时报警。`
  }

  if (parsed.mode === 'where') {
    if (place) {
      if (tone === 'bad') return `${head}「${focus}」多半偏「${place}」一带，但阻隔较大，未必顺利。`
      if (tone === 'mid' || mild) return `${head}「${focus}」先往「${place}」一侧看，同时保留邻近方位作备选。`
      return `${head}「${focus}」重点看「${place}」一带。`
    }
    return `${head}「${focus}」方位信号偏弱，宜结合现场再核。`
  }

  // —— 时刻：必须答「几点/哪段时间」——
  if (parsed.mode === 'when' && parsed.whenKind === 'clock') {
    if (tone === 'bad') {
      return clockHint
        ? `${head}${dayRef}「${focus}」整体象偏弱，未必明显发生；若发生，相对更可留意${clockHint}。此为卦象时辰示意，非气象预报。`
        : `${head}${dayRef}「${focus}」整体象偏弱，时刻信号不清，不宜钉死某一点钟。`
    }
    if (tone === 'mid' || mild) {
      return clockHint
        ? `${head}${dayRef}「${focus}」若发生，较可留意${clockHint}；前后两三个时辰也留观察。此为卦象时辰示意，非气象预报。`
        : `${head}${dayRef}「${focus}」时刻未明朗，宜整日留意，勿只盯一个点。`
    }
    return clockHint
      ? `${head}${dayRef}「${focus}」更可能落在${clockHint}。此为卦象时辰示意，非气象预报。`
      : `${head}${dayRef}「${focus}」有时刻信号但不够清，宜按上午/下午分段观察。`
  }

  if (parsed.mode === 'when') {
    const win = whenHint ? `——${whenHint}` : ''
    if (tone === 'good') return `${head}「${focus}」的时机偏近${win}，可盯窗口推进。`
    if (tone === 'bad') return `${head}「${focus}」的时机偏迟或反复，近段不宜死等一个结果。`
    return `${head}「${focus}」的时机尚未明朗${win}，先筹备、待信号清楚再定。`
  }

  if (parsed.mode === 'jixiong') {
    const about = timeHint ? `${timeHint}办「${focus}」` : `「${focus}」`
    if (tone === 'good') return mild ? `${head}${about}小吉，有利但有波折。` : `${head}${about}偏吉，整体顺。`
    if (tone === 'bad') return mild ? `${head}${about}小凶，不太顺，宜缓。` : `${head}${about}偏凶，阻力大，宜避或改期。`
    return `${head}${about}吉凶未分，宜再观，勿一次押死。`
  }

  if (parsed.mode === 'who') {
    if (whoHint) {
      if (tone === 'good') return `${head}关键更像「${whoHint}」，宜主动对接。`
      if (tone === 'bad') return `${head}象在「${whoHint}」，但阻隔偏大，宜谨慎或另寻。`
      return `${head}可先参「${whoHint}」，人物尚未十分明朗。`
    }
    if (tone === 'good') return `${head}相关之人偏有助力，宜主动联络。`
    if (tone === 'bad') return `${head}相关之人多阻隔，不宜深交或一次押死。`
    return `${head}人物象未明朗，宜再观外应。`
  }

  if (parsed.mode === 'choice') {
    if (parsed.choice && choicePick) {

function flattenOptions() {
  const list = []
  ASK_GROUPS.forEach((g) => {
    g.options.forEach((o) => {
      list.push(Object.assign({ groupKey: g.key, groupLabel: g.label }, o))
    })
  })
  return list
}

const OPTION_MAP = {}
flattenOptions().forEach((o) => {
  OPTION_MAP[o.id] = o
})

function getOption(id) {
  return OPTION_MAP[id] || null
}

function listGroups() {
  return ASK_GROUPS.map((g) => ({
    key: g.key,
    label: g.label,
    tip: g.tip || '',
    options: g.options.map((o) => ({
      id: o.id,
      label: o.label,
      topicKey: o.topicKey,
      wide: o.label.length > 10
    }))
  }))
}

/**
 * 组装所问文案 + askMeta
 * @param {string} optionId
 * @param {string} [timeKey] 今天/明天/…
 */
function buildAskSelection(optionId, timeKey) {
  const opt = getOption(optionId)
  if (!opt) return null
  const timeHint = TIME_SCOPES.some((t) => t.key === timeKey) ? (timeKey || '') : ''

    }
  }
  if (ying && ying.zhi && ZHI_DIR[ying.zhi]) {
    tips.push(`应爻地支「${ying.zhi}」，事体/对方方位可参「${ZHI_DIR[ying.zhi]}」。`)
  }
  if (fu) tips.push('用神伏藏：方位信号偏弱，先定事体浮现，再细看方位。')
  if (!tips.length) tips.push('卦上方位信号不足，宜改日再问，或结合现场罗盘核验。')
  return tips
}

function primaryPlace(ctx) {
  const { yongList, ying, ben } = ctx
  const y = ctx.primaryYong || (yongList && yongList[0])
  if (y && y.zhi && ZHI_DIR[y.zhi]) return ZHI_DIR[y.zhi]
  if (ying && ying.zhi && ZHI_DIR[ying.zhi]) return ZHI_DIR[ying.zhi]
  if (ben && ben.upper && GUA_DIR[ben.upper.name]) return GUA_DIR[ben.upper.name]
  if (ben && ben.lower && GUA_DIR[ben.lower.name]) return GUA_DIR[ben.lower.name]
  return ''
}

/** 本卦一句依据 */
function evidenceLine(ctx) {
  const { topic, yongList, fu, shi, ying, changingIndexes, ben } = ctx
  const bits = []
  if (ben && ben.name) bits.push(`本卦${ben.name}`)
  if (yongList && yongList.length) {
    const y = ctx.primaryYong || yongList[0]
    let s = `用神在${yaoName(y)}`
    if (y.wangshuai) s += `，月令${y.wangshuai}`
    if (y.kong) s += y.changing ? '，动而逢空' : '，逢空'
    if (y.changing && y.changeTo) s += `，动化${y.changeTo.text}`
    bits.push(s)
  } else if (fu) {
    bits.push(`${topic.yongshen}伏藏（${fu.text}）`)
  } else if (topic.yongshen === '世爻' && shi) {
    bits.push(`以世为主：${yaoName(shi)}${shi.wangshuai ? '，' + shi.wangshuai : ''}`)
  } else {
    bits.push(`${topic.yongshen}未现`)
  }
  if (shi && ying && topic.useShiYing) bits.push(`世应${relationWuxing(shi.wuxing, ying.wuxing)}`)
  if (changingIndexes && changingIndexes.length) bits.push(`动爻${changingIndexes.length}处`)
  else bits.push('六爻安静')
  return bits.join('；')
}

function adjustToneLevel(ctx, tone, level) {
  const { topic, yongList, fu, yinPattern } = ctx
  const judgedYong = ctx.primaryYong ? [ctx.primaryYong] : yongList
  const yongWeak = judgedYong.some((y) => y.wangshuai === '囚' || y.wangshuai === '死')
  const yongKong = judgedYong.some((y) => y.kong) || (fu && fu.kong)
  const yongMovingGood = judgedYong.some((y) => {
    const a = y.changeTo && y.changeTo.analysis
    return a && a.huiTou && a.huiTou.type === '回头生'
  })
  const yongMovingBad = judgedYong.some((y) => {
    const a = y.changeTo && y.changeTo.analysis
    return a && a.huiTou && a.huiTou.type === '回头克'
  })

  if (!yongList.length && !fu && topic.yongshen !== '世爻') {
    return { tone: 'mid', level: '事未明' }
  }
  if (!yongList.length && fu) {
    if (tone === 'good') return { tone, level: '可望·待引出' }
    if (tone === 'bad') return { tone, level: '难成·仍伏' }
    return { tone, level: '未出台·宜等' }
  }
  if (tone === 'good' && (yongKong || yongWeak || yongMovingBad)) {
    return { tone, level: level === '可成' ? '可成·待实' : '偏可成·有虚' }
  }
  if (tone === 'bad' && yongMovingGood) return { tone, level: '偏难·有转机' }
  if (tone === 'mid') {
    if (judgedYong.some((y) => y.wangshuai === '旺' || y.wangshuai === '相') && !yongKong) {
      return { tone: 'good', level: '勉强可成' }
    }
    if (yongWeak || yongKong) return { tone: 'bad', level: '把握不大' }
  }
  return { tone, level }
}

function whoHintFromCtx(ctx) {
  const { yongList, shi, ying, topic } = ctx
  const y = (ctx.parsed && ctx.parsed.mode === 'who' && ying)
    || ctx.primaryYong
    || (yongList && yongList[0])
  if (y) {
    const role =
      y.liuqin === '官鬼' ? '管事/上级/制度方'
        : y.liuqin === '父母' ? '长辈/文书/平台方'
          : y.liuqin === '妻财' ? '对方（利益或情感相关）'
            : y.liuqin === '子孙' ? '晚辈/下属/执行人'
              : y.liuqin === '兄弟' ? '同行/竞争/平辈'
                : '关键当事人'
    const side = y.role === '应' ? '应爻·对方侧' : y.role === '世' ? '世爻·我方侧' : `${y.name}`
    return `${role}，落在${side}`
  }
  if (ying) return `应爻所指之人（${ying.liuqin || '对方'}）`
  if (shi) return '世应关系中的对方一侧'
  return topic && topic.yongshen ? `与「${topic.yongshen}」相关之人` : ''
}

function choicePickFromParsed(parsed, tone) {
  // 单凭整体顺逆，不能把选项排列顺序强行对应吉凶。
  return ''
}

function philosophyGuidance(tone, focus, parsed) {
  if (parsed && parsed.negativeEvent) return '先核事实，再定边界，不以卦象替代证据。'
  if (parsed && (parsed.domain === 'health' || parsed.domain === 'pregnancy')) return '卦可定心，不可代医；以检查、复诊和专业意见为准。'
  if (parsed && parsed.domain === 'weather') return '以官方预报和现场情况为准，卦象只作趋避提醒。'
  if (parsed && parsed.domain === 'lost' && /寻人|人/.test(String(parsed.focus || ''))) return '先联络、查找和报警，勿因卦象耽误行动。'
  if (parsed && parsed.mode === 'choice') return '先做可逆的小步验证，再决定是否重注。'
  if (tone === 'good') return '可进，但以守正、守信并留有余地为度。'
  if (tone === 'bad') return `宜先止损换势，不与「${focus}」的逆势硬争。`
  return `先小步求证「${focus}」，条件明朗后再定。`
}

/** 按问题类型组织判断与建议 */
function buildJudgment(ctx) {
  const {
    topic, tendency, question, yongList, fu, changingIndexes, yinPattern, shi, ying, ben, calendar
  } = ctx
  const parsed = resolveParsed(question, topic, ctx.askMeta)
  const quiet = !changingIndexes.length
  const fanYin = yinPattern && yinPattern.fanYin
  const fuYin = yinPattern && yinPattern.fuYin

  let { tone, level } = adjustToneLevel(ctx, tendency.tone, tendency.level)
  const answerTone = parsed.mode === 'yesno' && parsed.negativeEvent ? invertTone(tone) : tone
  const mild = /偏|勉|虚|待|小|两可|未明|把握/.test(String(level))

  const place = primaryPlace(ctx)
  const tPoints = timingPoints(ctx)
  const pPoints = placePoints(ctx)
  ctx.parsed = parsed
  const whoHint = whoHintFromCtx(ctx)
  const choicePick = choicePickFromParsed(parsed, tone)
  const primaryYong = ctx.primaryYong || yongList[0]
  let whenHint = ''
  let clockHint = ''
  if (primaryYong && primaryYong.zhi) {
    whenHint = `重点看「${primaryYong.zhi}」日/冲「${primaryYong.zhi}」日`
    if (primaryYong.kong) whenHint += `，以及出空填实之后`
  } else if (fu) {
    whenHint = '等伏神引出或飞神冲开'
  }

  // 「几点」：用地支映射时辰；优先用神，其次动爻，再次世爻
  if (parsed.whenKind === 'clock') {
    let zhi = ''
    if (primaryYong && primaryYong.zhi) zhi = primaryYong.zhi
    else {
      const moving = (ctx.ben && ctx.ben.yaos) ? ctx.ben.yaos.filter((y) => y.changing) : []
      if (moving[0] && moving[0].zhi) zhi = moving[0].zhi
      else if (shi && shi.zhi) zhi = shi.zhi
    }
    const sc = shichenOfZhi(zhi)
    clockHint = formatShichenHint(sc)
    if (clockHint) whenHint = clockHint
  }

  if (parsed.mode === 'when') {
    if (parsed.whenKind === 'clock') {
      level = clockHint
        ? (tone === 'bad' ? `时刻信号弱·${clockHint}` : `时刻偏${clockHint}`)
        : '时刻未明'
    } else if (tone === 'good') level = quiet ? '应期偏稳偏慢' : '应期偏近'
    else if (tone === 'bad') level = '应期迟滞'
    else level = '应期未明'
  } else if (parsed.mode === 'where') {
    level = place ? `方位偏${place}` : '方位未明'
  } else if (parsed.mode === 'jixiong') {
    if (tone === 'good') level = mild ? '小吉' : '偏吉'
    else if (tone === 'bad') level = mild ? '小凶' : '偏凶'
    else level = '平'
  } else if (parsed.mode === 'who') {
    level = whoHint ? (tone === 'good' ? '宜对接' : tone === 'bad' ? '宜慎择' : '宜再观') : '人物未明'
  } else if (parsed.mode === 'choice') {
    level = parsed.choice ? '两项待比较' : '选项未明'
  } else if (parsed.mode === 'degree') {
    if (parsed.domain === 'health' || parsed.domain === 'pregnancy') level = '须医学评估'
    else if (tone === 'good') level = mild ? '偏轻' : '不重'
    else if (tone === 'bad') level = mild ? '偏重' : '偏严重'
    else level = '轻重未分'
  } else if (parsed.mode === 'yesno') {
    level = yesNoLevel(parsed, answerTone, mild)
  } else if (parsed.mode === 'how') {
    if (tone === 'good') level = '宜进取'
    else if (tone === 'bad') level = '宜先守'
    else level = '宜备后动'
  }
  const guardedLevel = safetyLevel(parsed)
  if (guardedLevel) level = guardedLevel

  const focus = parsed.focus
  const askRef = parsed.raw
    ? `你问的是「${parsed.raw}」（按「${parsed.modeLabel}」来断）`
    : `本次按「${topic.label}·${parsed.modeLabel}」来断`
  const evidence = evidenceLine(ctx)

  let judgment = ''

  const guardedJudgment = safetyJudgmentLine(
    parsed,
    parsed.mode === 'yesno' ? answerTone : tone
  )
  if (guardedJudgment) {
    judgment += guardedJudgment
  } else if (parsed.mode === 'where') {
    judgment += place
      ? `判断：你问的方位，重点看「${place}」（事体「${focus}」）。`
      : `判断：你问的方位信号不足，暂不宜钉死一处。`
    judgment += pPoints.slice(0, 3).join('')
  } else if (parsed.mode === 'when' && parsed.whenKind === 'clock') {
    judgment += clockHint
      ? `判断：你问的是「几点」——「${focus}」象意时刻偏${clockHint}（取用神/动爻地支合十二时辰）。`
      : `判断：你问的是「几点」，但卦上时刻信号不足，不宜钉死钟点。`
  } else if (parsed.mode === 'when') {
    judgment += `判断：你问的时机——「${focus}」${tone === 'good' ? '偏有可盼' : tone === 'bad' ? '偏迟或反复' : '尚不明朗'}。`
    if (whenHint) judgment += `${whenHint}。`
    judgment += tPoints.slice(0, 3).join('')
  } else if (parsed.mode === 'jixiong') {
    judgment += `判断：你问的吉凶——「${focus}」整体${tone === 'good' ? '偏吉' : tone === 'bad' ? '偏凶' : '吉凶交杂'}。`
  } else if (parsed.mode === 'who') {
    judgment += whoHint
      ? `判断：你问找谁——关键偏「${whoHint}」。`
      : '判断：人物象不足，宜改问「找谁/靠谁」或参应爻。'
  } else if (parsed.mode === 'choice') {
    if (parsed.choice) {
      judgment += `判断：你问「${parsed.choice.a}」还是「${parsed.choice.b}」——本卦只显示当前抉择环境${tone === 'good' ? '偏顺' : tone === 'bad' ? '偏滞' : '未明'}，不能把先写的选项自动当吉、后写的自动当凶。`
    } else {
      judgment += '判断：抉择题请写成「A还是B」，本卦再据此取舍。'
    }
  } else if (parsed.mode === 'how') {
    judgment += `判断：你问怎么办——办「${focus}」宜${tone === 'good' ? '进取' : tone === 'bad' ? '先守后改' : '备而后动'}。`
  } else if (parsed.mode === 'degree') {
    judgment += (parsed.domain === 'health' || parsed.domain === 'pregnancy')
      ? `判断：你问医学轻重——卦象不具备诊断能力；「${focus}」须由症状、检查和医生评估。`
      : `判断：你问轻重——「${focus}」${tone === 'good' ? '偏轻' : tone === 'bad' ? '偏重' : '轻重未分'}。`
  } else if (parsed.mode === 'yesno') {
    judgment += yesNoJudgmentLine(parsed, answerTone)
  } else {
    judgment += `判断：你问的走势——「${focus}」${tone === 'good' ? '偏好' : tone === 'bad' ? '偏逆' : '两可'}。`
  }

  if (parsed.timeHint && parsed.mode !== 'when') {
    if (tone === 'good') judgment += `你提到的时间「${parsed.timeHint}」可作窗口。`
    else if (tone === 'bad') judgment += `你提到的时间「${parsed.timeHint}」不宜死磕。`
    else judgment += `你提到的时间「${parsed.timeHint}」还不宜钉死。`
  }

  judgment += `卦上依据：${evidence}。`
  if (fanYin) judgment += '另有反吟，结果易反复。'
  if (fuYin) judgment += '另有伏吟，局面易胶着。'

  const reply = directReply(parsed, parsed.mode === 'yesno' ? answerTone : tone, level, {
    place,
    whenHint,
    clockHint,
    whoHint,
    choicePick,
    outcomeTone: tone
  })

  let advice = ''
  if (parsed.mode === 'where') {
    advice = place
      ? `当下怎么做：先往「${place}」一侧排查/行动，再对照应爻与现场核验；勿只认一个点。`
      : '当下怎么做：方位未明，宜改问「具体何方」，或到现场用罗盘辅助。'
  } else if (parsed.mode === 'when' && parsed.whenKind === 'clock') {
    advice = clockHint
      ? `当下怎么做：按${clockHint}前后观察「${focus}」；同时看天气预报作对照。卦象只给时辰区间，不是精确到分钟。`
      : `当下怎么做：整日分段留意「${focus}」，并对照实况；本卦时刻信号不足。`
  } else if (parsed.mode === 'when') {
    advice = whenHint
      ? `当下怎么做：把日程对到${whenHint}；空亡则等出空，合住则等破合。`
      : '当下怎么做：先记用神地支与动爻，逐日对照冲合，不空等。'
  } else if (parsed.mode === 'who') {
    advice = whoHint
      ? (tone === 'good'
        ? `当下怎么做：优先对接「${whoHint}」，带具体方案一次说清。`
        : tone === 'bad'
          ? `当下怎么做：对「${whoHint}」先观再动，勿一次押死；可另寻生扶之源。`
          : `当下怎么做：可接触「${whoHint}」，同时准备备选联系人。`)
      : '当下怎么做：人物未明，先看应爻与用神六亲，再决定找谁。'
  } else if (parsed.mode === 'choice') {
    if (parsed.choice) {
      advice = `当下怎么做：给「${parsed.choice.a}」与「${parsed.choice.b}」使用同一组标准，比较收益、代价、可逆性和最坏结果；信息不足时先做低成本验证。`
    } else {
      advice = '当下怎么做：用「甲还是乙」把两个选项写清楚再起一卦。'
    }
  } else if (parsed.mode === 'jixiong') {
    advice = tone === 'good'
      ? `当下怎么做：吉中仍防忌神；可推进「${focus}」，但留退路。`
      : tone === 'bad'
        ? `当下怎么做：凶象当前，收缩「${focus}」风险，勿扩大敞口。`
        : `当下怎么做：平局则小步试错，不为「${focus}」一次押死。`
  } else if (parsed.mode === 'how') {
    advice = tone === 'good'
      ? '当下怎么做：主动推进，借元神生扶，避开忌神发动窗口。'
      : tone === 'bad'
        ? '当下怎么做：先止损、改条件；忌神发动时尤其别硬闯。'
        : '当下怎么做：补条件、作两手准备，用神有气再加码。'
  } else if (parsed.mode === 'degree') {
    advice = (parsed.domain === 'health' || parsed.domain === 'pregnancy')
      ? `当下怎么做：记录「${focus}」的症状、持续时间和检查结果；有加重或警示症状及时就医。`
      : tone === 'good'
        ? `当下怎么做：「${focus}」按较轻压力处理，仍保持观察。`
        : tone === 'bad'
          ? `当下怎么做：「${focus}」宜重视，该求助时别拖。`
          : `当下怎么做：持续观察「${focus}」变化，勿自行下死结论。`
  } else if (parsed.mode === 'yesno') {
    advice = yesNoAdvice(parsed, answerTone)
  } else if (tone === 'good') {
    advice = `当下怎么做：围绕「${focus}」推进；盯近应，防忌神搅局。`
  } else if (tone === 'bad') {
    advice = `当下怎么做：先放下对「${focus}」的硬攻，改条件或换时机。`
  } else {
    advice = `当下怎么做：先为「${focus}」补条件，待用神有气再拍板。`
  }

  if (
    shi && ying
    && parsed.mode !== 'where'
    && parsed.mode !== 'who'
    && parsed.mode !== 'choice'
    && parsed.whenKind !== 'clock'
    && parsed.yesKind !== 'occur'
    && !parsed.negativeEvent
    && !['health', 'pregnancy', 'lawsuit', 'invest', 'property'].includes(parsed.domain)
    && !(parsed.domain === 'lost' && /寻人|人/.test(String(parsed.focus || '')))
  ) {
    const sy = relationWuxing(shi.wuxing, ying.wuxing)
    if (sy === '被克') advice += '你（世）受对方/环境所克，接触对方时宜守。'
    if (sy === '被生') advice += `你（世）得对方/环境所生，可借力办「${focus}」。`
    if (sy === '克') advice += `你能压住对方/事体，办「${focus}」时可主导，但勿过刚。`
  }
  advice += philosophyGuidance(tone, focus, parsed)
  const safety = safetyAdvice(parsed)
  if (safety) advice += safety

  return {
    level,
    tone,
    reply,
    judgment,
    advice,
    label: level,
    parsed,
    timingTips: tPoints,
    placeTips: pPoints,
    place,
    whenHint,
    clockHint,
    whoHint,
    choicePick,
    answerTone
  }
}

function uniqueText(items) {
  return (items || []).filter((item, index, list) => item && list.indexOf(item) === index)
}

function guaCiOf(gua) {
  if (!gua) return null
  return getGuaCi(gua.alias || gua.name) || null
}

/**
 * 所问推理画像：同一卦用于不同问题时，证据权重必须不同。
 * 每个轴都对应一个现实问题，同时指定要观察的卦爻角色。
 */
function questionProfile(ctx, judgment) {
  const parsed = judgment.parsed || {}
  const id = (ctx.askMeta && ctx.askMeta.optionId) || ''
  const domain = parsed.domain || 'general'
  const base = {
    kind: 'general',
    result: parsed.focus || '此事',
    premise: '这不是只看一个“吉凶分数”，而要分别判断你、目标、外部承接与实际阻力。',
    axes: [
      { key: 'self', label: '你的承接能力', role: 'shi', purpose: '你是否有能力把事情接住' },
      { key: 'target', label: '目标是否成形', role: 'yong', purpose: '所求结果是否已有现实基础' },
      { key: 'outside', label: '外部是否配合', role: 'ying', purpose: '对方或环境是否愿意配合' }
    ],
    action: `先验证「${parsed.focus || '此事'}」最关键的现实条件，再决定是否继续投入。`
  }

  if (/^em-(have|like)$/.test(id)) return {
    kind: 'emotion-feeling', result: '对方心意',
    premise: '问“有没有感情”，不能只看关系吉凶；要分开看对方心里是否有你、是否愿意向你靠近，以及这种心意能否变成持续行动。',
    axes: [
      { key: 'other', label: '对方真实心意', role: 'ying', purpose: '对方是否有稳定回应' },
      { key: 'mutual', label: '双方是否相向', role: 'shi-ying', purpose: '感情是双向流动还是单方投入' },
      { key: 'interference', label: '外部干扰', role: 'liuqin:兄弟', polarity: 'risk', purpose: '竞争、旁人或资源分流是否介入' }
    ],
    action: '不要继续猜“喜欢不喜欢”；观察对方是否主动联系、安排见面并承担关系责任。只有连续行动，才算卦上心意真正落地。'
  }
  if (/^em-(together|back)$/.test(id)) return {

  }

    axes: [
      { key: 'self', label: '你的准备程度', role: 'shi', purpose: '你是否已经具备作出改变的条件' },
      { key: 'outside', label: '外部承接', role: 'ying', purpose: '新选择或外部环境是否真正接得住' },
      { key: 'change', label: '变化动能', role: 'moving', purpose: '局面是否已经进入必须改变的阶段' },
      { key: 'cost', label: '选择代价', role: 'liuqin:兄弟', polarity: 'risk', purpose: '机会成本、竞争或损失是否过大' }
    ],

  }
  return base
}

function linePower(y) {
  if (!y) return -2
  let score = ({ 旺: 2, 相: 1, 休: 0, 囚: -1, 死: -2 })[y.wangshuai] || 0
  if (y.kong) score -= y.changing ? 1 : 2
  if (y.dayMonth) {
    if (y.dayMonth.tags && (y.dayMonth.tags.includes('临日') || y.dayMonth.tags.includes('临月'))) score += 1
    if (y.dayMonth.chongYue && !(y.dayMonth.tags || []).includes('临日')) score -= 2
    if (y.dayMonth.heRi) score -= 1
    if (y.dayMonth.chongRi) score += y.changing ? 1 : 0
  }
  if (y.changeTo && y.changeTo.analysis) {
    const a = y.changeTo.analysis
    if (a.huiTou && a.huiTou.type === '回头生') score += 2
    if (a.huiTou && a.huiTou.type === '回头克') score -= 2
    if (a.jinTui && a.jinTui.type === '化进神') score += 1
    if (a.jinTui && a.jinTui.type === '化退神') score -= 1
  }
  return Math.max(-3, Math.min(3, score))
}

function pickProfileLine(ctx, axis) {
  const role = axis.role || ''
  if (role === 'shi') return ctx.shi || null
  if (role === 'ying') return ctx.ying || null
  if (role === 'yong') return ctx.primaryYong || (ctx.yongList && ctx.yongList[0]) || null
  if (role === 'moving') {
    return (ctx.ben.yaos || []).filter((y) => y.changing).sort((a, b) => Math.abs(linePower(b)) - Math.abs(linePower(a)))[0] || null
  }
  if (role.indexOf('liuqin:') === 0) {
    const name = role.slice(7)
    return (ctx.ben.yaos || []).filter((y) => y.liuqin === name).sort((a, b) => {
      const activeA = a.changing ? 1 : 0
      const activeB = b.changing ? 1 : 0
      return (linePower(b) + activeB) - (linePower(a) + activeA)
    })[0] || null
  }
  if (role.indexOf('liushen:') === 0) {
    const name = role.slice(8)
    return (ctx.ben.yaos || []).filter((y) => y.liushen === name).sort((a, b) => (b.changing ? 2 : 0) + linePower(b) - (a.changing ? 2 : 0) - linePower(a))[0] || null
  }
  return null
}

function powerPhrase(y) {
  if (!y) return '卦中未见明确落点'
  const parts = []
  if (y.wangshuai) parts.push(y.wangshuai)
  if (y.kong) parts.push('空亡')
  if (y.changing) parts.push('发动')
  if (y.dayMonth && y.dayMonth.chongYue) parts.push('月破')
  if (y.dayMonth && y.dayMonth.heRi) parts.push('被日合住')
  if (y.dayMonth && y.dayMonth.chongRi) parts.push('受日冲触发')
  if (y.changeTo && y.changeTo.analysis && y.changeTo.analysis.huiTou) parts.push(y.changeTo.analysis.huiTou.type)
  if (y.changeTo && y.changeTo.analysis && y.changeTo.analysis.jinTui) parts.push(y.changeTo.analysis.jinTui.type)
  return parts.length ? parts.join('、') : '力量平常'
}

function deepYaoName(y) {
  if (!y) return '—'
  const num = ['初', '二', '三', '四', '五', '上'][y.index] || ''
  const yinYang = y.yinYang ? '九' : '六'
  const label = y.index === 0 ? `${num}${yinYang}` : y.index === 5 ? `${num}${yinYang}` : `${yinYang}${num}`
  return `${label}·${y.liuqin}（${y.ganZhi}${y.wuxing}）`
}

function shiYingReading(ctx) {
  if (!ctx.shi || !ctx.ying) return { value: 0, text: '世应有一方未明，双方是否相向暂难坐实' }
  const rel = relationWuxing(ctx.shi.wuxing, ctx.ying.wuxing)
  const map = {
    被生: { value: 2, text: '应爻生世，对方或环境有向你回流、扶助之意' },
    生: { value: 0, text: '世爻生应，主要是你在向对方投入，关系能否成立仍要看对方回应' },
    被克: { value: -2, text: '应爻克世，对方或环境掌握更多主动权，你方承压' },
    克: { value: 0, text: '世爻克应，你能推动局面，但过度用力也容易让对方退避' },
    比和: { value: 1, text: '世应比和，双方处在相近位置，有协商与并行空间' }
  }
  const base = map[rel] || { value: 0, text: '世应生克不显，双方关系需看实际互动' }
  if (ctx.shi.kong || ctx.ying.kong) return { value: Math.min(0, base.value - 1), text: `${base.text}；但${ctx.shi.kong ? '世' : '应'}爻空亡，承诺尚未落实` }
  return base
}

function analyzeProfileAxis(ctx, axis) {
  if (axis.role === 'shi-ying') {
    const r = shiYingReading(ctx)
    return Object.assign({}, axis, { value: r.value, line: null, text: `${axis.label}：${r.text}；就本题而言，要看${axis.purpose}。` })
  }
  const line = pickProfileLine(ctx, axis)
  let raw = linePower(line)
  const risk = axis.polarity === 'risk'
  if (!line) raw = risk ? -1 : -2
  let value = risk ? -raw : raw
  value = Math.max(-2, Math.min(2, value))
  let effect = ''
  if (risk) {
    if (!line) effect = `${axis.purpose}的信号不强`
    else if (raw >= 1) effect = `${axis.purpose}，已经构成实际阻力`
    else if (raw <= -1) effect = `${axis.purpose}，虽有其象但目前力量有限`
    else effect = `${axis.purpose}，仍需核实，不能夸大`
  } else if (!line) {
    effect = `${axis.purpose}尚未在卦中形成清楚承接`
  } else if (raw >= 1) {
    effect = `${axis.purpose}，卦上已有承接`
  } else if (raw <= -1) {
    effect = `${axis.purpose}，目前偏弱，尚难落实`
  } else {
    effect = `${axis.purpose}，已有基础但还不稳定`
  }
  let relation = ''
  if (line && ctx.shi && line.index !== ctx.shi.index && (axis.role === 'ying' || axis.role === 'yong')) {
    const rel = relationWuxing(ctx.shi.wuxing, line.wuxing)
    if (rel === '被生') relation = '；该爻生世，力量能回到你方'
    else if (rel === '生') relation = '；世去生它，当前更多靠你投入'
    else if (rel === '被克') relation = '；该爻克世，你方受其约束'
    else if (rel === '克') relation = '；世能克它，你方可推动但不宜过刚'
    else if (rel === '比和') relation = '；与世比和，双方较易并行'
  }
  const where = line ? `${deepYaoName(line)}（${powerPhrase(line)}）` : '未见明确对应爻'
  return Object.assign({}, axis, { value, line, text: `${axis.label}：${where}${relation}；就本题而言，${effect}。` })
}

function deepSummary(profile, judgment, total) {
  const parsed = judgment.parsed || {}
  if (profile.safe || profile.guarded) return judgment.level
  if (parsed.mode === 'when' || parsed.mode === 'where' || parsed.mode === 'who' || parsed.mode === 'choice') return judgment.level
  if (profile.negativeOutcome) {
    if (total >= 2) return '暂未见强迹象'
    if (total <= -2) return '风险信号偏强'
    return '有疑点但不能坐实'
  }
  if (parsed.mode === 'how') return total >= 2 ? '可主动推进' : total <= -2 ? '先止损补条件' : '先验证再行动'
  if (parsed.mode === 'jixiong') return total >= 2 ? '偏吉但有条件' : total <= -2 ? '偏凶宜收缩' : '吉凶取决于关键条件'
  if (total >= 3) return '偏能成'
  if (total >= 1) return '有机会，但须补一环'
  if (total <= -3) return '当前难成'
  if (total <= -1) return '把握偏小'
  return '尚未定局'
}

function toneFromDeepTotal(total) {
  if (total >= 2) return 'good'
  if (total <= -2) return 'bad'
  return 'mid'
}

function axisEvidence(axis) {
  if (!axis) return ''
  if (axis.role === 'shi-ying') {
    const fact = String(axis.text || '')
      .replace(new RegExp(`^${axis.label}：`), '')
      .replace(/；就本题而言.*$/, '')
      .replace(/。$/, '')
    return `「${axis.label}」所见：${fact}`
  }
  if (!axis.line) return `「${axis.label}」在卦中未见明确承接`
  return `「${axis.label}」落${deepYaoName(axis.line)}，呈${powerPhrase(axis.line)}之势`
}
