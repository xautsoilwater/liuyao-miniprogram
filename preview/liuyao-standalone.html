      ? '明理之道：风险之象偏弱，也不可据卦指认他人或放弃核验；以事实、坦诚沟通与清楚边界守住关系。'
      : tone === 'bad'
        ? '避凶之道：风险之象偏强，先核事实、留证据、定边界；不以猜疑伤人，也不以侥幸纵患。'
        : '指迷之要：风险未明时，不猜、不纵、不武断；以事实核验和可执行的边界减少后悔。'
  }
  if (parsed && (parsed.domain === 'health' || parsed.domain === 'pregnancy')) {
    return '明理之道：安其心而不轻其患，尽人事而遵医理；能控制的是就医、复查、作息与支持，不能控制的结果不以一卦强求。'
  }
  if (parsed && parsed.domain === 'weather') {
    return '明理之道：天时有变，备而不惧；以预报和现场为据，卦象只提醒人保留余地。'
  }
  if (parsed && parsed.domain === 'lost' && /寻人|人/.test(String(parsed.focus || ''))) {
    return '寻人之要：以行动争取时间，以事实缩小范围；卦象不可替代联络、搜索与必要的报警求助。'
  }
  if (parsed && parsed.mode === 'choice') {
    return '取舍之道：不求卦替人承担后果，只求看清得失；所选若有据、可承受、能修正，进退皆可少悔。'
  }
  if (tone === 'good') {
    return `趋吉之道：顺势而行，却不因一时有利而躁进；守正、守信、留有余地，方能使「${focus}」之吉延续。体得其安，行方能久。`
  }
  if (tone === 'bad') {
    return `避凶之道：先止损，再变通；莫把一时阻滞当作终局，也莫以执念强求「${focus}」。穷则变，变则通，调整自身与条件便是在育新机。`
  }
  return `指迷之要：象在变，事亦在变；先安其心，再辨轻重缓急，对「${focus}」小步求证、随势修正。知进退而守其中，方可少悔。`
}

/** 按所问类型组织梅花明确答复（与六爻同构） */
function buildAskJudgment(cast, huVerdict, bianVerdict) {
  const topic = { label: '梅花所问' }
  const parsed = resolveParsed(cast.question, topic, cast.askMeta)
  let tone = cast.verdict.tone
  let level = cast.verdict.level

  // 互、变参校：过程/结局转逆则略下调，转顺则略上调
  if (tone === 'good' && (huVerdict.tone === 'bad' || bianVerdict.tone === 'bad')) {
    tone = 'mid'
    level = '宜量力'
  } else if (tone === 'bad' && (huVerdict.tone === 'good' || bianVerdict.tone === 'good')) {
    tone = 'mid'
    level = '有转机'
  }
  const answerTone = parsed.mode === 'yesno' && parsed.negativeEvent ? invertTone(tone) : tone

  const place = meihuaPlace(cast)
  const whenHint = meihuaWhenHint(cast, tone, parsed.whenKind)
  const clockHint = parsed.whenKind === 'clock' ? whenHint : ''
  const whoHint = meihuaWhoHint(cast)
  const choicePick = meihuaChoicePick(parsed, tone)
  const evidence = meihuaEvidence(cast, huVerdict, bianVerdict)
  const focus = parsed.focus

  if (parsed.mode === 'when') {
    if (parsed.whenKind === 'clock') {
      level = clockHint
        ? (tone === 'bad' ? `时刻信号弱·${clockHint}` : `时刻偏${clockHint}`)
        : '时刻未明'
    } else if (tone === 'good') level = '应期偏近'
    else if (tone === 'bad') level = '应期迟滞'
    else level = '应期未明'
  } else if (parsed.mode === 'where') {
    level = place ? `方位偏${place}` : '方位未明'
  } else if (parsed.mode === 'jixiong') {
    if (tone === 'good') level = '偏吉'
    else if (tone === 'bad') level = '偏凶'
    else level = '平'
  } else if (parsed.mode === 'who') {
    level = tone === 'good' ? '宜对接' : tone === 'bad' ? '宜慎择' : '宜再观'
  } else if (parsed.mode === 'choice') {
    level = parsed.choice ? '两项待比较' : '选项未明'
  } else if (parsed.mode === 'yesno') {
    level = yesNoLevel(parsed, answerTone, /耗力|有转机/.test(String(level)))
  } else if (parsed.mode === 'degree') {
    if (parsed.domain === 'health' || parsed.domain === 'pregnancy') level = '须医学评估'
    else if (tone === 'good') level = '偏轻'
    else if (tone === 'bad') level = '偏重'
    else level = '轻重未分'
  } else if (parsed.mode === 'how') {
    if (tone === 'good') level = '宜进取'
    else if (tone === 'bad') level = '宜先守'
    else level = '宜备后动'
  }
  const guardedLevel = safetyLevel(parsed)
  if (guardedLevel) level = guardedLevel

  const askRef = parsed.raw
    ? `你问的是「${parsed.raw}」（按「${parsed.modeLabel}」来断）`
    : `本次按梅花「${parsed.modeLabel}」来断`

  let judgment = `${askRef}。`

  const guardedJudgment = safetyJudgmentLine(
    parsed,
    parsed.mode === 'yesno' ? answerTone : tone
  )
  if (guardedJudgment) {
    judgment += guardedJudgment
  } else if (parsed.mode === 'where') {
    judgment += place
      ? `判断：你问的方位，重点看「${place}」（事体「${focus}」，用卦「${cast.tiYong.yong.name}」后天位）。`
      : '判断：你问的方位信号不足，暂不宜钉死一处。'
  } else if (parsed.mode === 'when' && parsed.whenKind === 'clock') {
    judgment += clockHint
      ? `判断：你问的是「几点」——「${focus}」象意时刻偏${clockHint}（取动爻合十二时辰）。`
      : '判断：你问的是「几点」，但卦上时刻信号不足，不宜钉死钟点。'
  } else if (parsed.mode === 'when') {
    judgment += `判断：你问的时机——「${focus}」${tone === 'good' ? '偏有可盼' : tone === 'bad' ? '偏迟或反复' : '尚不明朗'}。`
    if (whenHint) judgment += `${whenHint}。`
  } else if (parsed.mode === 'jixiong') {
    judgment += `判断：你问的吉凶——「${focus}」整体${tone === 'good' ? '偏吉' : tone === 'bad' ? '偏凶' : '吉凶交杂'}。`
  } else if (parsed.mode === 'who') {
    judgment += `判断：你问找谁——人物象偏「${whoHint}」。`
  } else if (parsed.mode === 'choice') {
    if (parsed.choice) {
      judgment += `判断：你问「${parsed.choice.a}」还是「${parsed.choice.b}」——本卦只显示当前抉择环境${tone === 'good' ? '偏顺' : tone === 'bad' ? '偏滞' : '未明'}，不能把选项排列顺序强行对应吉凶。`
    } else {
      judgment += '判断：抉择题请写成「A还是B」，本卦再据此取舍。'
    }
  } else if (parsed.mode === 'how') {
    judgment += `判断：你问怎么办——办「${focus}」宜${tone === 'good' ? '进取' : tone === 'bad' ? '先守后改' : '备而后动'}。`
  } else if (parsed.mode === 'degree') {
    judgment += (parsed.domain === 'health' || parsed.domain === 'pregnancy')
      ? `判断：你问医学轻重——卦象不具备诊断能力；「${focus}」须由症状、检查和医生评估。`
      : `判断：你问轻重——「${focus}」${tone === 'good' ? '偏轻' : tone === 'bad' ? '偏重' : '轻重未分'}。`
  } else if (parsed.mode === 'yesno') {
    judgment += yesNoJudgmentLine(parsed, answerTone)
  } else {
    judgment += `判断：你问的走势——「${focus}」${tone === 'good' ? '偏好' : tone === 'bad' ? '偏逆' : '两可'}。`
  }

  if (parsed.timeHint && parsed.mode !== 'when') {
    if (tone === 'good') judgment += `你提到的时间「${parsed.timeHint}」可作窗口。`
    else if (tone === 'bad') judgment += `你提到的时间「${parsed.timeHint}」不宜死磕。`
    else judgment += `你提到的时间「${parsed.timeHint}」还不宜钉死。`
  }

  judgment += `卦上依据：${evidence}。本卦体用「${cast.verdict.rel}」；互卦「${huVerdict.rel}」看过程，变卦「${bianVerdict.rel}」看趋向。`

  const reply = directReply(parsed, parsed.mode === 'yesno' ? answerTone : tone, level, {
    place,
    whenHint,
    clockHint,
    whoHint,
    choicePick,
    outcomeTone: tone
  })

  let advice = ''
  if (parsed.mode === 'where') {
    advice = place
      ? `当下怎么做：先往「${place}」一侧排查/行动，再对照用卦物象与现场；勿只认一个点。`
      : '当下怎么做：方位未明，宜改问「具体何方」，或到现场核验。'
  } else if (parsed.mode === 'when' && parsed.whenKind === 'clock') {
    advice = clockHint
      ? `当下怎么做：按${clockHint}前后观察「${focus}」；并对照实况/预报。卦象只给时辰区间，不是精确到分钟。`
      : `当下怎么做：整日分段留意「${focus}」，本卦时刻信号不足。`
  } else if (parsed.mode === 'when') {
    advice = `当下怎么做：结合${whenHint}；体用转顺再加码，转逆则缓。`
  } else if (parsed.mode === 'who') {
    advice = tone === 'good'
      ? `当下怎么做：优先对接「${whoHint}」，带具体方案一次说清。`
      : tone === 'bad'
        ? `当下怎么做：对「${whoHint}」先观再动；可另寻生扶之象。`
        : `当下怎么做：可接触「${whoHint}」，同时准备备选。`
  } else if (parsed.mode === 'choice') {
    if (parsed.choice) {
      advice = `当下怎么做：给「${parsed.choice.a}」与「${parsed.choice.b}」使用同一组标准，比较收益、代价、可逆性和最坏结果；信息不足时先做低成本验证。`
    } else {
      advice = '当下怎么做：用「甲还是乙」把两个选项写清楚再起一卦。'
    }
  } else if (parsed.mode === 'jixiong') {
    advice = tone === 'good'
      ? `当下怎么做：吉中仍看互变是否转逆；可推进「${focus}」，留退路。`
      : tone === 'bad'
        ? `当下怎么做：凶象当前，收缩「${focus}」风险，勿扩大敞口。`
        : `当下怎么做：平局则小步试错，不为「${focus}」一次押死。`
  } else if (parsed.mode === 'how') {
    advice = tone === 'good'
      ? '当下怎么做：主动推进，借用生体/体克用之势，避开用克体窗口。'
      : tone === 'bad'
        ? '当下怎么做：先止损、改条件；用克体时尤其别硬闯。'
        : '当下怎么做：补条件、作两手准备，体用转顺再加码。'
  } else if (parsed.mode === 'degree') {
    advice = (parsed.domain === 'health' || parsed.domain === 'pregnancy')
      ? `当下怎么做：记录「${focus}」的症状、持续时间和检查结果；有加重或警示症状及时就医。`
      : tone === 'good'
        ? `当下怎么做：「${focus}」按较轻压力处理，仍保持观察。`
        : tone === 'bad'
          ? `当下怎么做：「${focus}」宜重视，该求助时别拖。`
          : `当下怎么做：持续观察「${focus}」变化。`
  } else if (parsed.mode === 'yesno') {
    advice = yesNoAdvice(parsed, answerTone)
  } else if (tone === 'good') {
    advice = `当下怎么做：围绕「${focus}」推进；盯互变是否转逆。`
  } else if (tone === 'bad') {
    advice = `当下怎么做：先放下对「${focus}」的硬攻，改条件或换时机。`
  } else {
    advice = `当下怎么做：先为「${focus}」补条件，待体用转顺再拍板。`
  }
  advice += philosophyGuidance(tone, focus, parsed)
  const safety = safetyAdvice(parsed)
  if (safety) advice += safety

  return {
    level,
    tone,
    reply,
    judgment,
    advice,
    parsed,
    place,
    whenHint,
    clockHint,
    whoHint,
    choicePick,
    answerTone
  }
}

function buildGuide(cast) {
  const { ben, hu, bian, tiYong, verdict, dongYao, methodLabel, nums, calendar, ask } = cast
  const sections = []
  const huTiGua = sideGua(hu, tiYong, 'ti')
  const huYongGua = sideGua(hu, tiYong, 'yong')
  const huVerdict = tiYongVerdict(huTiGua.wuxing, huYongGua.wuxing)
  const bianTi = sideGua(bian, tiYong, 'ti')
  const bianYong = sideGua(bian, tiYong, 'yong')
  const bianVerdict = tiYongVerdict(bianTi.wuxing, bianYong.wuxing)

  const lead = []
  if (ask) {
    if (ask.reply) lead.push(ask.reply)
    lead.push(ask.judgment)
    if (ask.advice) lead.push(ask.advice)
    lead.push(`本题按「${ask.parsed.modeLabel}」断「${ask.parsed.focus}」（检出：${modeLabelList(ask.parsed.modes)}）。`)
  } else {
    lead.push(`先说结论：就所问而言「${verdict.level}」（${verdict.rel}）。${verdict.note}`)
  }
  lead.push(`起法：${methodLabel}。本卦「${ben.name}」，动在${YAO_CN[dongYao - 1]}。`)
  lead.push(`体卦是「${tiYong.ti.symbol}${tiYong.ti.name}」（${tiYong.ti.wuxing}，${tiYong.tiSide}），代表你自己或所问主体。`)
  lead.push(`用卦是「${tiYong.yong.symbol}${tiYong.yong.name}」（${tiYong.yong.wuxing}，${tiYong.yongSide}），代表事体、对方或所问对象。`)
  lead.push(tiYong.rule + '。')
  lead.push('梅花易数重「体用生克」：先看本卦体用，再参互卦、变卦的生克变化。')
  sections.push({ title: '对所问的判断', items: lead })

  const methodItems = []
  if (methodLabel.indexOf('报数') >= 0) {
    methodItems.push(`所报两数：上数 ${nums.upperSrc} 除8取 ${nums.upperRemainder} →「${ben.upper.name}」；下数 ${nums.lowerSrc} 除8取 ${nums.lowerRemainder} →「${ben.lower.name}」。`)
    methodItems.push(`动爻：(上数+下数)=${nums.sum}，${nums.sum}÷6 余 ${dongYao === 6 && nums.sum % 6 === 0 ? 0 : dongYao} → 取${YAO_CN[dongYao - 1]}（余0作6）。`)
  } else if (methodLabel.indexOf('时间') >= 0) {
    methodItems.push('时间起卦用：农历年支数+农历月+农历日得上卦；再加时支数得下卦；总数取动爻。')
    if (calendar) methodItems.push(`本次历日：${calendar.display}${nums.lunarText ? ` · 农历${nums.lunarText}` : ''}${nums.hourText ? ' · ' + nums.hourText : ''}。`)
    methodItems.push(`演算：上源 ${nums.upperSrc}→「${ben.upper.name}」；下源 ${nums.lowerSrc}→「${ben.lower.name}」；动爻源 ${nums.sum}→${YAO_CN[dongYao - 1]}。`)
  } else {
    methodItems.push(`随机得数：上 ${nums.upperSrc}、下 ${nums.lowerSrc}，动爻源 ${nums.sum} → ${YAO_CN[dongYao - 1]}。`)
  }
  methodItems.push('先天数口诀：乾1兑2离3震4巽5坎6艮7坤8。')
  sections.push({ title: '如何排出', items: methodItems })

  sections.push({
    title: '本卦 · 体用',
    items: [
      ...describeGua(ben),
      `体：${tiYong.ti.symbol}${tiYong.ti.name}${tiYong.ti.nature}（${tiYong.ti.wuxing}）。用：${tiYong.yong.symbol}${tiYong.yong.name}${tiYong.yong.nature}（${tiYong.yong.wuxing}）。`,
      `体用生克：${verdict.rel}。${verdict.note}`
    ]
  })

  sections.push({
    title: '互卦（过程）',
    items: [
      ...describeGua(hu),
      `互卦仍按本卦体用方位看：体方「${huTiGua.symbol}${huTiGua.name}」，用方「${huYongGua.symbol}${huYongGua.name}」。`,
      `互卦体用：${huVerdict.rel}。${huVerdict.note}`,
      '互卦多主事情发展的中间过程，宜与本卦对照。'
    ]
  })

  sections.push({
    title: '变卦（趋向）',
    items: [
      `动爻${YAO_CN[dongYao - 1]}阴阳对换，得变卦「${bian.name}」。`,
      ...describeGua(bian),
      `变后体方「${bianTi.symbol}${bianTi.name}」，用方「${bianYong.symbol}${bianYong.name}」。`,
      `变卦体用：${bianVerdict.rel}。${bianVerdict.note}`,
      '变卦多主结局与走向；本卦看目前，互卦看过程，变卦看将来。'
    ]
  })

  if (ask && ask.parsed && ask.parsed.mode === 'where') {
    const placeItems = []
    const yongDir = GUA_DIR[tiYong.yong.name]
    const tiDir = GUA_DIR[tiYong.ti.name]
    if (yongDir) placeItems.push(`用卦「${tiYong.yong.name}」后天位在「${yongDir}」，事体/所求方位多参此。`)
    if (tiDir) placeItems.push(`体卦「${tiYong.ti.name}」后天位在「${tiDir}」，多主己方或目前所在。`)
    placeItems.push('梅花方位取象宜与现场对照，勿只认一个点。')
    sections.push({ title: '方位怎么看', items: placeItems })
  } else if (ask && ask.parsed && ask.parsed.mode === 'when' && ask.parsed.whenKind === 'clock') {
    sections.push({
      title: '时刻怎么看（本题重点）',
      items: [
        '梅花动爻序号没有公认的固定钟点对应表，本盘不把初至上爻强配成六个时段。',
        `本卦体用「${verdict.rel}」只说明「${ask.parsed.focus}」的顺逆倾向，不伪造具体几点。`,
        '此类推演为教学示意，请结合实况与专业预报。'
      ]
    })
  } else if (ask && ask.parsed && ask.parsed.mode === 'when') {
    sections.push({
      title: '应期（本题重点）',
      items: [
        ask.whenHint || '宜结合动爻与体用顺逆看远近。',
        `本卦${verdict.rel}，互卦${huVerdict.rel}，变卦${bianVerdict.rel}——过程与结局是否转顺，影响应期快慢。`,
        calendar && calendar.day ? `起卦日支「${calendar.day.zhi}」，可作对照起点。` : '可逐日对照体用顺逆变化。'
      ]
    })
  } else if (ask && ask.parsed && ask.parsed.mode === 'who') {
    sections.push({
      title: '人物怎么看',
      items: [
        `用卦「${tiYong.yong.symbol}${tiYong.yong.name}」主事体/对方：${GUA_PERSON[tiYong.yong.name] || '参卦德取象'}。`,
        `体卦「${tiYong.ti.name}」主己方：${GUA_PERSON[tiYong.ti.name] || '参卦德取象'}。`,
        `体用「${verdict.rel}」决定此人目前是助力还是阻力。`
      ]
    })
  } else if (ask && ask.parsed && ask.parsed.mode === 'choice' && ask.parsed.choice) {
    sections.push({
      title: '抉择怎么看',
      items: [
        `选项：「${ask.parsed.choice.a}」／「${ask.parsed.choice.b}」。`,
        `本卦体用「${verdict.rel}」可看当前抉择环境；互看过程，变看趋向。`,
        '单卦整体顺逆不能按书写顺序直接判甲乙；宜同标准比较，必要时分别一事一占。'
      ]
    })
  }

  sections.push({
    title: '收束提醒',
    items: [
      '读盘次序建议：先定体用 → 看本卦生克 → 再看互、变是否转顺或转逆。',
      '梅花易数取象灵活，同一卦也可配物象、方位；此处以体用生克作教学主干。',
      '以上为传统梅花规则化推演，供研习对照；不是绝对预言，请结合实际自行判断。'
    ]
  })

  return sections
}

function assembleCast({ method, methodLabel, question, askMeta, date, upperSrc, lowerSrc, sum, dongYao, numsExtra }) {
  const upper = numToTrigram(upperSrc)
  const lower = numToTrigram(lowerSrc)
  const ben = packGua(upper, lower)
  const dong = mod6(dongYao != null ? dongYao : sum)
  const tiYong = resolveTiYong(ben, dong)
  const verdict = tiYongVerdict(tiYong.ti.wuxing, tiYong.yong.wuxing)
  const hu = buildHuGua(ben.lines)
  const bian = buildBianGua(ben.lines, dong - 1)
  const calendar = buildCalendar(date)

  const huTiGua = sideGua(hu, tiYong, 'ti')
  const huYongGua = sideGua(hu, tiYong, 'yong')
  const huVerdict = tiYongVerdict(huTiGua.wuxing, huYongGua.wuxing)
  const bianTi = sideGua(bian, tiYong, 'ti')
  const bianYong = sideGua(bian, tiYong, 'yong')

/**
 * 调用 AI 大模型 API 进行解卦
 */
async function callAiDivinationApi(a, b) {
  const { question, cast } = normalizeArgs(a, b)
  const config = getAiConfig()
  const { systemPrompt, userPrompt } = buildDivinationPrompt({ question, cast })

  const requestBody = {
    model: config.model,
    messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ],
    temperature: config.temperature || 0.7,
    max_tokens: config.maxTokens || 2000
  }

  let rawContent = ''

  // 适配微信小程序环境与浏览器/Node环境
  if (typeof wx !== 'undefined' && wx.request) {
    rawContent = await new Promise((resolve, reject) => {
      wx.request({
        url: config.apiUrl,
        method: 'POST',
        header: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        data: requestBody,
        timeout: 25000,
        success: (res) => {
          if (res.statusCode >= 200 && res.statusCode < 300 && res.data) {
            const reply = res.data.choices?.[0]?.message?.content
            if (reply) resolve(reply)
            else reject(new Error('API响应格式异常'))
          } else {
            reject(new Error(`API请求失败: ${res.statusCode}`))
          }
        },
        fail: (err) => reject(err)
      })
    })
  } else if (typeof fetch !== 'undefined') {
    const response = await fetch(config.apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${config.apiKey}`
      },
      body: JSON.stringify(requestBody)
    })

    if (!response.ok) {
      throw new Error(`API HTTP Error: ${response.status}`)
    }

    const json = await response.json()
    rawContent = json.choices?.[0]?.message?.content || ''
  } else {
    throw new Error('当前环境不支持网络请求')
  }

  return parseAiDivinationOutput(rawContent, question, cast)
}

/**
 * 解析大模型返回的结构化文本
 */
function parseAiDivinationOutput(text, question, cast) {
  if (!text) throw new Error('AI返回内容为空')

  const parsed = {
    summary: '',
    judgment: '',
    yongshen: '',
    yingqi: '',
    advice: '',
    raw: text
  }

  // 提取四大部分
  const parts = text.split(/###?\s*【/g)
  parts.forEach(part => {
    if (part.startsWith('神机总断】')) {
      const content = cleanAiMarkdown(part.replace(/^神机总断】\s*/, '').trim())
      const lines = content.split('\n').map(l => cleanAiMarkdown(l).trim()).filter(Boolean)
      parsed.summary = cleanAiMarkdown(lines[0] || '大成卦象 · 天机显现')
      parsed.judgment = cleanAiMarkdown(lines.slice(1).join('\n') || content)
    } else if (part.startsWith('用神与爻象探微】')) {
      parsed.yongshen = cleanAiMarkdown(part.replace(/^用神与爻象探微】\s*/, '').trim())
    } else if (part.startsWith('机运演进与应期】')) {
      parsed.yingqi = cleanAiMarkdown(part.replace(/^机运演进与应期】\s*/, '').trim())
    } else if (part.startsWith('周易明理 · 趋吉避凶】')) {
      parsed.advice = cleanAiMarkdown(part.replace(/^周易明理 · 趋吉避凶】\s*/, '').trim())
    }
  })

  // 兜底提取
  if (!parsed.judgment) parsed.judgment = cleanAiMarkdown(text.slice(0, 300))
  if (!parsed.summary) parsed.summary = '神机内蕴 · 顺时而动'

  // 判断倾向色调
  let tone = 'mid'
  if (text.includes('大吉') || text.includes('亨通') || text.includes('顺畅') || text.includes('大有可为')) {
    tone = 'good'
  } else if (text.includes('凶') || text.includes('受阻') || text.includes('险陷') || text.includes('退守')) {
    tone = 'bad'
  }

  const sections = [
    {
      title: '一、神机总断',
      items: toSectionItems(parsed.judgment || parsed.summary)
    },
    {
      title: '二、用神与爻象探微',
      items: toSectionItems(parsed.yongshen || '卦中用神清晰，察日月生克与动爻乘除，天机自现。')
    },
    {
      title: '三、机运演进与应期',
      items: toSectionItems(parsed.yingqi || '万物有时，事机发动逢值逢合之候为关键应期。')
    },
    {
      title: '四、周易明理 · 趋吉避凶',
      items: toSectionItems(parsed.advice || '知进知退，顺天应人，修德明理方能趋吉避凶。')
    }
  ]

  return {
    source: 'ai_online',
    question,
    tone,
    tendency: { tone },
    summary: parsed.summary,
    judgment: parsed.judgment,
    yongshen: parsed.yongshen,
    yingqi: parsed.yingqi,
    advice: parsed.advice,
    sections,
    fullText: text
  }
}

/**
 * 智能象数离线理数推演引擎（当网络断开或用户未配置有效API Key时的全自动周易大师算法）
 */
function buildIntelligentFallbackInterpretation(a, b) {
  const { question, cast } = normalizeArgs(a, b)
  const benGuaName = cast?.ben?.name || '乾为天'
  const bianGuaName = (cast?.bian && cast?.bian?.name) || benGuaName
  const benGuaci = getGuaCi(benGuaName) || {}
  const bianGuaci = getGuaCi(bianGuaName) || {}

  // 分析卦象动静
  const hasMove = !!(cast?.changingIndexes && cast.changingIndexes.length > 0)
  const changingCount = cast?.changingIndexes ? cast.changingIndexes.length : 0

  // 判定吉凶大势
  let tone = 'good'
  let summary = '亨通吉利 · 顺水行舟'
  if (benGuaName === '坎' || benGuaName === '蹇' || benGuaName === '困' || benGuaName === '明夷') {
    tone = 'bad'
    summary = '关山险阻 · 审慎待时'
  } else if (benGuaName === '需' || benGuaName === '屯' || benGuaName === '蛊' || benGuaName === '损') {
    tone = 'mid'
    summary = '静待蓄势 · 循序渐进'
  } else if (benGuaName === '泰' || benGuaName === '大有' || benGuaName === '同人' || benGuaName === '临') {
    tone = 'good'
    summary = '天开化育 · 顺势而上'
  }

  const cal = cast?.calendar || {}
  const dayGz = cal.day?.text || '吉日'
  const monthGz = cal.month?.text || '令月'

  // 智能推演用神
  let yongshenDesc = ''
  if (/钱|财|收益|买|卖|盈|利/.test(question)) {
    yongshenDesc = `问测求财获利，专以卦中【妻财】为用神。逢${monthGz}月建生助，财源有气；动爻生扶财爻，主利市可期，唯防兄弟爻暗动分夺。`
  } else if (/工作|事业|考|官|晋升|职位|项目|前途/.test(question)) {
    yongshenDesc = `问测功名事业与项目立项，首重卦中【官鬼】与【父母】爻。官鬼为职阶机运，父母为文书批文。今盘中世爻得地，官印相生，所图之事脉络分明。`
  } else if (/感情|婚|爱|喜欢|交往|他|她/.test(question)) {
    yongshenDesc = `问测姻缘情缘，重在参验【世爻】与【应爻】之相生相合。世应同心则吉，若逢相冲克害，则宜多假以时日，增进诚意相通。`
  } else {
    yongshenDesc = `综合审视卦象，以【世爻】为自身根基，以【动爻】为机变枢纽。今得《${benGuaName}》卦，动化《${bianGuaName}》卦，主事态正在推移演变之中。`
  }

  // 智能推演应期
  const yingqiDesc = hasMove
    ? `卦中${changingCount}爻发动，变生不测。机运变转多应在动爻干支逢值、逢合之期，近期以逢冲开滞或月令交接之日（见${cal.month?.text || '本月'}中下旬）为关键分水岭。`
    : `此卦纯静无动爻，事态处于恒定蓄势之局。无变则主慢，宜静守其常，待逢值之日月方见枢机明朗。`

  // 周易明理
  const adviceDesc = `《易经·${benGuaName}卦》象曰：「${benGuaci.xiang || '君子以自强不息'}」。问事之要，不在贪求必应，而在知阴阳之消息。若顺应天时、修谨人事，则虽有阻滞亦可化险为夷。`

  const judgmentDesc = `所问「${question || '事由'}」，筮得本卦《${benGuaName}》${hasMove ? `，变卦《${bianGuaName}》` : '（静卦）'}。卦辞云：「${benGuaci.guaci || '利贞'}」。当前${dayGz}日辰，吉凶隐伏已现端倪。`

  const sections = [
    {
      title: '一、神机总断',
      items: toSectionItems(judgmentDesc)
    },
    {
      title: '二、用神与爻象探微',
      items: toSectionItems(yongshenDesc)
    },
    {
      title: '三、机运演进与应期',
      items: toSectionItems(yingqiDesc)
    },
    {
      title: '四、周易明理 · 趋吉避凶',
      items: toSectionItems(adviceDesc)
    }
  ]

  return {
    source: 'fallback',
    question: question || '综合运程',
    tone,
    tendency: { tone },
    summary,
    judgment: judgmentDesc,
    yongshen: yongshenDesc,
    yingqi: yingqiDesc,
    advice: adviceDesc,
    sections,
    fullText: `${summary}\n\n${judgmentDesc}\n\n${yongshenDesc}\n\n${yingqiDesc}\n\n${adviceDesc}`
  }
}

/**
 * 统一解卦对外接口（自动尝试在线大模型API，遇阻平滑降级至智能象数算法，确保100%可靠）
 */
async function interpretWithAi(a, b) {
  const { question, cast } = normalizeArgs(a, b)
  try {
    return await callAiDivinationApi({ question, cast })
  } catch (err) {
    console.warn('AI API 调用受阻，自动启用本地智能理数神机推演:', err.message)
    return buildIntelligentFallbackInterpretation({ question, cast })
  }
}

}

  function corners() {

  function bindNav() {

  function polar(cx, cy, r, deg) {
    // 0deg = 屏顶；古图上南，故数据以正南为 0°、顺时针
    const rad = (deg - 90) * Math.PI / 180
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }
  }

  function guaBarsSvg(lines, x, y, color) {
    const fill = color || '#140f0c'
    const order = [lines[2], lines[1], lines[0]]
    return order.map((yang, i) => {
      const yy = y - 12 + i * 8
      if (yang) return `<rect x="${x - 14}" y="${yy}" width="28" height="3.6" rx="0.4" fill="${fill}"/>`
      return `<rect x="${x - 14}" y="${yy}" width="10" height="3.6" rx="0.4" fill="${fill}"/><rect x="${x + 4}" y="${yy}" width="10" height="3.6" rx="0.4" fill="${fill}"/>`
    }).join('')
  }

  function buildLuopanSvg(plateDeg) {
    const cx = 200, cy = 200
    const rot = plateDeg == null ? -180 : plateDeg
    const bagua = [
      { n: '离', tip: '火', color: '#3a3028', lines: [1, 0, 1], deg: 0 },
      { n: '坤', tip: '地·土', color: '#3a3028', lines: [0, 0, 0], deg: 45 },
      { n: '兑', tip: '泽·金', color: '#3a3028', lines: [1, 1, 0], deg: 90 },
      { n: '乾', tip: '天·金', color: '#3a3028', lines: [1, 1, 1], deg: 135 },
      { n: '坎', tip: '水', color: '#3a3028', lines: [0, 1, 0], deg: 180 },
      { n: '艮', tip: '山·土', color: '#3a3028', lines: [0, 0, 1], deg: 225 },
      { n: '震', tip: '雷·木', color: '#3a3028', lines: [1, 0, 0], deg: 270 },
      { n: '巽', tip: '风·木', color: '#3a3028', lines: [0, 1, 1], deg: 315 }
    ]
    const mountains = ['子', '癸', '丑', '艮', '寅', '甲', '卯', '乙', '辰', '巽', '巳', '丙', '午', '丁', '未', '坤', '申', '庚', '酉', '辛', '戌', '乾', '亥', '壬']
    const dirs = [{ n: '南', deg: 0 }, { n: '西', deg: 90 }, { n: '北', deg: 180 }, { n: '东', deg: 270 }]
    const ticks = Array.from({ length: 72 }, (_, i) => {
      const deg = i * 5
      const major = deg % 30 === 0
      const mid = deg % 10 === 0 && !major
      const outer = polar(cx, cy, 196, deg)
      const inner = polar(cx, cy, major ? 184 : mid ? 188 : 191, deg)
      return `<line x1="${outer.x}" y1="${outer.y}" x2="${inner.x}" y2="${inner.y}" stroke="${major ? 'rgba(143,38,31,0.55)' : mid ? 'rgba(20,15,12,0.32)' : 'rgba(20,15,12,0.18)'}" stroke-width="${major ? 1.6 : 1}"/>`
    }).join('')
    const spokes = [22.5, 67.5, 112.5, 157.5, 202.5, 247.5, 292.5, 337.5].map((deg) => {
      const a = polar(cx, cy, 88, deg)
      const b = polar(cx, cy, 140, deg)
      return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(20,15,12,0.12)" stroke-width="1"/>`
    }).join('')
    const degLabs = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map((compass) => {
      const deg = (compass + 180) % 360
      const p = polar(cx, cy, 188, deg)
      return `<text x="${p.x}" y="${p.y + 3}" text-anchor="middle" transform="rotate(${deg} ${p.x} ${p.y})" fill="rgba(20,15,12,0.55)" font-size="9" font-weight="600">${compass}</text>`
    }).join('')
    const mountainTexts = mountains.map((name, i) => {
      const compass = i * 15
      const deg = (compass + 180) % 360
      const p = polar(cx, cy, 168, deg)
      const cardinal = name === '子' || name === '午' || name === '卯' || name === '酉'
      return `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" transform="rotate(${deg} ${p.x} ${p.y})" fill="${cardinal ? 'rgba(143,38,31,0.95)' : 'rgba(20,15,12,0.5)'}" font-size="${cardinal ? 13 : 10}" font-weight="${cardinal ? 700 : 500}">${name}</text>`
    }).join('')
    const dirTexts = dirs.map((d) => {
      const p = polar(cx, cy, 152, d.deg)
      return `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" transform="rotate(${d.deg} ${p.x} ${p.y})" fill="rgba(143,38,31,0.75)" font-size="10" font-weight="700">${d.n}</text>`
    }).join('')
    const guaFill = '#3a3028'
    const guaTexts = bagua.map((b) => {
      const p = polar(cx, cy, 112, b.deg)
      return `<g data-lucky-toggle="1" transform="translate(${p.x.toFixed(2)},${p.y.toFixed(2)}) rotate(${b.deg})" style="cursor:pointer">
        <circle cx="0" cy="8" r="28" fill="rgba(0,0,0,0)"/>
        ${guaBarsSvg(b.lines, 0, -10, guaFill)}
        <text x="0" y="14" text-anchor="middle" fill="${guaFill}" font-size="13" font-weight="700">${b.n}</text>
        <text x="0" y="26" text-anchor="middle" fill="${guaFill}" font-size="8" font-weight="600">${b.tip}</text>
      </g>`
    }).join('')
    const luckyMarks = (state.luckyOpen && state.luckyPack && state.luckyPack.marks || []).map((m) => {
      const rim = polar(cx, cy, 198, m.plateDeg)
      const tick = polar(cx, cy, 207, m.plateDeg)
      const label = polar(cx, cy, 220, m.plateDeg)
      return `<g class="lucky-mark" pointer-events="none">
        <line x1="${rim.x.toFixed(1)}" y1="${rim.y.toFixed(1)}" x2="${tick.x.toFixed(1)}" y2="${tick.y.toFixed(1)}" stroke="#a03328" stroke-width="1.8"/>
        <g transform="translate(${label.x.toFixed(1)},${label.y.toFixed(1)}) rotate(${m.plateDeg})">
          <text x="0" y="-4" text-anchor="middle" fill="#a03328" font-size="13.5" font-weight="700">${m.label}</text>
          <text x="0" y="8.5" text-anchor="middle" fill="#a03328" font-size="11">${m.dir}</text>
        </g>
      </g>`
    }).join('')

    return `
      <svg viewBox="-40 -45 480 495" overflow="visible" xmlns="http://www.w3.org/2000/svg" aria-label="后天八卦罗盘 · 准星指南针">
        <defs></defs>
        <g id="luopan-plate" transform="rotate(${rot} 200 200)">
          <circle cx="200" cy="200" r="198" fill="#e6d4b0" stroke="#46341c" stroke-width="3"/>
          <circle cx="200" cy="200" r="191" fill="none" stroke="rgba(248,240,222,0.55)" stroke-width="5"/>
          <circle cx="200" cy="200" r="186" fill="none" stroke="rgba(90,70,40,0.22)" stroke-width="1.2"/>
          <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(20,15,12,0.14)" stroke-width="1"/>
          <circle cx="200" cy="200" r="158" fill="none" stroke="rgba(143,38,31,0.2)" stroke-width="1"/>
          <circle cx="200" cy="200" r="108" fill="none" stroke="rgba(20,15,12,0.1)" stroke-width="1"/>
          <circle cx="200" cy="200" r="92" fill="none" stroke="rgba(143,38,31,0.14)" stroke-width="1"/>
          ${ticks}
          ${spokes}
          ${degLabs}
          ${dirTexts}
          ${mountainTexts}
          ${guaTexts}
          ${luckyMarks}
        </g>
        <!-- 固定准星 -->
        <g pointer-events="none">
        <line x1="200" y1="8" x2="200" y2="392" stroke="rgba(160,51,40,0.7)" stroke-width="1.5"/>
        <line x1="40" y1="200" x2="360" y2="200" stroke="rgba(160,51,40,0.35)" stroke-width="1"/>
        <polygon points="200,4 206,16 194,16" fill="#a03328"/>
        <circle cx="200" cy="200" r="4" fill="#a03328" stroke="#faf3e4" stroke-width="1.5"/>
        </g>
        <circle cx="200" cy="200" r="46" fill="#f0e4c8" stroke="rgba(20,15,12,0.16)" stroke-width="1"/>
        <circle cx="200" cy="200" r="46" fill="none" stroke="rgba(143,38,31,0.1)" stroke-width="3"/>
        <circle cx="200" cy="200" r="34" fill="#f6eedc" stroke="rgba(20,15,12,0.42)" stroke-width="1.5"/>
        <g pointer-events="none">
          <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="56s" repeatCount="indefinite"/>
          <path d="M200 166 A34 34 0 0 1 200 234 A17 17 0 0 1 200 200 A17 17 0 0 0 200 166" fill="#140f0c"/>
          <circle cx="200" cy="183" r="17" fill="#140f0c"/>
          <circle cx="200" cy="217" r="17" fill="#f6eedc"/>
          <circle cx="200" cy="183" r="5" fill="#f6eedc"/>
          <circle cx="200" cy="217" r="5" fill="#140f0c"/>
        </g>
        <circle data-lucky-toggle="1" cx="200" cy="200" r="46" fill="rgba(0,0,0,0)" style="cursor:pointer"/>
      </svg>`
  }

  const MOUNTAIN_NAMES = ['子', '癸', '丑', '艮', '寅', '甲', '卯', '乙', '辰', '巽', '巳', '丙', '午', '丁', '未', '坤', '申', '庚', '酉', '辛', '戌', '乾', '亥', '壬']

  function dirNameOf(deg) {
    const d = ((deg % 360) + 360) % 360
    const names = ['北', '东北', '东', '东南', '南', '西南', '西', '西北']
    return names[Math.round(d / 45) % 8]
  }
  function mountainOf(deg) {
    const d = ((deg % 360) + 360) % 360
    return MOUNTAIN_NAMES[Math.round(d / 15) % 24]
  }
  function headingFromPlate(plateDeg) {
    return (((-plateDeg - 180) % 360) + 360) % 360
  }

  function plateFromHeading(heading) {
    return -heading - 180
  }

  function normalizePlate(deg) {
    let n = deg % 360
    if (n > 180) n -= 360
    if (n <= -180) n += 360
    return n
  }

  function paintLuopanLive() {
    if (state.page !== 'index') return
    const plate = document.getElementById('luopan-plate')
    const hudDir = document.getElementById('hud-dir')
    const hudDeg = document.getElementById('hud-deg')
    const h = state.compassReady
      ? state.compassHeading
      : headingFromPlate(state.plateDeg)
    if (plate) plate.setAttribute('transform', `rotate(${state.plateDeg} 200 200)`)
    if (hudDir) hudDir.textContent = dirNameOf(h)
    if (hudDeg) hudDeg.textContent = `${(Math.round(h * 10) / 10)}°`
  }

  function applyLiveHeading(heading) {
    if (state._dragging) return
    const h = ((Number(heading) % 360) + 360) % 360
    state.compassHeading = h
    state.compassReady = true
    state.plateDeg = plateFromHeading(h)
    paintLuopanLive()
  }

  function bindLuopanInteractions() {
    const wrap = document.getElementById('luopan-wrap')
    if (!wrap) return
    const centerOf = () => compassCenter(wrap)
    const angleAt = (clientX, clientY, c) =>
      (Math.atan2(clientY - c.y, clientX - c.x) * 180) / Math.PI

    wrap.onmousedown = (e) => {
      if (isLuckyHit(e.target)) return
      e.preventDefault()
      state._didDrag = false
      state._dragging = true
      state._lastDragAng = angleAt(e.clientX, e.clientY, centerOf())
    }
    wrap.onclick = (e) => {
      if (state._didDrag) {
        state._didDrag = false
        return
      }
      if (isLuckyHit(e.target)) {
        e.preventDefault()
        e.stopPropagation()
        toggleLucky()
      }
    }
    wrap.ontouchstart = (e) => {
      const t = e.touches[0]
      if (!t) return
      state._didDrag = false
      if (isLuckyHit(e.target)) {
        state._luckyTap = true
        return
      }
      state._luckyTap = false
      state._dragging = true
      state._lastDragAng = angleAt(t.clientX, t.clientY, centerOf())
    }
    wrap.ontouchmove = (e) => {
      const t = e.touches[0]
      if (!t || !state._dragging) return
      dragMove(t.clientX, t.clientY, centerOf)
    }
    wrap.ontouchend = () => {
      if (state._luckyTap) {
        state._luckyTap = false
        if (!state._didDrag) toggleLucky()
        return
      }
      dragEnd()
    }
    wrap.ontouchcancel = () => dragEnd()
  }

  function compassCenter(wrap) {
    const svg = wrap.querySelector('svg')
    const box = (svg || wrap).getBoundingClientRect()
    const vb = svg && svg.viewBox && svg.viewBox.baseVal
    if (!vb || !vb.width) {
      return { x: box.left + box.width / 2, y: box.top + box.width / 2 }
    }
    const scale = box.width / vb.width
    return {
      x: box.left + (200 - vb.x) * scale,
      y: box.top + (200 - vb.y) * scale
    }
  }

  function isLuckyHit(target) {
    if (!target || !target.closest) return false
    return !!target.closest('[data-lucky-toggle]')
  }

  function toggleLucky() {
    const now = Date.now()
    if (toggleLucky._at && now - toggleLucky._at < 400) return
    toggleLucky._at = now
    state.luckyOpen = !state.luckyOpen
    if (state.luckyOpen && window.LiuYao && window.LiuYao.buildLuckyDirections) {
      state.luckyPack = window.LiuYao.buildLuckyDirections(new Date())
    } else {
      state.luckyPack = null
    }
    render()
  }

  function dragMove(clientX, clientY, centerOf) {
    if (!state._dragging || state._lastDragAng == null) return
    const ang = (Math.atan2(clientY - centerOf().y, clientX - centerOf().x) * 180) / Math.PI
    let delta = ang - state._lastDragAng
    if (delta > 180) delta -= 360
    if (delta < -180) delta += 360
    state._lastDragAng = ang
    state._didDrag = true
    state.plateDeg = normalizePlate(state.plateDeg + delta)
    state.compassHeading = headingFromPlate(state.plateDeg)
    state._dragHint = '拖动转盘中'
    paintLuopanLive()
  }

  function dragEnd() {
    if (!state._dragging) return
    state._dragging = false
    state._lastDragAng = null
    if (state.compassReady) applyLiveHeading(state.compassHeading)
    else {
      state._dragHint = '拖动转盘调整方位'
      paintLuopanLive()
    }
  }

  // 窗口级拖动只绑一次，避免 render 叠加监听
  if (!window.__liuyaoDragBound) {
    window.__liuyaoDragBound = true
    window.addEventListener('mousemove', (e) => {
      if (!state._dragging) return
      const wrap = document.getElementById('luopan-wrap')
      if (!wrap) return
      dragMove(e.clientX, e.clientY, () => compassCenter(wrap))
    })
    window.addEventListener('mouseup', dragEnd)
  }

    bindNav()

  function triggerAiInterpretation(force = false) {
    if (state.aiLoading || !state.cast) return
    const question = state.question || '心意默祷（诸事顺逆与进退机宜）'
    const castKey = (state.cast.ben ? state.cast.ben.name : '') + '-' +
      (state.cast.bian ? state.cast.bian.name : '') + '-' +
      (state.cast.changingIndexes ? state.cast.changingIndexes.join('') : '') + '-' +
      question

    if (!force && state.aiResult && state.aiResultKey === castKey) {
      return
    }

    state.aiLoading = true
    state.aiResult = null
    state.aiResultKey = castKey
    render()

    const runner = window.LiuYao && window.LiuYao.interpretWithAi
    if (!runner) {
      setTimeout(() => {
        state.aiResult = window.LiuYao.interpret ? window.LiuYao.interpret(state.cast, 'general') : null
        state.aiLoading = false
        render()
      }, 500)
      return
    }

    runner(state.cast, question)
      .then((res) => {
        state.aiResult = res
        state.aiLoading = false
        render()
      })
      .catch((err) => {
        console.error('神机解卦出错:', err)
        state.aiLoading = false
        if (window.LiuYao.interpret) {
          state.aiResult = window.LiuYao.interpret(state.cast, 'general')
        }
        render()
      })
  }

        .replace(/\*{1,3}([^\*\n]+?)\*{1,3}/g, '$1')
        .replace(/^[\s]*[\*\-]\s+/gm, '')

    app.innerHTML = `

      const bianGua = state.cast.bian ? state.cast.bian.name : '无变'
      let text = `【所测事宜】${state.question || '心意默祷'}\n`

  function formatAccountTime(iso) {
    if (!iso) return ''
    const d = new Date(iso)
    if (Number.isNaN(d.getTime())) return ''
    const pad = (n) => (n < 10 ? '0' + n : '' + n)
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`
  }

  const PREVIEW_ACCOUNT_KEY = 'liuyao_preview_account_v2'
  const PREVIEW_SESSION_KEY = 'liuyao_preview_session_v2'

  function accountEsc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
  }

  function cleanAccountNick(value, fallback = '研习者') {
    const clean = String(value == null ? '' : value)
      .replace(/[\u0000-\u001f\u007f]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
    return Array.from(clean || fallback).slice(0, 20).join('')
  }

  function previewStoreGet(key) {
    try {
      const raw = window.localStorage.getItem(key)
      return raw ? JSON.parse(raw) : null
    } catch (e) {
      return null
    }
  }

  function previewStoreSet(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value))
      return true
    } catch (e) {
      return false
    }
  }

  function previewStoreRemove(key) {
    try {
      window.localStorage.removeItem(key)
    } catch (e) {
      // ignore
    }
  }

  function hydratePreviewAccount() {
    const account = previewStoreGet(PREVIEW_ACCOUNT_KEY)
    const session = previewStoreGet(PREVIEW_SESSION_KEY)
    state.account = account && account.id ? account : null
    state.user = state.account && session && session.accountId === state.account.id
      ? { ...state.account, loginAt: session.issuedAt, authenticated: true, localOnly: true }
      : null
    state.accountNick = state.account ? state.account.nickName : ''
    state.accountAvatar = state.account ? state.account.avatarUrl || '' : ''
  }

  function savePreviewAccount(account, signedIn) {
    state.account = account
    previewStoreSet(PREVIEW_ACCOUNT_KEY, account)
    if (signedIn) {
      const issuedAt = new Date().toISOString()
      const session = { version: 2, accountId: account.id, issuedAt }
      previewStoreSet(PREVIEW_SESSION_KEY, session)
      state.user = { ...account, loginAt: issuedAt, authenticated: true, localOnly: true }
    } else {
      previewStoreRemove(PREVIEW_SESSION_KEY)
      state.user = null
    }
  }

  function accountInitial(account) {
    const name = cleanAccountNick(account && account.nickName)
    return Array.from(name)[0] || '易'
  }

  function yaoBar(cls) {
    return `<i class="yao-bar ${cls}"></i>`

  function resolveBaguaDisk(kind) {
    if (window.LiuYao && typeof window.LiuYao.buildBaguaDisk === 'function') {
      return window.LiuYao.buildBaguaDisk(kind)
    }
    return null
  }

  function buildBaguaDiskHtml(kind) {
    const disk = resolveBaguaDisk(kind)
    if (!disk) return '<div class="fig-fallback">图示</div>'
    const ticks = (disk.ticks || []).map((tick) =>
      `<i class="lf-tick${tick.major ? ' major' : ''}${tick.mid ? ' mid' : ''}" style="transform:rotate(${tick.deg}deg)"></i>`
    ).join('')
    const spokes = (disk.spokes || []).map((deg) =>
      `<i class="lf-spoke" style="transform:rotate(${deg}deg)"></i>`
    ).join('')
    const dirs = (disk.dirs || []).map((dir) =>
      `<b class="lf-dir-lab deg-${dir.deg}">${dir.name}</b>`
    ).join('')
    const guas = (disk.bagua || []).map((gua) => {
      const bars = [2, 1, 0].map((idx) =>
        `<i class="lf-bar ${gua.lines[idx] ? 'is-yang' : 'is-yin'}"></i>`
      ).join('')
      const ccw = gua.ccw != null ? gua.ccw : -gua.deg
      return `<span class="lf-item" style="transform:rotate(${gua.deg}deg) translateY(calc(var(--yt) * -0.32)) rotate(${ccw}deg)"><span class="lf-gua tone-${gua.tone}"><span class="lf-bars">${bars}</span><b class="lf-gua-name">${gua.name}</b><span class="lf-gua-meta"><i class="lf-gua-tip">${gua.tip}</i><i class="lf-gua-vol">${gua.vol}</i></span></span></span>`
    }).join('')
    return `<div class="lf-disk kind-${disk.kind}">
      <div class="lf-halo"></div>
      <div class="lf-dirs">${dirs}</div>
      <b class="lf-south">▲</b>
      <div class="lf-plate">
        <i class="lf-rim outer"></i><i class="lf-rim mid"></i><i class="lf-band"></i>
        <i class="lf-ring r-outer"></i><i class="lf-ring r-dir"></i><i class="lf-ring r-gua"></i><i class="lf-ring r-core"></i>
        <div class="lf-layer ticks">${ticks}</div>
        <div class="lf-layer spokes">${spokes}</div>
        <div class="lf-layer guas">${guas}</div>
        <div class="lf-core">
          <div class="lf-taiji"><i class="lf-half yang"></i><i class="lf-half yin"></i><i class="lf-eye top"></i><i class="lf-eye bot"></i><i class="lf-dot top"></i><i class="lf-dot bot"></i></div>
        </div>
      </div>
      <div class="lf-legend">${disk.title} · ${disk.subtitle} · ${disk.volLabel}</div>
    </div>`
  }

    return `<div class="fig-bg-grid">${BAGUA_GRID_KEYS.map((k) => {

      const bars = [2, 1, 0].map((idx) =>
        `<i class="lf-bar ${t.lines[idx] ? 'is-yang' : 'is-yin'}"></i>`
      ).join('')
      return `<div class="bg-cell"><span class="lf-bars bg-bars">${bars}</span><b class="bg-name">${t.name}</b><i class="bg-meta">${t.nature} · ${t.wuxing}</i></div>`
    }).join('')}</div>`
  }

    } else if (key === 'liushen') {
      body = `<div class="fig-ls"><span>青龙</span><span>朱雀</span><span>勾陈</span><span>螣蛇</span><span>白虎</span><span>玄武</span><em>↑ 初爻起</em></div>`
    } else if (key === 'wangshuai') {

        <div class="nw-col"><b>内</b>${yaoBar('yin')}${yaoBar('yang')}${yaoBar('yin')}<em>初二三</em></div>

  function renderBlocks(blocks) {
    return (blocks || []).map((b) => {
      if (b.type === 'p') return `<p class="para">${b.text}</p>`
      if (b.type === 'quote') return `<blockquote class="quote"><div>${b.text}</div>${b.from ? `<cite>—— ${b.from}</cite>` : ''}</blockquote>`
      if (b.type === 'list') return `<ul class="learn-list">${b.items.map((it) => `<li>${it}</li>`).join('')}</ul>`
      if (b.type === 'figure') return buildFigureHtml(b.key, b.caption)
      if (b.type === 'note') return `<div class="note">${b.text}</div>`
      return ''
    }).join('')
  }

  let learnJumping = false
  let learnActiveAnchor = ''

  function learnVolumeGroups() {
    let groups
    if (window.LiuYao.groupByCategory) {
      groups = window.LiuYao.groupByCategory()
    } else {
      const g = {}
      window.LiuYao.ARTICLES.forEach((a) => { (g[a.category] = g[a.category] || []).push(a) })
      const order = window.LiuYao.CATEGORY_ORDER || Object.keys(g)
      groups = order.filter((category) => g[category]).map((category, i) => ({
        category,
        label: category,
        anchorId: `learn-vol-${i + 1}`,
        items: (g[category] || []).filter((a) => !a.hiddenFromCatalog)
      }))
    }
    return groups
  }

  function learnJumpOffset() {
    const pageNav = document.querySelector('.nav')
    const volNav = document.querySelector('.vol-nav')
    const navH = pageNav && !pageNav.classList.contains('home-hidden')
      ? pageNav.getBoundingClientRect().height
      : 0
    const volH = volNav ? volNav.getBoundingClientRect().height : 0
    return navH + volH + 8
  }

  function setLearnActive(anchorId) {
    if (!anchorId || anchorId === learnActiveAnchor) return
    learnActiveAnchor = anchorId
    app.querySelectorAll('.vol-chip[data-anchor]').forEach((el) => {
      el.classList.toggle('on', el.dataset.anchor === anchorId)
    })
  }

  function jumpLearnVolume(anchorId) {
    const el = document.getElementById(anchorId)
    if (!el) return
    learnJumping = true
    setLearnActive(anchorId)
    const top = window.scrollY + el.getBoundingClientRect().top - learnJumpOffset()
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' })
    setTimeout(() => { learnJumping = false }, 420)
  }

  function syncLearnActiveFromScroll() {

      return

      ? window.LiuYao.getArticle(state.articleId)
      : (window.LiuYao.normalizeArticle ? window.LiuYao.normalizeArticle(raw) : raw)

  function onSwipeStart(e) {
    const t = e.changedTouches && e.changedTouches[0]
    if (!t) return
    touchStartX = t.clientX
    touchStartY = t.clientY
    touchStartT = Date.now()
  }
  function onSwipeEnd(e) {
    const t = e.changedTouches && e.changedTouches[0]
    if (!t || stack.length <= 1) return
    const dx = t.clientX - touchStartX
    const dy = t.clientY - touchStartY
    const dt = Date.now() - touchStartT
    if (dt > 600) return
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.2) return
    const fromEdge = touchStartX <= 28 && dx > 70
    const swipeLeft = dx < -70
    if (!fromEdge && !swipeLeft) return
    back()
  }

  if (navBack) navBack.onclick = () => goHomeFromNav()
  if (shell) {
    shell.addEventListener('touchstart', onSwipeStart, { passive: true })
    shell.addEventListener('touchend', onSwipeEnd, { passive: true })
  }

  let compassTick = 0
  let pendingHeading = null
  let compassBound = false

  function headingFromOrientEvent(e) {
    if (!e) return null
    if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading)) {
      return e.webkitCompassHeading
    }
    if (e.alpha == null || Number.isNaN(Number(e.alpha))) return null
    // 绝对方位优先；相对方位仍可转盘（相对初始朝向）
    return (360 - Number(e.alpha)) % 360
  }

  function flushPreviewCompass() {
    if (pendingHeading == null) return
    const next = pendingHeading
    pendingHeading = null
    applyLiveHeading(next)
  }

  function applyPreviewCompass(heading) {
    pendingHeading = Math.round(((Number(heading) % 360) + 360) % 360)
    const now = Date.now()
    if (now - compassTick < 50) {
      // 保证最后一帧也会刷上
      clearTimeout(applyPreviewCompass._t)
      applyPreviewCompass._t = setTimeout(flushPreviewCompass, 50)
      return
    }
    compassTick = now
    flushPreviewCompass()
  }

  function bindDeviceOrientation() {
    if (typeof window === 'undefined' || !window.DeviceOrientationEvent) return
    if (compassBound) return
    compassBound = true
    const onOrient = (e) => {
      const h = headingFromOrientEvent(e)
      if (h != null && !Number.isNaN(h)) applyPreviewCompass(h)
    }
    window.addEventListener('deviceorientation', onOrient, true)
    window.addEventListener('deviceorientationabsolute', onOrient, true)
  }

  function requestCompassPermission(fromUser) {
    bindDeviceOrientation()
    const DOE = window.DeviceOrientationEvent
    const req = DOE && DOE.requestPermission
    if (typeof req === 'function') {
      req.call(DOE)
        .then((stateName) => {
          if (stateName === 'granted') {
            bindDeviceOrientation()
            if (fromUser) {
              state._dragHint = '已授权，请转动手机'
              paintLuopanLive()
            }
          } else if (fromUser) {
            state._dragHint = '未授权方向感应 · 可拖动转盘'
            paintLuopanLive()
          }
        })
        .catch(() => {
          if (fromUser) {
            state._dragHint = '无法开启方向感应 · 可拖动转盘'
            paintLuopanLive()
          }
        })
      return
    }
    // 非 iOS：直接监听；若仍无数据则提示拖动
    if (fromUser) {
      state._dragHint = '请转动手机；若无反应可拖动转盘'
      paintLuopanLive()
      setTimeout(() => {
        if (!state.compassReady) {
          state._dragHint = '当前环境无罗盘 · 请拖动转盘'
          paintLuopanLive()
        }
      }, 2500)
    }
  }

  function enableCompassOnFirstGesture() {
    let handled = false
    const activate = () => {
      if (handled) return
      handled = true
      requestCompassPermission(true)
      document.removeEventListener('touchend', activate, true)
      document.removeEventListener('click', activate, true)
    }
    document.addEventListener('touchend', activate, { capture: true, once: true })
    document.addEventListener('click', activate, { capture: true, once: true })
  }

  // 预览页默认开启方向监听；受浏览器权限策略限制时仍可手动拖动转盘。
  bindDeviceOrientation()
  requestCompassPermission(false)
  enableCompassOnFirstGesture()

  function showFloatingNotice(msg) {
    if (typeof document === 'undefined') return
    const el = document.createElement('div')
    el.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1b1511;color:#f0e4c8;padding:8px 18px;border-radius:4px;font-size:12px;letter-spacing:1px;box-shadow:0 4px 18px rgba(0,0,0,0.45);z-index:9999;border:1px solid rgba(160,51,40,0.65);transition:opacity .35s ease;pointer-events:none;'
    el.textContent = msg
    document.body.appendChild(el)
    setTimeout(() => {
      el.style.opacity = '0'
      setTimeout(() => el.remove(), 400)
    }, 2400)
  }

  try {
    const q = new URLSearchParams(window.location.search || '')
    // 隐秘激活通道：支持通过 ?key=... 或 ?apiKey=... 静默写入本机存储，并自动擦除URL防泄漏
    const secretKey = q.get('key') || q.get('apiKey') || q.get('token')
    const secretUrl = q.get('url') || q.get('apiUrl')
    const secretModel = q.get('model')
    if (secretKey || secretUrl || secretModel) {
      const update = {}
      if (secretKey) update.apiKey = secretKey.trim()
      if (secretUrl) update.apiUrl = secretUrl.trim()
      if (secretModel) update.model = secretModel.trim()
      if (window.LiuYao && window.LiuYao.saveAiConfig) {
        window.LiuYao.saveAiConfig(update)
      }
      q.delete('key')
      q.delete('apiKey')
      q.delete('token')
      q.delete('url')
      q.delete('apiUrl')
      q.delete('model')
      const newQuery = q.toString() ? '?' + q.toString() : ''
      const cleanUrl = window.location.pathname + newQuery + (window.location.hash || '')
      window.history.replaceState({}, document.title, cleanUrl)
      setTimeout(() => {
        showFloatingNotice('【天机契合】私钥神机配置已成功注入本机！')
      }, 300)
    }

    const articleId = q.get('article') || q.get('articleId')
    if (articleId) {
      state.page = 'detail'
      state.articleId = articleId
      stack[0] = snapshot()
    }
    const scrollSel = q.get('scroll')
    if (scrollSel) {
      setTimeout(() => {
        const el = document.querySelector(scrollSel)
        if (el) el.scrollIntoView({ block: 'center' })
      }, 0)
    }
  } catch (err) {}
  window.__liuyaoPreview = { state, go, back, render, stack }
  render()
})()
