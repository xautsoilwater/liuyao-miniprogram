function classicalTurnFromCast(ctx, driver, blocker, profile) {
  const benCi = guaCiOf(ctx.ben)
  const bianCi = guaCiOf(ctx.bian)
  const moving = (ctx.ben && ctx.ben.yaos ? ctx.ben.yaos : []).filter((y) => y.changing)
  const relatedIndexes = [blocker, driver]
    .filter((axis) => axis && axis.line)
    .map((axis) => axis.line.index)
  const keyMoving = moving.find((y) => relatedIndexes.includes(y.index)) || moving[0]
  const lineText = keyMoving && benCi && benCi.yaoci ? benCi.yaoci[keyMoving.index] : ''
  const text = [lineText, benCi && benCi.guaci, bianCi && bianCi.guaci].filter(Boolean).join('；')
  if (/利见大人/.test(text) && /朋来|得朋/.test(text)) return '本卦有“利见大人”“朋来”之意：遇到阻力时不宜独自硬闯，找到能作主、能相助的人，并守正行事，事情才有转机。'
  if (/利见大人/.test(text)) return '本卦取“利见大人”之意：事情有困难时，宜求助于有经验、有决定权的人，不宜独断。'
  if (/朋来|得朋/.test(text)) return '本卦取“朋来”之意：困局的化解在于得到同道相助，不在独自强撑。'
  if (/有孚/.test(text)) {
    if (profile && profile.kind === 'lost') return '本卦重“有孚”：线索须前后相应。方位、最后动线与现场物象若能相合，查找范围便可进一步收窄。'
    if (profile && profile.kind === 'lawsuit') return '本卦重“有孚”：判断应以证据、书面记录与程序事实为凭，不能只听口头说法。'
    if (profile && ['wealth', 'receivable'].includes(profile.kind)) return '本卦重“有孚”：财来要有真实承接。若财爻得力，多为迟而可见；若受克受空，则表面有意，实际仍虚。'
    if (profile && profile.kind === 'investment') return '本卦重“有孚”：所见收益要能前后相应。卦象可看进退之势，但不替代对风险与退出条件的判断。'
    if (profile && /^emotion/.test(profile.kind)) return '本卦重“有孚”：真心要由持续行动来证明，不能只听一时表态。'
    return '本卦重“有孚”：前后能够相应、所言能够见于行动，事情才容易由虚转实。'
  }
  if (/勿用|不利|征凶|凶|厉|灾|眚/.test(text)) return '本卦有戒进之意：时机未到，不宜硬推；先把位置站稳，等待条件变化再行动。'
  if (/利涉大川|利有攸往/.test(text)) return '本卦有利往之意：先把路径与准备做实，再采取行动，才能较稳地渡过风险。'
  if (/贞吉|利贞|安贞|无咎/.test(text)) return '本卦以守正为吉：守规则、守次序、守信用，进退才不容易失当。'
  if (/悔|吝/.test(text)) return '本卦提醒知错能改：及时反省并纠正偏差，仍可减少后悔。'
  if (/亨|吉|元亨/.test(text)) return '本卦已有亨通之机，但吉意仍要靠行动落实，不能只看一个“吉”字。'
  return '《易》重视时机与位置；应先审势、守正、知变，再决定进退。'
}

function trendRangeItems(ctx, judgment, deep) {
  const parsed = judgment.parsed || {}
  const y = ctx.primaryYong || (ctx.yongList && ctx.yongList[0]) || (deep.driver && deep.driver.line) || ctx.ying || ctx.shi
  const moving = (ctx.ben && ctx.ben.yaos ? ctx.ben.yaos : []).filter((item) => item.changing)
  const items = []
  const reasons = []
  let trend = deep.total >= 2 ? '后势偏向推进' : deep.total <= -2 ? '短期仍以迟滞、收缩为主' : '先有反复，随后才会逐渐明朗'

  if (y && y.changeTo && y.changeTo.analysis) {
    const analysis = y.changeTo.analysis
    if (analysis.jinTui && analysis.jinTui.type === '化进神') {
      reasons.push(`${deepYaoName(y)}化进神`)
      trend = '后势比当前更有推进力，往往先小后大、由近及远'
    } else if (analysis.jinTui && analysis.jinTui.type === '化退神') {
      reasons.push(`${deepYaoName(y)}化退神`)
      trend = '后势有回缩或降温之象，宜防先有消息、随后放缓'
    }
    if (analysis.huiTou && analysis.huiTou.type === '回头生') {
      reasons.push('动而回头生')
      trend = '变化之后反得助力，转机多出现在行动以后'
    } else if (analysis.huiTou && analysis.huiTou.type === '回头克') {
      reasons.push('动而回头克')
      trend = '越往后阻力越明显，宜防事情启动后再生掣肘'
    }
  }
  if (y && y.kong) reasons.push(`${deepYaoName(y)}逢空，眼下有象未实`)
  if (ctx.yinPattern && ctx.yinPattern.fanYin) {
    reasons.push('卦见反吟')
    trend = '过程容易往返反复，不宜把一次进展当作最终结果'
  } else if (ctx.yinPattern && ctx.yinPattern.fuYin) {
    reasons.push('卦见伏吟')
    trend = '局面暂时停滞，变化多在原处酝酿，不会一下跨得很远'
  } else if (!moving.length) {
    reasons.push('六爻俱静')
    trend = deep.total >= 2 ? '有利条件能够维持，但进展偏慢' : deep.total <= -2 ? '阻力短期延续，局面不易骤变' : '原有状态仍将延续，变化幅度不会太大'
  } else if (moving.length === 1 && !reasons.length) {
    reasons.push(`仅${deepYaoName(moving[0])}发动`)
    trend = '变化集中在一个环节，先看这一点发生转折，再看全局'
  }
  items.push(`趋势：${reasons.length ? reasons.join('；') + '，所以' : '综合用神旺衰与动变，'}${trend}。`)

  if (y) {
    const position = y.index <= 1
      ? '爻位属初、二层，取近、取内、取事情初段'
      : y.index <= 3
        ? '爻位属三、四层，正处内外交接和事情中段'
        : '爻位属五、上层，取远、取外、取事情后段'
    const breadth = moving.length >= 3
      ? '多爻发动，牵涉面较宽，结果不宜锁在单一节点'
      : moving.length === 2
        ? '两爻发动，多见前后两步或两个环节相继变化'
        : moving.length === 1
          ? '一爻独发，变化范围相对集中'
          : '静卦主守成，可能范围以原有人事和环境为主'
    items.push(`可能范围：${deepYaoName(y)}${position}；${breadth}。`)
  }

  const dir = y && y.zhi && ZHI_DIR[y.zhi]
  const trigram = y && ctx.ben ? (y.index <= 2 ? ctx.ben.lower : ctx.ben.upper) : null
  const guaName = trigram && trigram.name
  const guaDir = guaName && GUA_DIR[guaName]
  const physical = ['lost', 'travel', 'delivery', 'home'].includes(deep.profile.kind) || parsed.mode === 'where'
  if (dir || guaDir) {
    const mainDir = dir || guaDir
    const supportDir = dir && guaDir && dir !== guaDir ? guaDir : ''
    let direction = `方位取象：${y && y.zhi ? `${deepYaoName(y)}临「${y.zhi}」，地支取${dir}` : `${guaName}卦后天位取${guaDir}`}`
    if (supportDir) direction += `；其所在${guaName}卦又取${supportDir}作第二层参考。两象不一时，以${mainDir}为主并连同相邻方位观察，不把两个方向硬拼成一条直线`
    else if (dir && guaDir === dir) direction += `，又与${guaName}卦的${guaDir}相合，此方向信号较集中`
    else direction += '，宜连同相邻方位一起观察'
    if (physical && guaName && GUA_SCENE[guaName]) direction += `；${guaName}象还可参${GUA_SCENE[guaName]}`
    else direction += '；若所问并非地点，此方位只作人物来源、机会来向或行动方向的辅助象'
    items.push(`${direction}。`)
  }
  return uniqueText(items).slice(0, 3)
}

function tailoredAction(ctx, profile, driver, blocker) {
  let first = '宜先小范围尝试，观察反馈后再决定是否推进。'
  if (blocker && blocker.value < 0 && driver && driver.value > 0 && blocker.key !== driver.key) {
    first = blocker.polarity === 'risk'
      ? `应先降低「${blocker.label}」带来的风险，再借「${driver.label}」之力推进。`
      : `应先补足「${blocker.label}」，再借「${driver.label}」之力推进。`
  } else if (blocker && blocker.value < 0) {
    first = blocker.polarity === 'risk'
      ? `应先控制「${blocker.label}」这一风险，不宜强行推进。`
      : `应先化解「${blocker.label}」这一阻碍，不宜强行推进。`
  } else if (driver && driver.value > 0) {
    first = `应守住「${driver.label}」这一有利条件，顺势推进。`
  }
  return `${first}${classicalProfileCounsel(profile.kind)}${classicalTurnFromCast(ctx, driver, blocker, profile)}`
}

function pointerFromDeep(ctx, deep) {
  const benCi = guaCiOf(ctx.ben)
  const bianCi = guaCiOf(ctx.bian)
  const moving = (ctx.ben && ctx.ben.yaos ? ctx.ben.yaos : []).filter((y) => y.changing)
  const keyMoving = moving.slice().sort((a, b) => {
    const hit = (y) => (deep.axes.some((axis) => axis.line && axis.line.index === y.index) ? 10 : 0)
      + (ctx.primaryYong && ctx.primaryYong.index === y.index ? 6 : 0)
    return hit(b) - hit(a)
  })[0]
  const lineText = keyMoving && benCi && benCi.yaoci ? benCi.yaoci[keyMoving.index] : ''
  const classicText = [lineText, bianCi && bianCi.guaci, benCi && benCi.guaci].filter(Boolean).join('；')
  let classicTurn = '先把现实条件做实，再谈成败'
  if (/利见大人/.test(classicText)) classicTurn = '门在能作主、能担责的人'
  else if (/朋来|得朋/.test(classicText)) classicTurn = '转机在可信助力，不在独力硬撑'
  else if (/有孚/.test(classicText)) classicTurn = '关键在前后相应、言行相符'
  else if (/勿用|不利|征凶|凶|厉|灾|眚/.test(classicText)) classicTurn = '风险未除，不可硬推'
  else if (/贞吉|利贞|安贞|无咎/.test(classicText)) classicTurn = '守正守序，吉意才有落处'
  else if (/亨|吉|元亨/.test(classicText)) classicTurn = '有路可走，但须用行动落实'

  const driver = deep.driver && deep.driver.value > 0 ? deep.driver : null
  const blocker = deep.blocker && deep.blocker.value < 0 ? deep.blocker : null
  if (deep.profile.kind === 'health') return '卦可提醒轻重缓急，不可替代检查与诊断；身体有警讯，先就医。'
  if (deep.profile.kind === 'lawsuit') return '先固定证据、守住时限，再谈胜负；卦象不能替代法律判断。'
  if (deep.profile.kind === 'investment') return '先算最坏损失与退出路径，再谈收益；卦顺也不可替代尽调。'
  if (deep.profile.kind === 'lost') return '先回溯最后出现的时间与动线，逐处核实；方位只作辅助。'
  if (deep.profile.kind === 'emotion-third') return '卦只提示疑点，不替你指认任何人；先看事实，再定关系边界。'
  if (driver && blocker && driver.key !== blocker.key) {
    return `先解「${blocker.label}」，再借「${driver.label}」；${classicTurn}。`
  }
  if (blocker) return `先解「${blocker.label}」；${classicTurn}。`
  if (driver) return `守住「${driver.label}」这一支点；${classicTurn}。`
  return `${classicTurn}。`
}

function buildDeepReading(ctx, judgment) {
  const profile = questionProfile(ctx, judgment)
  const axes = profile.axes.map((axis) => analyzeProfileAxis(ctx, axis))
  const baseTone = judgment.parsed && judgment.parsed.mode === 'yesno' ? judgment.answerTone : judgment.tone
  let total = axes.reduce((sum, axis) => sum + axis.value, 0)
  total += baseTone === 'good' ? 1 : baseTone === 'bad' ? -1 : 0
  const driverPool = axes.filter((axis) => axis.polarity !== 'risk')
  const driver = (driverPool.length ? driverPool : axes).slice().sort((a, b) => b.value - a.value)[0]
  const blocker = axes.slice().sort((a, b) => a.value - b.value)[0]
  const summary = deepSummary(profile, judgment, total)
  let thesis = ''
  if (profile.safe) {
    thesis = `卦上只可把${axisEvidence(blocker || driver)}看作风险提醒，不能据此诊断、承诺疗效或预测医学结果；真正的判断必须回到症状、检查与医生意见。`
  } else if (profile.guarded) {
    thesis = `卦上，${axisEvidence(driver)}；同时${axisEvidence(blocker)}。这些只能用来整理风险和核查重点，不能替代现实证据、专业评估或必要处置。`
  } else if (profile.negativeOutcome) {
    thesis = total <= -2
      ? `卦上，${axisEvidence(blocker)}，所以疑点偏强；但这仍只是风险信号，不足以据此认定${profile.result}已经发生。`
      : `卦上未见足以坐实${profile.result}的完整证据链。即使${axisEvidence(blocker)}，也只能说明关系中有卡点，不能把疑点直接当事实。`
  } else if (driver && driver.value > 0 && blocker && blocker.value < 0) {
    thesis = `卦上，${axisEvidence(driver)}，这是可用的支点；但${axisEvidence(blocker)}，这是当前卡点。${profile.result}并非全无机会，成败取决于能否先解后者。`
  } else if (blocker && blocker.value < 0) {
    thesis = `当前主要矛盾是${axisEvidence(blocker)}。若这一点不改变，其他吉象也难把${profile.result}落到实处。`
  } else if (driver && driver.value > 0) {
    thesis = `${axisEvidence(driver)}，这是${profile.result}最有力的支点。卦上已有承接，但仍须以现实行动确认，不能把有利之象当成既成结果。`
  } else {
    thesis = `${profile.result}目前没有出现一锤定音的力量，关键条件彼此牵制。此时最重要的不是继续问吉凶，而是找出哪一项现实条件先发生变化。`
  }
  const mode = judgment.parsed && judgment.parsed.mode
  const deepTone = toneFromDeepTotal(total)
  const replyTone = profile.negativeOutcome ? invertTone(deepTone) : deepTone
  const keepGuardedReply = profile.safe || profile.guarded || ['when', 'where', 'who', 'choice'].includes(mode)
  const answer = keepGuardedReply
    ? judgment.reply
    : directReply(judgment.parsed, replyTone, Math.abs(total) < 3 ? `偏·${summary}` : summary, {
      place: judgment.place,
      whenHint: judgment.whenHint,
      clockHint: judgment.clockHint,
      whoHint: judgment.whoHint,
      choicePick: judgment.choicePick,
      outcomeTone: deepTone
    })
  const action = tailoredAction(ctx, profile, driver, blocker)
  return { profile, axes, total, tone: deepTone, summary, thesis, answer, driver, blocker, action }
}

function classicLanding(text, deep, axis) {
  const raw = String(text || '')
  const anchor = axis ? axis.label : ((deep.blocker && deep.blocker.value < 0) ? deep.blocker.label : (deep.driver && deep.driver.label))
  const target = anchor ? `“${anchor}”` : `“${deep.profile.result}”`
  if (/利见大人/.test(raw)) return `据此辞看${target}：关键要通过有决定权的人、正式制度或专业帮助来解决。`
  if (/朋来|得朋/.test(raw)) return `据此辞看${target}：困局的转机来自可信同伴或内部助力，不宜独力硬撑。`
  if (/有孚/.test(raw)) {
    if (deep.profile.kind === 'lost') return `据此辞看${target}：方位、最后动线与现场物象能够前后相应时，查找范围才可由宽转窄。`
    if (deep.profile.kind === 'lawsuit') return `据此辞看${target}：以证据、书面记录和程序事实为凭，不能只凭口头说法。`
    if (deep.profile.kind === 'wealth' || deep.profile.kind === 'receivable') return `据此辞看${target}：先看财爻能否由虚转实，再看对方是否真正发动；不能只凭一句承诺判断财会到手。`
    if (deep.profile.kind === 'investment') return `据此辞看${target}：收益之象须前后相应，卦可提示进退，但不能替代风险与退出判断。`
    if (/^emotion/.test(deep.profile.kind)) return `据此辞看${target}：真心要由持续行动兑现，不能只听一时表态。`
    return `据此辞看${target}：关键在言行相符、前后相应，事情才会由虚转实。`
  }
  if (/勿用|不利|征凶|凶|厉|灾|眚/.test(raw)) return `据此辞看${target}：条件未稳时不可硬推，先除去已经显出的风险。`
  if (/利涉大川|利有攸往/.test(raw)) return `据此辞看${target}：可以行动，但要有明确路径、准备和承担，不宜盲动。`
  if (/贞吉|利贞|安贞|无咎/.test(raw)) return `据此辞看${target}：守规则、守承诺并按次序推进，吉意才有落处。`
  if (/悔|吝/.test(raw)) return `据此辞看${target}：已有偏差仍可修正，但拖延或固执会把小问题累积成后悔。`
  if (/亨|吉|元亨/.test(raw)) return `据此辞看${target}：通达条件已经出现，但必须化为具体行动，不能只取“吉”字。`
  return `此辞重在辨明${target}所处阶段，再定进退。`
}

function classicMeaning(text, judgment) {
  const parsed = judgment.parsed || {}
  const focus = parsed.focus || '所问之事'
  const raw = String(text || '')
  let principle = ''
  if (/勿用|不利|征凶|凶|厉|灾|眚/.test(raw)) {
    principle = '经文主戒进与防失，眼下不宜凭一时冲动强求。'
  } else if (/利见大人|利有攸往|利涉大川/.test(raw)) {
    principle = '经文提示可借助可信之人、制度或成熟路径推动，不宜独断。'
  } else if (/贞吉|利贞|安贞|无咎/.test(raw)) {
    principle = '经文所许不在侥幸，而在守正、守约、按次序行事。'
  } else if (/悔|吝/.test(raw)) {
    principle = '经文提示已有偏差，但及时收敛、纠正，仍可减少后悔。'
  } else if (/亨|吉|元亨/.test(raw)) {
    principle = '经文显示有通达条件，可以推进，但吉意须靠行动落实。'
  } else {
    principle = '经文重在审时度势：看清所处阶段，再决定进退。'
  }

  let landing = ''
  if (parsed.domain === 'emotion') landing = `落到「${focus}」，应看对方是否持续回应，而不是只听一时表态。`
  else if (['wealth', 'invest', 'property'].includes(parsed.domain)) landing = `落到「${focus}」，先核现金、合同、成本与退出条件，再谈得失。`
  else if (['career', 'exam'].includes(parsed.domain)) landing = `落到「${focus}」，关键在资格、文书、节点和能真正作主的人。`
  else if (parsed.domain === 'lawsuit') landing = `落到「${focus}」，证据、程序和时限比口头胜负更要紧。`
  else if (parsed.domain === 'health' || parsed.domain === 'pregnancy') landing = `落到「${focus}」，宜把提醒转为检查、复诊和照护，不以吉凶替代医学判断。`
  else if (parsed.domain === 'lost') landing = `落到「${focus}」，应按动线、时间点和可核实线索立即排查。`
  else if (parsed.domain === 'travel' || parsed.domain === 'weather') landing = `落到「${focus}」，以行程、天气和现场信息校正卦上提示。`
  else landing = `落到「${focus}」，先处理最关键且可控的一步，再观察局势是否应卦。`
  return principle + landing
}

function classicItems(ctx, judgment, deep) {
  const { ben, bian, primaryYong } = ctx
  const benCi = guaCiOf(ben)
  const bianCi = guaCiOf(bian)
  const moving = (ben && ben.yaos ? ben.yaos : []).filter((y) => y.changing)
  const picked = moving.slice().sort((a, b) => {
    const score = (y) => (deep && deep.axes.some((axis) => axis.line && axis.line.index === y.index) ? 10 : 0)
      + (primaryYong && y.index === primaryYong.index ? 6 : 0)
      + (y.role === '世' || y.role === '应' ? 3 : 0)
      + (y.wangshuai === '旺' || y.wangshuai === '相' ? 1 : 0)
    return score(b) - score(a)
  }).slice(0, 1)
  const items = []
  if (benCi && benCi.guaci) {
    items.push(`本卦《${ben.alias || ben.name}》：“${benCi.guaci}”`)
    items.push(classicLanding(benCi.guaci, deep, null))
  }
  picked.forEach((y) => {
    const line = benCi && benCi.yaoci ? benCi.yaoci[y.index] : ''
    if (line) {
      const axis = deep && deep.axes.find((item) => item.line && item.line.index === y.index)
      items.push(`关键动爻${axis ? `（${axis.label}）` : ''}：${line}`)
      items.push(classicLanding(line, deep, axis || null))
    }
  })
  if (bian && bianCi && bianCi.guaci) {
    items.push(`变卦《${bian.alias || bian.name}》：“${bianCi.guaci}”`)
    const landingAxis = (deep.blocker && deep.blocker.value < 0) ? deep.blocker : deep.driver
    const image = bianCi.nameWhy ? `${bianCi.nameWhy}` : ''
    items.push(`后势取象：${image}${classicLanding(bianCi.guaci, deep, landingAxis)}`)
  }
  return uniqueText(items).slice(0, 6)
}

function keyEvidenceItems(ctx) {
  const { topic, primaryYong, yongList, fu, shi, ying, ben, relations, yinPattern } = ctx
  const items = []
  const y = primaryYong || (yongList && yongList[0])
  if (y) {
    const state = [y.wangshuai, y.kong ? '空亡' : '', y.changing ? '发动' : ''].filter(Boolean).join('、')
    let line = `用神「${topic.yongshen}」落${yaoName(y)}，当前${state || '平常'}`
    if (y.changeTo) line += `，并化${y.changeTo.text}`
    items.push(line + '。')
  } else if (fu) {
    items.push(`用神「${topic.yongshen}」伏藏，事情尚未完全显露；须待引出或冲开后才容易落实。`)
  } else if (topic.yongshen !== '世爻') {
    items.push(`用神「${topic.yongshen}」未现，说明题中条件尚未齐备，不宜过早下死结论。`)
  }
  if (shi && ying && topic.useShiYing) {
    const sy = relationWuxing(shi.wuxing, ying.wuxing)
    items.push(`世应关系为「${sy}」：${SY_PLAIN[sy] || '双方力量需结合具体爻位判断'}。`)
  }
  const moving = (ben && ben.yaos ? ben.yaos : []).filter((item) => item.changing)
  if (!moving.length) {
    items.push('六爻俱静，局面短期不易骤变，成败更取决于现有条件是否成熟。')
  } else {
    const relevant = relations && relations.links
      ? relations.links.find((link) => y && (link.to.index === y.index || link.from.index === y.index))
      : null
    items.push(relevant
      ? `关键变化：${relevant.text}，这是推动或牵制所问的直接力量。`
      : `${moving.length}爻发动，事情已进入变化期；以关键动爻和变卦定后势。`)
  }
  if (yinPattern && yinPattern.fanYin) items.push('卦见反吟，过程容易反复，口头承诺须等事实落地。')
  if (yinPattern && yinPattern.fuYin) items.push('卦见伏吟，局面容易停滞或原地打转，宜主动改变条件。')
  return uniqueText(items).slice(0, 4)
}

function timingSummary(ctx, judgment) {
  const parsed = judgment.parsed || {}
  const items = []
  if (parsed.mode === 'when') {
    if (parsed.whenKind === 'clock' && judgment.clockHint) items.push(`重点时段：${judgment.clockHint}。`)
    else (judgment.timingTips || []).slice(0, 2).forEach((tip) => items.push(tip))
  } else {
    const y = ctx.primaryYong || (ctx.yongList && ctx.yongList[0])
    if (y && y.kong) items.push(`用神逢空，宜等「${y.zhi}」出空或被冲实后再看落实。`)
    if (y && y.dayMonth && y.dayMonth.heRi) items.push('用神被合住，当前有牵绊；待破合时更容易有明确进展。')
    if (y && y.dayMonth && y.dayMonth.chongRi) items.push('日辰冲动用神，近期容易出现消息或转折。')
    if (!ctx.changingIndexes.length) items.push('静卦主缓，先看既定节奏，不宜频繁催逼或重复起卦。')
  }
  return uniqueText(items).slice(0, 2)
}

function shortGuaName(gua) {
  if (!gua) return ''
  return gua.alias || gua.shortName || String(gua.name || '').replace(/^[乾坤震巽坎离艮兑天地雷风水火山泽]{2}/, '') || gua.name || ''
}

function hexagramTheme(gua) {
  const name = shortGuaName(gua)
  return HEXAGRAM_THEME[name] || '先辨清眼下所处的时位，再决定应进还是应守'
}

function naturalAxisFact(axis) {
  if (!axis) return ''
  const power = axis.line ? linePower(axis.line) : 0
  const at = axis.line ? `，所落之爻力量${power >= 1 ? '较足' : power <= -1 ? '偏弱' : '平常'}` : ''
  const riskAt = axis.line ? `，其象${power >= 1 ? '较强' : power <= -1 ? '偏弱' : '尚未坐实'}` : ''
  if (axis.polarity === 'risk') {
    if (axis.value <= -1) return `${axis.label}已经形成牵制${riskAt}`
    if (axis.value >= 1) return `${axis.label}虽有其象，但眼下力量有限`
    return `${axis.label}仍是隐忧，却还没有强到足以定局`
  }
  if (axis.value >= 2) return `${axis.label}这一边最有力${at}`
  if (axis.value >= 1) return `${axis.label}已有支撑${at}`
  if (axis.value <= -2) return `${axis.label}明显接不住${at}`
  if (axis.value <= -1) return `${axis.label}仍偏弱${at}`
  return `${axis.label}尚未显出明确倾向`
}

function domainOutcome(profile, total) {

  const table = {

    career: { good: '机会有望从接触走向真正落位', mid: '机会与职位名分还没有同步', bad: '短期难见明确落位，强争反而更耗' },
    wealth: { good: '财势有聚拢的可能', mid: '有财机，但从机会到进账还隔着一层', bad: '财气容易被拖延、分耗或落空' },
    receivable: { good: '款项并非无望，更像迟中有回', mid: '钱与付款动作尚未接上', bad: '回款容易继续拖延，甚至出现折减' },
    investment: { good: '传统象意偏顺，但收益仍有条件', mid: '进退得失尚未拉开', bad: '风险一侧更重，不宜因一时之象加码' },
    exam: { good: '已有过关或取得进展的基础', mid: '能力与结果之间还差临门一环', bad: '眼下短板更容易影响结果' },
    'research-paper': { good: '稿件仍有被接住和继续推进的可能', mid: '论文价值与评审门槛尚在拉扯', bad: '关键质疑若不解，结果难以扭转' },
    'research-project': { good: '方案有继续推进并形成结果的空间', mid: '方法、资源与结果还没有真正合拢', bad: '根本条件不足，全面铺开只会增加消耗' },
    document: { good: '审批或文书事项有望继续过关', mid: '材料与决定节点尚未衔接', bad: '程序阻力仍重，短期不易放行' },
    lawsuit: { good: '传统象意稍有承接，但不能据此预断输赢', mid: '双方力量仍在拉扯，胜负不可由卦代断', bad: '风险压力偏重，更应回到法律程序处置' },
    family: { good: '家事仍有缓和与重新协调的余地', mid: '各方立场尚未真正安定', bad: '矛盾短期容易继续累积' },
    health: { good: '传统象意稍见缓和，但不构成医学判断', mid: '卦上轻重未定，仍须以检查和医生意见为准', bad: '卦只提示应提高警觉，不能据此判断病情' },
    travel: { good: '行程有望启动并逐步顺开', mid: '人想动，但路线或接应还没有接好', bad: '延误与阻隔偏重，宜先缓一步' },
    social: { good: '双方有重新接上或见面的可能', mid: '有往来之意，尚未化成明确行动', bad: '对方动作偏弱，空等难有结果' },
    delivery: { good: '流转仍在继续，后续有到达可能', mid: '物品尚在途中或节点之间', bad: '滞留、错转或延误的可能偏高' },
    lost: { good: '线索仍能收拢，所寻之物并非全无着落', mid: '线索有方向，但范围还没有缩到一点', bad: '遮蔽较重，短期查找会费周折' },
    home: { good: '家宅之事有安定或改善的空间', mid: '房屋条件与居住感受尚在权衡', bad: '隐患一侧偏重，不宜仓促落定' },
    weather: { good: '传统天气象偏向所问变化', mid: '天气之象尚不集中', bad: '所问天气变化的象偏弱或受阻' },
    choice: { good: '局面允许往前试一步', mid: '两个方向尚未拉开明显差距', bad: '眼下不适合做不可逆的重注' },
    general: { good: '事情已有可以借力向前的地方', mid: '几股力量互相牵制，尚未定局', bad: '阻力暂时压过助力，硬推不利' }
  }
  let key = kind
  if (/^emotion/.test(kind)) key = 'emotion'
  else if (['wealth'].includes(kind)) key = 'wealth'
  else if (!table[key]) key = 'general'
  return table[key][tone]
}

function narrativeHeadline(judgment, deep) {
  const mode = judgment.parsed && judgment.parsed.mode
  if (deep.profile.safe || deep.profile.guarded || ['where', 'when', 'who', 'choice'].includes(mode)) return deep.summary
  if (deep.profile.negativeOutcome) return deep.summary
  if (deep.total >= 3) return '可望推进，但宜循序而进'
  if (deep.total >= 1) return '有转机，尚未完全落定'
  if (deep.total <= -3) return '眼下难进，宜先退后谋'
  if (deep.total <= -1) return '阻力偏重，不宜硬推'
  return '局面未定，关键在下一步'
}

function narrativeDirectAnswer(judgment, deep) {
  const parsed = judgment.parsed || {}
  const focus = parsed.focus || deep.profile.result || '这件事'
  const mode = parsed.mode || 'outlook'
  if (deep.profile.safe || deep.profile.guarded || deep.profile.negativeOutcome || ['where', 'when', 'who', 'choice'].includes(mode)) return deep.answer
  if (mode === 'yesno') {
    if (deep.total >= 2) return `“${focus}”偏向能成，但仍要经过眼前这一处转折。`
    if (deep.total <= -2) return `“${focus}”眼下偏难，继续硬推只会增加消耗。`
    return `“${focus}”目前还不能断成或不成，关键条件尚未接上。`
  }
  if (mode === 'jixiong') {
    if (deep.total >= 2) return `“${focus}”利多于弊，但吉处有条件。`
    if (deep.total <= -2) return `“${focus}”阻力重于助力，宜收不宜放。`
    return `“${focus}”吉凶相杂，下一步的选择会改变结果。`
  }
  if (mode === 'how') return deep.total >= 2 ? `“${focus}”可以主动推进，但要沿最有力的一环发力。` : deep.total <= -2 ? `“${focus}”先不要正面硬攻，换条件比加力更重要。` : `“${focus}”宜先做一步可回退的试探，再看反馈。`
  return `“${focus}”${domainOutcome(deep.profile, deep.total)}。`
}

function narrativeOpening(ctx, judgment, deep) {
  const focus = (judgment.parsed && judgment.parsed.focus) || deep.profile.result || '所问之事'
  const guaName = shortGuaName(ctx.ben)
  const driver = deep.driver && deep.driver.value > 0 ? deep.driver : null
  const blocker = deep.blocker && deep.blocker.value < 0 ? deep.blocker : null
  let text = `本卦为《${guaName}》，它的主旨是${hexagramTheme(ctx.ben)}。`
  if (driver && blocker && driver.key !== blocker.key) {
    text += `落到你问的“${focus}”，卦里的矛盾不在“全有”或“全无”，而在两股力量还没有接上：${naturalAxisFact(driver)}；但${naturalAxisFact(blocker)}。这正是眼下有机会却还不能直接落定的原因。`
  } else if (blocker) {
    text += `落到你问的“${focus}”，眼下的主因不在运气，而在${naturalAxisFact(blocker)}。这一处不松动，其他吉象也难真正接上。`
  } else if (driver) {
    text += `落到你问的“${focus}”，${naturalAxisFact(driver)}，这是事情能够继续向前的主要支点。`
  } else {
    text += `落到你问的“${focus}”，用神、世应与动爻之间尚未形成一股足以定局的力量，因此现在不宜把一时现象当作最终结果。`
  }
  return text
}

function classicalLineName(y) {
  if (!y) return ''
  const value = y.yinYang ? '九' : '六'
  const position = ['初', '二', '三', '四', '五', '上'][y.index] || ''
  if (y.index === 0 || y.index === 5) return `${position}${value}`
  return `${value}${position}`
}

function keyMovingForNarrative(ctx, deep) {
  const moving = (ctx.ben && ctx.ben.yaos ? ctx.ben.yaos : []).filter((y) => y.changing)
  if (!moving.length) return null
  const related = deep.axes.filter((axis) => axis.line && axis.line.changing).map((axis) => axis.line.index)
  if (ctx.primaryYong && ctx.primaryYong.changing) return ctx.primaryYong
  return moving.find((y) => related.includes(y.index)) || moving[0]
}

function movingMeaning(y) {
  if (!y) return ''
  const parts = []
  const phase = [
    '事情刚起，尚在试探',
    '基础正在形成，还没有走到决定层',
    '事情走到内外转换的关口',
    '外部条件开始真正介入',
    '事情已到决定与落实的位置',
    '事情走到极处，容易转向'
  ][y.index] || '事情正在变化'
  parts.push(phase)
  const a = y.changeTo && y.changeTo.analysis
  if (a && a.jinTui && a.jinTui.type === '化进神') parts.push('又化进，说明后劲强于眼下，常见先小后大')
  else if (a && a.jinTui && a.jinTui.type === '化退神') parts.push('却化退，说明后劲不足，容易先动后缓')
  if (a && a.huiTou && a.huiTou.type === '回头生') parts.push('变化之后反得生扶，转机多在行动以后')
  else if (a && a.huiTou && a.huiTou.type === '回头克') parts.push('变化之后反受克制，启动以后仍会遇到掣肘')
  if (y.kong) parts.push('同时逢空，眼下所见还虚，消息未必马上成为事实')
  if (y.dayMonth && y.dayMonth.heRi) parts.push('又被日辰合住，当前有牵绊，进展不会很快')
  else if (y.dayMonth && y.dayMonth.chongRi) parts.push('又受日辰冲动，近期较容易出现消息或转折')
  return parts.join('；')
}

function processNarrative(ctx, deep) {
  const moving = (ctx.ben && ctx.ben.yaos ? ctx.ben.yaos : []).filter((y) => y.changing)
  const key = keyMovingForNarrative(ctx, deep)
  let text = ''
  if (!moving.length) {
    text = `六爻俱静，这件事短期不会突然翻转。${deep.total >= 2 ? '有利条件可以维持，但进展多半是缓慢累积。' : deep.total <= -2 ? '眼前阻力仍会延续，先改变条件比反复催促更重要。' : '局面更像维持现状，真正变化要等外部条件介入。'}`
  } else if (key) {
    text = `关键变化落在${classicalLineName(key)}。${movingMeaning(key)}。`
    if (moving.length > 1) text += `全卦共有${moving.length}爻发动，说明事情不是一条直线推进，还会有其他环节先后加入。`
  }
  if (ctx.yinPattern && ctx.yinPattern.fanYin) text += '卦又见反吟，过程容易往返；一次好转或一次受阻，都不能当作最终结果。'
  else if (ctx.yinPattern && ctx.yinPattern.fuYin) text += '卦又见伏吟，变化多在原处酝酿；若现实条件不变，局面容易反复停在同一点。'
  if (ctx.bian) {
    text += `事情往后变为《${shortGuaName(ctx.bian)}》，后势的重点是${hexagramTheme(ctx.bian)}。`
  }
  return text
}

function naturalClassicBridge(raw, profile, gua) {
  const text = String(raw || '')
  if (/利见大人/.test(text)) return '这不是泛泛地说“找贵人”，而是说转机要经过真正能作主、能承担结果的人。'
  if (/朋来|得朋/.test(text)) return '它指向同道相助：靠可信的配合，比一个人硬撑更容易打开局面。'
  if (/有孚/.test(text)) {
    if (profile.kind === 'lost') return '这里的“孚”是线索前后相应；方位、动线与现场物象能够互相印证，范围才会收窄。'
    if (/^emotion/.test(profile.kind)) return '这里的“孚”是心意能够见于持续行动，不是一时说得好听。'
    if (['wealth', 'receivable'].includes(profile.kind)) return '这里的“孚”是财与行动能够真正相接；财爻有气还要看对方是否发动。'
    return '这里的“孚”是内外相应、言行相符，事情才会由虚转实。'
  }
  if (/勿用|不利|征凶|凶|厉|灾|眚/.test(text)) return '经文所戒的不是永远不能做，而是眼下时位不对，继续硬推会把小阻力放大。'
  if (/利涉大川|利有攸往/.test(text)) return '经文许其前往，但前提是路径清楚、准备足够，不能把“可行”理解成“可以冒进”。'
  if (/贞吉|利贞|安贞|无咎/.test(text)) return '吉处落在守正与守序；做法不偏，才能把卦里的有利条件接住。'
  if (/悔|吝/.test(text)) return '它说明已有偏差，但还来得及调整；越早回头，代价越小。'
  if (/亨|吉|元亨/.test(text)) return '卦里确有可通之处，但“吉”只说明有路，不等于结果已经到手。'
  return `这句不能只按表面的吉凶来读，它把《${shortGuaName(gua)}》的主旨落到了这一爻：${hexagramTheme(gua)}。`
}

function classicQuote(text) {
  return String(text || '').replace(/[。；;，,]+$/g, '')
}

function classicNarrative(ctx, deep) {
  const benCi = guaCiOf(ctx.ben)
  if (!benCi) return ''
  const key = keyMovingForNarrative(ctx, deep)
  const line = key && benCi.yaoci ? benCi.yaoci[key.index] : ''
  if (line) {
    return `本卦卦辞为“${classicQuote(benCi.guaci)}”，但真正主变化的是${classicalLineName(key)}。爻辞说“${classicQuote(line)}”。${naturalClassicBridge(line || benCi.guaci, deep.profile, ctx.ben)}`
  }
  if (benCi.guaci) {
    return `此卦没有动爻，主要依本卦卦辞“${classicQuote(benCi.guaci)}”来定调。${naturalClassicBridge(benCi.guaci, deep.profile, ctx.ben)}`
  }
  return ''
}

function locationNarrative(ctx, deep) {
  const y = ctx.primaryYong || (ctx.yongList && ctx.yongList[0]) || (deep.driver && deep.driver.line) || ctx.ying
  if (!y) return ''
  const dir = y.zhi && ZHI_DIR[y.zhi]
  const trigram = ctx.ben && (y.index <= 2 ? ctx.ben.lower : ctx.ben.upper)
  const guaName = trigram && trigram.name
  const guaDir = guaName && GUA_DIR[guaName]
  const scene = guaName && GUA_SCENE[guaName]
  const range = y.index <= 1 ? '范围偏近、偏内，多在身边或原有环境' : y.index <= 3 ? '范围在内外交界，常见门口、通道或往返动线' : '范围偏外、偏远，也可能在较高位置或由他人经手'
  if (!dir && !guaDir) return ''
  let text = `方位以${classicalLineName(y)}${y.zhi ? `临“${y.zhi}”` : ''}为主，先看${dir || guaDir}`
  if (guaDir && guaDir !== dir) text += `；它所在的${guaName}卦取${guaDir}，作为相邻方向和环境的辅助，不与主方向硬拼`
  if (scene) text += `。${guaName}象还指向${scene}`
  text += `。从爻位看，${range}。`
  return text
}

function timeNarrative(ctx, judgment) {
  const parsed = judgment.parsed || {}
  const y = ctx.primaryYong || (ctx.yongList && ctx.yongList[0])
  if (parsed.mode === 'when') {
    if (parsed.whenKind === 'clock' && judgment.clockHint) return `时段上重点留意${judgment.clockHint}，这是用神或动爻地支所对应的时辰范围，不是精确到分钟。`
    if (judgment.whenHint) return `应期不取一个死日期，先看${judgment.whenHint}；若此前条件没有变化，时间仍会顺延。`
  }
  if (y && y.kong) return `时间上不会立刻落实。用神逢空，要等“${y.zhi}”出空或被冲实后，事情才更容易由虚转实。`
  if (y && y.dayMonth && y.dayMonth.heRi) return '时间上当前仍被牵住，等破合之后，进展会比现在明显。'
  if (y && y.dayMonth && y.dayMonth.chongRi) return '日辰已经冲动用神，消息或转折偏近，近期比远期更值得留意。'
  return ''
}

function adviceNarrative(ctx, deep) {
  if (deep.profile.safe || deep.profile.guarded || deep.profile.negativeOutcome) return deep.profile.action
  const kind = deep.profile.kind || 'general'
  const action = deep.profile.action || ''
  if (/^emotion/.test(kind)) return `先不要继续猜对方心意，把卦里的“有无”交给一次具体行动验证。${action}`
  if (kind === 'career') return `眼下不宜同时追逐多个可能，先让机会从口头认可变成明确的位置和节点。${action}`
  if (['wealth', 'receivable'].includes(kind)) return `财上要先分清“看见机会”与“真正落袋”，不要被表面的热度带着走。${action}`
  if (kind === 'investment') return `先把可得与可失分开，不因卦象偏顺就放大投入。${action}`
  if (['exam', 'research-paper', 'research-project', 'document'].includes(kind)) return `不要平均用力，先处理最可能改变结果的一环。${action}`
  if (kind === 'lost') return `不要漫无目的扩大查找范围，先按主方向和内外交界处查一轮，再沿最后动线往回收。${action}`
  if (kind === 'family') return `先把家事拆开，不要试图一次说清所有旧账。${action}`
  if (kind === 'travel') return `这卦更重行程是否真正接上，不在于勉强赶路。${action}`
  const driver = deep.driver && deep.driver.value > 0 ? deep.driver : null
  const blocker = deep.blocker && deep.blocker.value < 0 ? deep.blocker : null
  let lead = ''
  if (driver && blocker && driver.key !== blocker.key) {
    lead = `现在不要平均用力。先处理${blocker.label}，待这一处不再牵制，再顺着${driver.label}推进；顺序颠倒，越用力越容易空耗。`
  } else if (blocker) {
    lead = `眼下先别急着求结果，先把${blocker.label}这一处松开；它不变，局面就难变。`
  } else if (driver) {
    lead = `可以往前走，但要沿着${driver.label}这一支点发力，不必同时铺开所有方向。`
  } else {
    lead = '此时最合适的是做一步可观察、可回退的动作，让现实反馈替你缩小判断范围。'
  }
  return `${lead}${action}`
}

function progressSectionTitle(kind) {
  if (/^emotion/.test(kind)) return '这段关系会怎样走'
  if (kind === 'career') return '事业上的转折在哪里'
  if (['wealth', 'receivable', 'investment'].includes(kind)) return '财势接下来如何变化'
  if (['exam', 'research-paper', 'research-project', 'document'].includes(kind)) return '成败会落在哪一环'
  if (kind === 'lost') return '线索会怎样收拢'
  if (kind === 'travel') return '行程会怎样发展'
  if (kind === 'family') return '家事会怎样演变'
  return '事情接下来会怎样'
}

function adviceSectionTitle(kind) {
  if (/^emotion/.test(kind)) return '这段关系如何拿捏'
  if (kind === 'career') return '此时宜进还是宜守'
  if (['wealth', 'receivable', 'investment'].includes(kind)) return '财上如何取舍'
  if (kind === 'lost') return '查找应从哪里下手'
  if (kind === 'family') return '家事如何处置'
  return '你现在最该做什么'
}

function buildConciseSections(ctx, judgment) {
  const deep = buildDeepReading(ctx, judgment)
  deep.summary = narrativeHeadline(judgment, deep)
  deep.thesis = narrativeOpening(ctx, judgment, deep)
  deep.answer = narrativeDirectAnswer(judgment, deep)
  deep.action = adviceNarrative(ctx, deep)
  deep.pointer = ''
  const sections = []
  const process = processNarrative(ctx, deep)
  if (process) sections.push({ title: progressSectionTitle(deep.profile.kind), items: [process] })
  const classic = classicNarrative(ctx, deep)
  if (classic) sections.push({ title: '卦爻为什么这样说', items: [classic] })
  const parsed = judgment.parsed || {}
  const hints = []
  let hasPlace = false
  let hasTime = false
  if (parsed.mode === 'where' || deep.profile.kind === 'lost') {
    const place = locationNarrative(ctx, deep)
    if (place) { hints.push(place); hasPlace = true }
  }
  if (parsed.mode === 'when') {
    const time = timeNarrative(ctx, judgment)
    if (time) { hints.push(time); hasTime = true }
  } else if (parsed.mode !== 'where') {
    const time = timeNarrative(ctx, judgment)
    if (time) { hints.push(time); hasTime = true }
  }
  if (hints.length) sections.push({ title: hasPlace && hasTime ? '方位、范围与应期' : hasPlace ? '方位与范围' : '应期怎么看', items: hints })
  sections.push({
    title: adviceSectionTitle(deep.profile.kind),
    items: [deep.action]
  })
  return { sections, deep }
}

function buildPlainLead(topic, judgment, yongList, fu, changingIndexes, yinPattern) {
  const lines = []
  if (judgment.reply) lines.push(judgment.reply)
  lines.push(judgment.judgment)
  lines.push(judgment.advice)

  const focus = (judgment.parsed && judgment.parsed.focus) || topic.label
  const modeLabel = (judgment.parsed && judgment.parsed.modeLabel) || '走势'
  lines.push(`本题按「${modeLabel}」断「${focus}」，类别「${topic.label}」，主盯「${topic.yongshen === '世爻' ? '世应' : topic.yongshen}」。`)

  if (judgment.parsed && judgment.parsed.mode === 'when' && judgment.timingTips) {
    if (judgment.parsed.whenKind === 'clock' && judgment.clockHint) {
      lines.push(`时刻象意：${judgment.clockHint}。`)
    } else {
      judgment.timingTips.slice(0, 4).forEach((t) => lines.push(t))
    }
  }
  if (judgment.parsed && judgment.parsed.mode === 'where' && judgment.placeTips) {
    judgment.placeTips.slice(0, 4).forEach((t) => lines.push(t))
  }
  if (judgment.parsed && judgment.parsed.mode === 'who' && judgment.whoHint) {
    lines.push(`人物象：${judgment.whoHint}。`)
  }
  if (judgment.parsed && judgment.parsed.mode === 'choice' && judgment.parsed.choice) {
    lines.push(`选项：「${judgment.parsed.choice.a}」／「${judgment.parsed.choice.b}」。`)
  }

  if (yongList.length) lines.push(`与「${focus}」对应的用神：${yongList.map(yaoName).join('、')}。`)
  else if (fu) lines.push(`与「${focus}」对应的用神暂时伏藏。`)

const YAO_CN = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻']

function lunarLeapMonth(year) {
  return LUNAR_INFO[year - 1900] & 0xf
}

function lunarMonthDays(year, month) {
  return (LUNAR_INFO[year - 1900] & (0x10000 >> month)) ? 30 : 29
}

function lunarLeapDays(year) {
  const leap = lunarLeapMonth(year)
  if (!leap) return 0
  return (LUNAR_INFO[year - 1900] & 0x10000) ? 30 : 29
}

function lunarYearDays(year) {
  let sum = 0
  for (let month = 1; month <= 12; month += 1) sum += lunarMonthDays(year, month)
  return sum + lunarLeapDays(year)
}

function solarToLunar(dateInput) {
  const date = dateInput instanceof Date ? dateInput : new Date(dateInput)
  if (Number.isNaN(date.getTime())) throw new Error('时间无效')
  const solarYear = date.getFullYear()
  if (solarYear < 1900 || solarYear > 2100) throw new Error('时间起卦仅支持 1900–2100 年')
  const base = Date.UTC(1900, 0, 31)
  const current = Date.UTC(solarYear, date.getMonth(), date.getDate())
  if (current < base) throw new Error('时间起卦仅支持 1900-01-31 至 2100-12-31')
  let offset = Math.floor((current - base) / 86400000)
  let year = 1900
  while (year <= 2100) {
    const days = lunarYearDays(year)
    if (offset < days) break
    offset -= days
    year += 1
  }
  if (year > 2100) throw new Error('时间超出农历换算范围')
  const leap = lunarLeapMonth(year)
  for (let month = 1; month <= 12; month += 1) {
    const normalDays = lunarMonthDays(year, month)
    if (offset < normalDays) return { year, month, day: offset + 1, isLeap: false }
    offset -= normalDays
    if (month === leap) {
      const leapDays = lunarLeapDays(year)
      if (offset < leapDays) return { year, month, day: offset + 1, isLeap: true }
      offset -= leapDays
    }
  }
  throw new Error('农历换算失败')
}

function mod8(n) {
  const v = ((Number(n) % 8) + 8) % 8
  return v === 0 ? 8 : v
}

function mod6(n) {
  const v = ((Number(n) % 6) + 6) % 6
  return v === 0 ? 6 : v
}

function numToTrigram(n) {
  const key = XIAN_TIAN_NUM[mod8(n)]
  return { ...TRIGRAMS[key], xiantian: XIAN_TIAN_NAME[key] }
}

function linesKey(lines) {
  return lines.map((v) => (v ? '1' : '0')).join('')
}

function getGuaName(lines) {
  return GUA64_NAMES[linesKey(lines)] || { name: '未知卦', alias: '未知' }
}

function packGua(upper, lower) {
  const lines = lower.lines.concat(upper.lines)
  const info = getGuaName(lines)
  return {
    lines,
    name: info.name,
    alias: info.alias,
    upper,
    lower,
    text: `${upper.symbol}${upper.name}${upper.nature}／${lower.symbol}${lower.name}${lower.nature}`
  }
}

function flipLine(v) {
  return v ? 0 : 1
}

/** 互卦：二三四为下，三四五为上（下标 0=初） */
function buildHuGua(lines) {
  const lower = [lines[1], lines[2], lines[3]]
  const upper = [lines[2], lines[3], lines[4]]
  return packGua(
    { ...TRIGRAMS[linesToTrigramKey(upper)], xiantian: XIAN_TIAN_NAME[linesToTrigramKey(upper)] },
    { ...TRIGRAMS[linesToTrigramKey(lower)], xiantian: XIAN_TIAN_NAME[linesToTrigramKey(lower)] }
  )
}

function buildBianGua(lines, dongIndex0) {
  const next = lines.slice()
  next[dongIndex0] = flipLine(next[dongIndex0])
  const lowerKey = linesToTrigramKey(next.slice(0, 3))
  const upperKey = linesToTrigramKey(next.slice(3, 6))
  return packGua(
    { ...TRIGRAMS[upperKey], xiantian: XIAN_TIAN_NAME[upperKey] },
    { ...TRIGRAMS[lowerKey], xiantian: XIAN_TIAN_NAME[lowerKey] }
  )
}

/**
 * 体用：动爻在下卦（初二三）→ 下为用、上为体；在上卦（四五上）→ 上为用、下为体
 */
function resolveTiYong(ben, dongYao1to6) {
  const dongInLower = dongYao1to6 <= 3
  const ti = dongInLower ? ben.upper : ben.lower
  const yong = dongInLower ? ben.lower : ben.upper
  return {
    ti,
    yong,
    tiSide: dongInLower ? '外卦（上）' : '内卦（下）',
    yongSide: dongInLower ? '内卦（下）' : '外卦（上）',
    rule: dongInLower
      ? '动爻在内卦，故内卦为用、外卦为体'
      : '动爻在外卦，故外卦为用、内卦为体'
  }
}

function tiYongVerdict(tiWx, yongWx) {
  const rel = relationWuxing(tiWx, yongWx)
  // relationWuxing(a,b): a相对b — 生=a生b, 被生=b生a, 克=a克b, 被克=b克a
  // 这里传入 (体, 用)：体生用 / 用生体 …
  if (rel === '被生') {
    return {
      rel: '用生体',
      level: '可成',
      tone: 'good',
      note: '用卦来生体卦：事体或外力在帮你，所问之事宜推进、偏可成。'
    }
  }
  if (rel === '生') {
    return {
      rel: '体生用',
      level: '耗力偏难',
      tone: 'bad',
      note: '体卦去生用卦：主体被事体耗泄。传统以此为不利，宜先保全自身、补足条件，勿硬撑。'
    }
  }
  if (rel === '克') {
    return {
      rel: '体克用',
      level: '可制',
      tone: 'good',
      note: '体卦克用卦：你能压住事体或对方，所问偏能拿住，但往往要费一番力气。'
    }
  }
  if (rel === '被克') {
    return {
      rel: '用克体',
      level: '难成',
      tone: 'bad',
      note: '用卦来克体卦：事体或外力压你，所问阻力大，宜缓或改道，勿硬顶。'
    }
  }
  return {
    rel: '体用比和',
    level: '比和可成',
    tone: 'good',
    note: '体用五行相同：同气相应，传统以比和为吉；仍须守常而行，不因象吉而冒进。'
  }
}

function describeGua(g) {
  const ci = getGuaCi(g.alias)
  const items = [
    `卦名「${g.name}」${g.alias && g.alias !== g.name ? `（${g.alias}）` : ''}：${g.text}。`
  ]
  if (ci && ci.nameWhy) items.push(ci.nameWhy)
  if (ci && ci.guaci) items.push(`卦辞：${ci.guaci}`)
  return items
}

function sideGua(huOrBian, tiYong, which) {
  const side = which === 'ti' ? tiYong.tiSide : tiYong.yongSide
  return side.indexOf('外') >= 0 ? huOrBian.upper : huOrBian.lower
}

function meihuaEvidence(cast, huVerdict, bianVerdict) {
  const { ben, tiYong, verdict, dongYao } = cast
  return [
    `本卦${ben.name}`,
    `体${tiYong.ti.name}${tiYong.ti.wuxing}/用${tiYong.yong.name}${tiYong.yong.wuxing}`,
    verdict.rel,
    `动${YAO_CN[dongYao - 1]}`,
    `互${huVerdict.rel}`,
    `变${bianVerdict.rel}`
  ].join('；')
}

function meihuaPlace(cast) {
  const yongDir = GUA_DIR[cast.tiYong.yong.name] || ''
  const tiDir = GUA_DIR[cast.tiYong.ti.name] || ''
  return yongDir || tiDir || ''
}

function meihuaWhenHint(cast, tone, whenKind) {
  if (whenKind === 'clock') {
    // 动爻序号没有公认的一一对应钟点表，不在这里伪造精确时段。
    return ''
  }
  const bits = []
  if (cast.calendar && cast.calendar.day && cast.calendar.day.zhi) {
    bits.push(`对照「${cast.calendar.day.zhi}」日支与体用顺逆`)
  }
  bits.push(`动在${cast.dongLabel}，变化窗口宜盯近几步`)
  if (tone === 'good') bits.push('用生体或体克用时，近应偏多')
  if (tone === 'bad') bits.push('用克体时宜再等转机，勿钉死最近几天')
  return bits.slice(0, 2).join('；')
}

function meihuaWhoHint(cast) {
  const y = cast.tiYong.yong
  const person = GUA_PERSON[y.name] || `${y.name}卦所象之人`
  const dir = GUA_DIR[y.name] || ''
  return dir ? `${person}（偏${dir}）` : person
}

      : tone === 'bad'
        ? '避凶之道：风险之象偏强，先核事实、留证据、定边界；不以猜疑伤人，也不以侥幸纵患。'
        : '指迷之要：风险未明时，不猜、不纵、不武断；以事实核验和可执行的边界减少后悔。'
  }
  if (parsed && (parsed.domain === 'health' || parsed.domain === 'pregnancy')) {

  }
  if (parsed && parsed.domain === 'weather') {

  }
  if (parsed && parsed.domain === 'lost' && /寻人|人/.test(String(parsed.focus || ''))) {

  if (parsed && parsed.mode === 'choice') {

  }
  if (tone === 'good') {
    return `趋吉之道：顺势而行，却不因一时有利而躁进；守正、守信、留有余地，方能使「${focus}」之吉延续。体得其安，行方能久。`

  return `指迷之要：象在变，事亦在变；先安其心，再辨轻重缓急，对「${focus}」小步求证、随势修正。知进退而守其中，方可少悔。`
}

/** 按所问类型组织梅花明确答复（与六爻同构） */
function buildAskJudgment(cast, huVerdict, bianVerdict) {
  const topic = { label: '梅花所问' }
  const parsed = resolveParsed(cast.question, topic, cast.askMeta)
  let tone = cast.verdict.tone
  let level = cast.verdict.level

  // 互、变参校：过程/结局转逆则略下调，转顺则略上调
  if (tone === 'good' && (huVerdict.tone === 'bad' || bianVerdict.tone === 'bad')) {
    tone = 'mid'
    level = '宜量力'
  } else if (tone === 'bad' && (huVerdict.tone === 'good' || bianVerdict.tone === 'good')) {
    tone = 'mid'
    level = '有转机'
  }
  const answerTone = parsed.mode === 'yesno' && parsed.negativeEvent ? invertTone(tone) : tone

  const place = meihuaPlace(cast)
  const whenHint = meihuaWhenHint(cast, tone, parsed.whenKind)
  const clockHint = parsed.whenKind === 'clock' ? whenHint : ''
  const whoHint = meihuaWhoHint(cast)
  const choicePick = meihuaChoicePick(parsed, tone)
  const evidence = meihuaEvidence(cast, huVerdict, bianVerdict)
  const focus = parsed.focus

  if (parsed.mode === 'when') {
    if (parsed.whenKind === 'clock') {
      level = clockHint
        ? (tone === 'bad' ? `时刻信号弱·${clockHint}` : `时刻偏${clockHint}`)
        : '时刻未明'
    } else if (tone === 'good') level = '应期偏近'
    else if (tone === 'bad') level = '应期迟滞'
    else level = '应期未明'
  } else if (parsed.mode === 'where') {
    level = place ? `方位偏${place}` : '方位未明'
  } else if (parsed.mode === 'jixiong') {
    if (tone === 'good') level = '偏吉'
    else if (tone === 'bad') level = '偏凶'
    else level = '平'
  } else if (parsed.mode === 'who') {
    level = tone === 'good' ? '宜对接' : tone === 'bad' ? '宜慎择' : '宜再观'
  } else if (parsed.mode === 'choice') {
    level = parsed.choice ? '两项待比较' : '选项未明'
  } else if (parsed.mode === 'yesno') {
    level = yesNoLevel(parsed, answerTone, /耗力|有转机/.test(String(level)))
  } else if (parsed.mode === 'degree') {
    if (parsed.domain === 'health' || parsed.domain === 'pregnancy') level = '须医学评估'
    else if (tone === 'good') level = '偏轻'
    else if (tone === 'bad') level = '偏重'
    else level = '轻重未分'
  } else if (parsed.mode === 'how') {
    if (tone === 'good') level = '宜进取'
    else if (tone === 'bad') level = '宜先守'
    else level = '宜备后动'
  }
  const guardedLevel = safetyLevel(parsed)
  if (guardedLevel) level = guardedLevel

  const askRef = parsed.raw
    ? `你问的是「${parsed.raw}」（按「${parsed.modeLabel}」来断）`
    : `本次按梅花「${parsed.modeLabel}」来断`

  let judgment = `${askRef}。`

  const guardedJudgment = safetyJudgmentLine(
    parsed,
    parsed.mode === 'yesno' ? answerTone : tone
  )
  if (guardedJudgment) {
    judgment += guardedJudgment
  } else if (parsed.mode === 'where') {
    judgment += place
      ? `判断：你问的方位，重点看「${place}」（事体「${focus}」，用卦「${cast.tiYong.yong.name}」后天位）。`

      ? `判断：你问的是「几点」——「${focus}」象意时刻偏${clockHint}（取动爻合十二时辰）。`
      : '判断：你问的是「几点」，但卦上时刻信号不足，不宜钉死钟点。'
  } else if (parsed.mode === 'when') {

  } else if (parsed.mode === 'who') {

  const reply = directReply(parsed, parsed.mode === 'yesno' ? answerTone : tone, level, {
    place,
    whenHint,
    clockHint,
    whoHint,
    choicePick,
    outcomeTone: tone

  let advice = ''
  if (parsed.mode === 'where') {
    advice = place
      ? `当下怎么做：先往「${place}」一侧排查/行动，再对照用卦物象与现场；勿只认一个点。`

      : `当下怎么做：整日分段留意「${focus}」，本卦时刻信号不足。`
  } else if (parsed.mode === 'when') {
    advice = `当下怎么做：结合${whenHint}；体用转顺再加码，转逆则缓。`
  } else if (parsed.mode === 'who') {

        : `当下怎么做：可接触「${whoHint}」，同时准备备选。`
  } else if (parsed.mode === 'choice') {
    if (parsed.choice) {
      advice = `当下怎么做：给「${parsed.choice.a}」与「${parsed.choice.b}」使用同一组标准，比较收益、代价、可逆性和最坏结果；信息不足时先做低成本验证。`
    } else {
      advice = '当下怎么做：用「甲还是乙」把两个选项写清楚再起一卦。'

  } else if (parsed.mode === 'jixiong') {
    advice = tone === 'good'
      ? `当下怎么做：吉中仍看互变是否转逆；可推进「${focus}」，留退路。`
      : tone === 'bad'
        ? `当下怎么做：凶象当前，收缩「${focus}」风险，勿扩大敞口。`
        : `当下怎么做：平局则小步试错，不为「${focus}」一次押死。`
  } else if (parsed.mode === 'how') {
    advice = tone === 'good'
      ? '当下怎么做：主动推进，借用生体/体克用之势，避开用克体窗口。'
      : tone === 'bad'
        ? '当下怎么做：先止损、改条件；用克体时尤其别硬闯。'
        : '当下怎么做：补条件、作两手准备，体用转顺再加码。'
  } else if (parsed.mode === 'degree') {
    advice = (parsed.domain === 'health' || parsed.domain === 'pregnancy')
      ? `当下怎么做：记录「${focus}」的症状、持续时间和检查结果；有加重或警示症状及时就医。`
      : tone === 'good'
        ? `当下怎么做：「${focus}」按较轻压力处理，仍保持观察。`
        : tone === 'bad'
          ? `当下怎么做：「${focus}」宜重视，该求助时别拖。`
          : `当下怎么做：持续观察「${focus}」变化。`
  } else if (parsed.mode === 'yesno') {
    advice = yesNoAdvice(parsed, answerTone)
  } else if (tone === 'good') {
    advice = `当下怎么做：围绕「${focus}」推进；盯互变是否转逆。`
  } else if (tone === 'bad') {
    advice = `当下怎么做：先放下对「${focus}」的硬攻，改条件或换时机。`
  } else {
    advice = `当下怎么做：先为「${focus}」补条件，待体用转顺再拍板。`
  }
  advice += philosophyGuidance(tone, focus, parsed)
  const safety = safetyAdvice(parsed)
  if (safety) advice += safety

  return {
    level,
    tone,
    reply,
    judgment,
    advice,
    parsed,
    place,
    whenHint,
    clockHint,
    whoHint,
    choicePick,
    answerTone
  }
}

function assembleCast({ method, methodLabel, question, askMeta, date, upperSrc, lowerSrc, sum, dongYao, numsExtra }) {
  const upper = numToTrigram(upperSrc)
  const lower = numToTrigram(lowerSrc)
  const ben = packGua(upper, lower)
  const dong = mod6(dongYao != null ? dongYao : sum)
  const tiYong = resolveTiYong(ben, dong)
  const verdict = tiYongVerdict(tiYong.ti.wuxing, tiYong.yong.wuxing)
  const hu = buildHuGua(ben.lines)
  const bian = buildBianGua(ben.lines, dong - 1)
  const calendar = buildCalendar(date)

  const huTiGua = sideGua(hu, tiYong, 'ti')
  const huYongGua = sideGua(hu, tiYong, 'yong')
  const huVerdict = tiYongVerdict(huTiGua.wuxing, huYongGua.wuxing)
  const bianTi = sideGua(bian, tiYong, 'ti')
  const bianYong = sideGua(bian, tiYong, 'yong')
  const bianVerdict = tiYongVerdict(bianTi.wuxing, bianYong.wuxing)

  const cast = {
    type: 'meihua',
    createdAt: (date ? new Date(date) : new Date()).toISOString(),
    question: question || '',
    askMeta: askMeta || null,
    method,
    methodLabel,
    calendar,
    nums: {
      upperSrc,
      lowerSrc,
      upperRemainder: mod8(upperSrc),
      lowerRemainder: mod8(lowerSrc),
      sum,
      ...numsExtra
    },
    dongYao: dong,
    dongLabel: YAO_CN[dong - 1],
    ben,
    hu,
    bian,
    tiYong,
    verdict,
    huVerdict,
    bianVerdict
  }

  const ask = buildAskJudgment(cast, huVerdict, bianVerdict)
  cast.ask = ask
  cast.parsed = ask.parsed
  cast.reply = ask.reply
  cast.advice = ask.advice
  cast.judgment = ask.judgment
  cast.summary = ask.level
  cast.summaryNote = ask.judgment
  // 展示语气以问法判断为准（可能因互变下调）
  cast.verdict = Object.assign({}, verdict, { tone: ask.tone, level: ask.level })
  cast.guide = buildGuide(cast)
  return cast
}

/** 报数起卦：两个正整数 */
function castByNumbers(a, b, options = {}) {
  const n1 = Number(a)
  const n2 = Number(b)
  if (!Number.isSafeInteger(n1) || !Number.isSafeInteger(n2) || n1 <= 0 || n2 <= 0) {
    throw new Error('请输入两个正整数')
  }
  const sum = n1 + n2
  return assembleCast({
    method: 'number',
    methodLabel: '报数起卦',
    question: options.question,
    askMeta: options.askMeta,
    date: options.date,
    upperSrc: n1,
    lowerSrc: n2,
    sum
  })
}

function hourZhi(date) {
  const h = date.getHours()
  const idx = Math.floor(((h + 1) % 24) / 2)
  return DI_ZHI[idx]
}

function lunarYearZhi(year) {
  return DI_ZHI[((year - 4) % 12 + 12) % 12]
}

/** 时间起卦：农历年支数+农历月+农历日(+时) */
function castByTime(options = {}) {
  const date = options.date ? new Date(options.date) : new Date()
  if (Number.isNaN(date.getTime())) throw new Error('起卦时间无效')
  const cal = buildCalendar(date)
  const lunar = solarToLunar(date)
  const yearZhi = lunarYearZhi(lunar.year)
  const yearNum = ZHI_NUM[yearZhi]
  const monthNum = lunar.month
  const dayNum = lunar.day
  const hz = hourZhi(date)
  const hourNum = ZHI_NUM[hz]
  const upperSrc = yearNum + monthNum + dayNum
  const lowerSrc = upperSrc + hourNum
  const sum = lowerSrc
  return assembleCast({
    method: 'time',
    methodLabel: '时间起卦',
    question: options.question,
    askMeta: options.askMeta,
    date,
    upperSrc,
    lowerSrc,
    sum,
    numsExtra: {
      yearNum,
      monthNum,
      dayNum,
      hourNum,
      hourText: `${hz}时`,
      lunarText: `${lunar.year}年${lunar.isLeap ? '闰' : ''}${lunar.month}月${lunar.day}日`,
      yearZhi
    }
  })
}

/** 随机起卦（教学用） */
function castByRandom(options = {}) {
  const n1 = 1 + Math.floor(Math.random() * 64)
  const n2 = 1 + Math.floor(Math.random() * 64)
  return assembleCast({
    method: 'random',
    methodLabel: '随机起卦',
    question: options.question,
    askMeta: options.askMeta,
    date: options.date,
    upperSrc: n1,
    lowerSrc: n2,
    sum: n1 + n2
  })
}

  }

    return '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'
  }
  function bindNav() {
    app.querySelectorAll('[data-go]').forEach((el) => {
      el.onclick = () => {
        if (el.hasAttribute('data-back')) { back(); return }
        go(el.dataset.go)
      }
    })
    app.querySelectorAll('[data-back]:not([data-go])').forEach((el) => {
      el.onclick = () => back()
    })
  }

  function polar(cx, cy, r, deg) {
    // 0deg = 屏顶；古图上南，故数据以正南为 0°、顺时针
    const rad = (deg - 90) * Math.PI / 180
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) }
  }

  function guaBarsSvg(lines, x, y, color) {
    const fill = color || '#140f0c'
    const order = [lines[2], lines[1], lines[0]]
    return order.map((yang, i) => {
      const yy = y - 12 + i * 8
      if (yang) return `<rect x="${x - 14}" y="${yy}" width="28" height="3.6" rx="0.4" fill="${fill}"/>`
      return `<rect x="${x - 14}" y="${yy}" width="10" height="3.6" rx="0.4" fill="${fill}"/><rect x="${x + 4}" y="${yy}" width="10" height="3.6" rx="0.4" fill="${fill}"/>`
    }).join('')
  }

  function buildLuopanSvg(plateDeg) {
    const cx = 200, cy = 200
    const rot = plateDeg == null ? -180 : plateDeg
    const bagua = [
      { n: '离', tip: '火', color: '#3a3028', lines: [1, 0, 1], deg: 0 },
      { n: '坤', tip: '地·土', color: '#3a3028', lines: [0, 0, 0], deg: 45 },
      { n: '兑', tip: '泽·金', color: '#3a3028', lines: [1, 1, 0], deg: 90 },
      { n: '乾', tip: '天·金', color: '#3a3028', lines: [1, 1, 1], deg: 135 },
      { n: '坎', tip: '水', color: '#3a3028', lines: [0, 1, 0], deg: 180 },
      { n: '艮', tip: '山·土', color: '#3a3028', lines: [0, 0, 1], deg: 225 },
      { n: '震', tip: '雷·木', color: '#3a3028', lines: [1, 0, 0], deg: 270 },
      { n: '巽', tip: '风·木', color: '#3a3028', lines: [0, 1, 1], deg: 315 }
    ]
    const wxColor = { 木: '#3a3028', 火: '#3a3028', 土: '#3a3028', 金: '#3a3028', 水: '#3a3028' }
    const mountains = ['子', '癸', '丑', '艮', '寅', '甲', '卯', '乙', '辰', '巽', '巳', '丙', '午', '丁', '未', '坤', '申', '庚', '酉', '辛', '戌', '乾', '亥', '壬']
    const dirs = [{ n: '南', deg: 0 }, { n: '西', deg: 90 }, { n: '北', deg: 180 }, { n: '东', deg: 270 }]
    const ticks = Array.from({ length: 72 }, (_, i) => {
      const deg = i * 5
      const major = deg % 30 === 0
      const mid = deg % 10 === 0 && !major
      const outer = polar(cx, cy, 196, deg)
      const inner = polar(cx, cy, major ? 184 : mid ? 188 : 191, deg)
      return `<line x1="${outer.x}" y1="${outer.y}" x2="${inner.x}" y2="${inner.y}" stroke="${major ? 'rgba(143,38,31,0.55)' : mid ? 'rgba(20,15,12,0.32)' : 'rgba(20,15,12,0.18)'}" stroke-width="${major ? 1.6 : 1}"/>`
    }).join('')
    const spokes = [22.5, 67.5, 112.5, 157.5, 202.5, 247.5, 292.5, 337.5].map((deg) => {
      const a = polar(cx, cy, 88, deg)
      const b = polar(cx, cy, 140, deg)
      return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(20,15,12,0.12)" stroke-width="1"/>`
    }).join('')
    const degLabs = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map((compass) => {
      const deg = (compass + 180) % 360
      const p = polar(cx, cy, 188, deg)
      return `<text x="${p.x}" y="${p.y + 3}" text-anchor="middle" transform="rotate(${deg} ${p.x} ${p.y})" fill="rgba(20,15,12,0.55)" font-size="9" font-weight="600">${compass}</text>`
    }).join('')
    const mountainTexts = mountains.map((name, i) => {
      const compass = i * 15
      const deg = (compass + 180) % 360
      const p = polar(cx, cy, 168, deg)
      const cardinal = name === '子' || name === '午' || name === '卯' || name === '酉'
      return `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" transform="rotate(${deg} ${p.x} ${p.y})" fill="${cardinal ? 'rgba(143,38,31,0.95)' : 'rgba(20,15,12,0.5)'}" font-size="${cardinal ? 13 : 10}" font-weight="${cardinal ? 700 : 500}">${name}</text>`
    }).join('')
    const dirTexts = dirs.map((d) => {
      const p = polar(cx, cy, 152, d.deg)
      return `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" transform="rotate(${d.deg} ${p.x} ${p.y})" fill="rgba(143,38,31,0.75)" font-size="10" font-weight="700">${d.n}</text>`
    }).join('')
    const guaFill = '#3a3028'
    const guaTexts = bagua.map((b) => {
      const p = polar(cx, cy, 112, b.deg)
      return `<g data-lucky-toggle="1" transform="translate(${p.x.toFixed(2)},${p.y.toFixed(2)}) rotate(${b.deg})" style="cursor:pointer">
        <circle cx="0" cy="8" r="28" fill="rgba(0,0,0,0)"/>
        ${guaBarsSvg(b.lines, 0, -10, guaFill)}
        <text x="0" y="14" text-anchor="middle" fill="${guaFill}" font-size="13" font-weight="700">${b.n}</text>
        <text x="0" y="26" text-anchor="middle" fill="${guaFill}" font-size="8" font-weight="600">${b.tip}</text>
      </g>`
    }).join('')
    const luckyMarks = (state.luckyOpen && state.luckyPack && state.luckyPack.marks || []).map((m) => {
      const rim = polar(cx, cy, 200, m.plateDeg)
      const tick = polar(cx, cy, 210, m.plateDeg)
      const label = polar(cx, cy, 232, m.plateDeg)
      return `<g class="lucky-mark" pointer-events="none">
        <line x1="${rim.x.toFixed(1)}" y1="${rim.y.toFixed(1)}" x2="${tick.x.toFixed(1)}" y2="${tick.y.toFixed(1)}" stroke="#a03328" stroke-width="1.8"/>
        <g transform="translate(${label.x.toFixed(1)},${label.y.toFixed(1)}) rotate(${m.plateDeg})">
          <text x="0" y="-8" text-anchor="middle" fill="#a03328" font-size="16" font-weight="700">${m.label}</text>
          <text x="0" y="10" text-anchor="middle" fill="#a03328" font-size="13">${m.dir}</text>
        </g>
      </g>`
    }).join('')
    const gans = [['甲乙', '木'], ['丙丁', '火'], ['戊己', '土'], ['庚辛', '金'], ['壬癸', '水']]
    const ganRow = gans.map((g, i) => {
      const x = 56 + i * 72
      return `<rect x="${x - 22}" y="414" width="44" height="34" fill="rgba(250,243,228,0.35)" stroke="rgba(20,15,12,0.14)" stroke-width="0.8"/>
        <text x="${x}" y="428" text-anchor="middle" fill="rgba(20,15,12,0.62)" font-size="9">${g[0]}</text>
        <text x="${x}" y="442" text-anchor="middle" fill="${wxColor[g[1]]}" font-size="11" font-weight="700">${g[1]}</text>`
    }).join('')

    return `
      <svg viewBox="-40 -48 480 510" overflow="visible" xmlns="http://www.w3.org/2000/svg" aria-label="后天八卦罗盘 · 准星指南针">
        <defs></defs>
        <g id="luopan-plate" transform="rotate(${rot} 200 200)">
          <!-- 无装饰自转：仅由指南针/拖动改 transform -->
          <circle cx="200" cy="200" r="198" fill="#e6d4b0" stroke="#46341c" stroke-width="3"/>
          <circle cx="200" cy="200" r="191" fill="none" stroke="rgba(248,240,222,0.55)" stroke-width="5"/>
          <circle cx="200" cy="200" r="186" fill="none" stroke="rgba(90,70,40,0.22)" stroke-width="1.2"/>
          <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(20,15,12,0.14)" stroke-width="1"/>
          <circle cx="200" cy="200" r="158" fill="none" stroke="rgba(143,38,31,0.2)" stroke-width="1"/>
          <circle cx="200" cy="200" r="108" fill="none" stroke="rgba(20,15,12,0.1)" stroke-width="1"/>
          <circle cx="200" cy="200" r="92" fill="none" stroke="rgba(143,38,31,0.14)" stroke-width="1"/>
          ${ticks}
          ${spokes}
          ${degLabs}
          ${dirTexts}
          ${mountainTexts}
          ${guaTexts}
          ${luckyMarks}
        </g>
        <!-- 固定准星 -->
        <g pointer-events="none">
        <line x1="200" y1="8" x2="200" y2="392" stroke="rgba(160,51,40,0.7)" stroke-width="1.5"/>
        <line x1="40" y1="200" x2="360" y2="200" stroke="rgba(160,51,40,0.35)" stroke-width="1"/>
        <polygon points="200,4 206,16 194,16" fill="#a03328"/>
        <circle cx="200" cy="200" r="4" fill="#a03328" stroke="#faf3e4" stroke-width="1.5"/>
        </g>
        <circle cx="200" cy="200" r="46" fill="#f0e4c8" stroke="rgba(20,15,12,0.16)" stroke-width="1"/>
        <circle cx="200" cy="200" r="46" fill="none" stroke="rgba(143,38,31,0.1)" stroke-width="3"/>
        <circle cx="200" cy="200" r="34" fill="#f6eedc" stroke="rgba(20,15,12,0.42)" stroke-width="1.5"/>
        <g pointer-events="none">
          <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="56s" repeatCount="indefinite"/>
          <path d="M200 166 A34 34 0 0 1 200 234 A17 17 0 0 1 200 200 A17 17 0 0 0 200 166" fill="#140f0c"/>
          <circle cx="200" cy="183" r="17" fill="#140f0c"/>
          <circle cx="200" cy="217" r="17" fill="#f6eedc"/>
          <circle cx="200" cy="183" r="5" fill="#f6eedc"/>
          <circle cx="200" cy="217" r="5" fill="#140f0c"/>
        </g>
        <circle data-lucky-toggle="1" cx="200" cy="200" r="46" fill="rgba(0,0,0,0)" style="cursor:pointer"/>
        ${ganRow}
      </svg>`
  }

  const MOUNTAIN_NAMES = ['子', '癸', '丑', '艮', '寅', '甲', '卯', '乙', '辰', '巽', '巳', '丙', '午', '丁', '未', '坤', '申', '庚', '酉', '辛', '戌', '乾', '亥', '壬']

  function dirNameOf(deg) {
    const d = ((deg % 360) + 360) % 360
    const names = ['北', '东北', '东', '东南', '南', '西南', '西', '西北']
    return names[Math.round(d / 45) % 8]
  }
  function mountainOf(deg) {
    const d = ((deg % 360) + 360) % 360
    return MOUNTAIN_NAMES[Math.round(d / 15) % 24]
  }
  function directionInfoOf(deg) {
    const d = ((deg % 360) + 360) % 360
    const infos = [
      ['坎', '水', '冬', '子时', '静藏蓄势'],
      ['艮', '土', '冬春之交', '丑寅时', '止而后动'],
      ['震', '木', '春', '卯时', '发动生长'],
      ['巽', '木', '春夏之交', '辰巳时', '入而渐进'],
      ['离', '火', '夏', '午时', '明察显达'],
      ['坤', '土', '夏秋之交', '未申时', '厚载包容'],
      ['兑', '金', '秋', '酉时', '和悦收敛'],
      ['乾', '金', '秋冬之交', '戌亥时', '刚健自强']
    ]
    const mountainIndex = Math.round(d / 15) % 24
    const center = mountainIndex * 15
    const start = ((center - 7.5) % 360 + 360) % 360
    const end = (center + 7.5) % 360
    const sitDeg = (d + 180) % 360
    const info = infos[Math.round(d / 45) % 8]
    return {
      sitDir: dirNameOf(sitDeg),
      sitDeg: Math.round(sitDeg * 10) / 10,
      sitMountain: mountainOf(sitDeg),
      range: `${start}°—${end}°`,
      trigram: info[0],
      element: info[1],
      season: info[2],
      shichen: info[3],
      meaning: info[4],
      adjacent: `${MOUNTAIN_NAMES[(mountainIndex + 23) % 24]}山 · ${MOUNTAIN_NAMES[(mountainIndex + 1) % 24]}山`
    }
  }
  function placeDegreeOf(place) {
    const p = String(place || '')
    if (p.includes('东北')) return 45
    if (p.includes('东南')) return 135
    if (p.includes('西南')) return 225
    if (p.includes('西北')) return 315
    if (p.includes('东')) return 90
    if (p.includes('南')) return 180
    if (p.includes('西')) return 270
    if (p.includes('北')) return 0
    return null
  }
  function turnHintOf(current, target) {
    let delta = target - current
    while (delta > 180) delta -= 360
    while (delta < -180) delta += 360
    if (Math.abs(delta) < 4) return '已对准目标方向'
    return `${delta > 0 ? '向右' : '向左'}转约 ${Math.round(Math.abs(delta))}°`
  }
  function currentDirectionGuide(heading) {
    const candidates = [state.cast, state.meihua]
      .filter(item => item && item.askMeta && item.askMeta.mode === 'where')
      .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
    const cast = candidates[0]
    if (!cast) return null
    let place = cast.ask && cast.ask.place
    if (!place && cast.changingIndexes) {
      const reading = window.LiuYao.interpret(cast, cast.askMeta.topicKey || 'general')
      place = reading && reading.judgment && reading.judgment.place
    }
    const target = placeDegreeOf(place)
    if (target == null) return null
    return {
      focus: cast.askMeta.focus || '所问之事',
      place,
      turn: turnHintOf(heading, target)
    }
  }
  function headingFromPlate(plateDeg) {
    return (((-plateDeg - 180) % 360) + 360) % 360
  }

  function plateFromHeading(heading) {
    return -heading - 180
  }

  function normalizePlate(deg) {
    let n = deg % 360
    if (n > 180) n -= 360
    if (n <= -180) n += 360
    return n
  }

  function paintLuopanLive() {
    if (state.page !== 'index') return
    const hudDir = document.getElementById('hud-dir')
    const hudDeg = document.getElementById('hud-deg')
    const hudMountain = document.getElementById('hud-mountain')
    const infoFacing = document.getElementById('info-facing')
    const infoSitting = document.getElementById('info-sitting')
    const infoRange = document.getElementById('info-range')
    const infoTrigram = document.getElementById('info-trigram')
    const lockBtn = document.getElementById('compass-lock')
    const h = state.compassReady
      ? state.compassHeading
      : headingFromPlate(state.plateDeg)
    setPlateRotation(state.plateDeg)
    if (hudDir) hudDir.textContent = dirNameOf(h)
    if (hudDeg) hudDeg.textContent = `${(Math.round(h * 10) / 10)}°`
    if (hudMountain) hudMountain.textContent = `${mountainOf(h)}山`
    const info = directionInfoOf(h)
    if (infoFacing) infoFacing.textContent = `${dirNameOf(h)} · ${Math.round(h * 10) / 10}° · ${mountainOf(h)}山`
    if (infoSitting) infoSitting.textContent = `${info.sitDir} · ${info.sitDeg}° · ${info.sitMountain}山`
    if (infoRange) infoRange.textContent = info.range
    if (infoTrigram) infoTrigram.textContent = `${info.trigram}卦 · ${info.element}`
    if (lockBtn) {
      lockBtn.textContent = state.locked ? '已锁' : '锁定'
      lockBtn.classList.toggle('on', !!state.locked)
    }
  }

  /**
   * 只旋转盘面 g#luopan-plate；准星、太极、底部天干五行保持不动
   */
  function setPlateRotation(deg) {
    const plate = document.getElementById('luopan-plate')
    if (!plate) return
    plate.querySelectorAll('animateTransform').forEach((n) => n.remove())
    const d = Number(deg) || 0
    plate.setAttribute('transform', `rotate(${d} 200 200)`)
  }

  function applyLiveHeading(heading) {
    if (state._dragging || state.locked) return
    const h = ((Number(heading) % 360) + 360) % 360
    state.compassHeading = h
    state.compassReady = true
    // 准星固定在屏顶：盘面反向转，北/子随地磁归位
    state.plateDeg = -h - 180
    // 归一化，避免数值过大
    let n = state.plateDeg % 360
    if (n > 180) n -= 360
    if (n <= -180) n += 360
    state.plateDeg = n
    setPlateRotation(state.plateDeg)
    const hudDir = document.getElementById('hud-dir')
    const hudDeg = document.getElementById('hud-deg')
    const hudMountain = document.getElementById('hud-mountain')
    if (hudDir) hudDir.textContent = dirNameOf(h)
    if (hudDeg) hudDeg.textContent = `${Math.round(h * 10) / 10}°`
    if (hudMountain) hudMountain.textContent = `${mountainOf(h)}山`
    state.compassStability = '读数稳定'
  }

  function bindLuopanInteractions() {
    const wrap = document.getElementById('luopan-wrap')
    if (!wrap) return
    const lockBtn = document.getElementById('compass-lock')
    const infoBtn = document.getElementById('compass-info')
    const directionDismiss = document.getElementById('direction-dismiss')
    if (directionDismiss) {
      directionDismiss.onclick = (ev) => {
        ev.preventDefault()
        state.compassInfoOpen = false
        render()
      }
    }
    if (infoBtn) {
      infoBtn.onclick = (ev) => {
        ev.preventDefault()
        ev.stopPropagation()
        state.compassInfoOpen = !state.compassInfoOpen
        render()
        requestCompassPermission(true)
      }
    }
    app.querySelectorAll('[data-direction-tab]').forEach((el) => {
      el.onclick = (ev) => {
        ev.preventDefault()
        ev.stopPropagation()
        state.compassInfoTab = el.dataset.directionTab || 'measure'
        render()
      }
    })
    if (lockBtn) {
      lockBtn.onclick = (ev) => {
        ev.preventDefault()
        ev.stopPropagation()
        state.locked = !state.locked
        paintLuopanLive()
        if (!state.locked) requestCompassPermission(true)
      }
    }
    const hud = document.getElementById('luopan-hud')
    if (hud) {
      hud.onclick = (ev) => {
        if (ev.target && ev.target.closest && ev.target.closest('#lucky-hint')) return
        ev.preventDefault()
        ev.stopPropagation()
        state.compassReady = false
        state._dragHint = '正在重试方向感应…'
        paintLuopanLive()
        requestCompassPermission(true)
      }
    }
    const centerOf = () => compassCenter(wrap)
    const angleAt = (clientX, clientY, c) =>
      (Math.atan2(clientY - c.y, clientX - c.x) * 180) / Math.PI

    wrap.ontouchstart = (e) => {
      // 点盘面即申请方向权限（iOS 手势栈）
      try { requestCompassPermission(true) } catch (err) { /* ignore */ }
      const t = e.touches[0]
      if (!t) return
      state._didDrag = false
      if (isLuckyHit(e.target)) {
        state._luckyTap = true
        return
      }
      state._luckyTap = false
      if (state.locked) return
      state._dragging = true
      state._lastDragAng = angleAt(t.clientX, t.clientY, centerOf())
    }
    wrap.onmousedown = (e) => {
      try { requestCompassPermission(true) } catch (err) { /* ignore */ }
      if (isLuckyHit(e.target)) return
      if (state.locked) return
      e.preventDefault()
      state._didDrag = false
      state._dragging = true
      state._lastDragAng = angleAt(e.clientX, e.clientY, centerOf())
    }
    wrap.onclick = (e) => {
      if (state._didDrag) {
        state._didDrag = false
        return
      }
      if (isLuckyHit(e.target)) {
        e.preventDefault()
        e.stopPropagation()
        toggleLucky()
      }
    }
    wrap.ontouchmove = (e) => {
      const t = e.touches[0]
      if (!t || !state._dragging) return
      dragMove(t.clientX, t.clientY, centerOf)
    }
    wrap.ontouchend = () => {
      if (state._luckyTap) {
        state._luckyTap = false
        if (!state._didDrag) toggleLucky()
        return
      }
      dragEnd()
    }
    wrap.ontouchcancel = () => dragEnd()
  }

  function compassCenter(wrap) {
    const svg = wrap.querySelector('svg')
    const box = (svg || wrap).getBoundingClientRect()
    const vb = svg && svg.viewBox && svg.viewBox.baseVal
    if (!vb || !vb.width) {
      return { x: box.left + box.width / 2, y: box.top + box.width / 2 }
    }
    const scale = box.width / vb.width
    return {
      x: box.left + (200 - vb.x) * scale,
      y: box.top + (200 - vb.y) * scale
    }
  }

  function isLuckyHit(target) {
    if (!target || !target.closest) return false
    return !!target.closest('[data-lucky-toggle]')
  }

  function toggleLucky() {
    const now = Date.now()
    if (toggleLucky._at && now - toggleLucky._at < 400) return
    toggleLucky._at = now
    state.luckyOpen = !state.luckyOpen
    if (state.luckyOpen && window.LiuYao && window.LiuYao.buildLuckyDirections) {
      state.luckyPack = window.LiuYao.buildLuckyDirections(new Date())
    } else {
      state.luckyPack = null
    }
    render()
  }

  function dragMove(clientX, clientY, centerOf) {
    if (!state._dragging || state.locked || state._lastDragAng == null) return
    const ang = (Math.atan2(clientY - centerOf().y, clientX - centerOf().x) * 180) / Math.PI
    let delta = ang - state._lastDragAng
    if (delta > 180) delta -= 360
    if (delta < -180) delta += 360
    state._lastDragAng = ang
    state._didDrag = true
    state.plateDeg = normalizePlate(state.plateDeg + delta)
    state.compassHeading = headingFromPlate(state.plateDeg)
    state._dragHint = '拖动转盘中'
    paintLuopanLive()
  }

  function dragEnd() {
    if (!state._dragging) return
    state._dragging = false
    state._lastDragAng = null
    if (state.compassReady && !state.locked) applyLiveHeading(state.compassHeading)
    else {
      state._dragHint = '拖动转盘调整方位'
      paintLuopanLive()
    }
  }

  // 窗口级拖动只绑一次，避免 render 叠加监听
  if (!window.__liuyaoDragBound) {
    window.__liuyaoDragBound = true
    window.addEventListener('mousemove', (e) => {
      if (!state._dragging) return
      const wrap = document.getElementById('luopan-wrap')
      if (!wrap) return
      dragMove(e.clientX, e.clientY, () => compassCenter(wrap))
    })
    window.addEventListener('mouseup', dragEnd)

  function pushYao(result) {
    state.yaos = state.yaos.concat([result])
    state.step = state.yaos.length
    state.current = result
    state.shaking = false
    state.displayCoins = result.coins
    render()
  }

  function beads() {
    return `<div class="progress">${[0,1,2,3,4,5].map((i) => `<i class="bead ${i < state.step ? 'on' : ''}"></i>`).join('')}</div>`
  }

  function miniGua() {
    const lines = []
    for (let i = 5; i >= 0; i -= 1) {
      const y = state.yaos[i]
      if (!y) lines.push('<div class="mini-yao"></div>')
      else lines.push(`<div class="mini-yao filled ${y.yinYang ? 'yang' : 'yin'} ${y.changing ? 'moving' : ''}"></div>`)
    }
    return `<div class="gua-side"><div class="gua-lab">卦象</div><div class="gua-lines">${lines.join('')}</div></div>`
  }

  function syncAskSelection() {
    if (!state.selectedOptionId || !window.LiuYao.buildAskSelection) {
      state.question = ''
      state.askMeta = null
      return
    }
    const sel = window.LiuYao.buildAskSelection(state.selectedOptionId, state.selectedTimeKey || '')
    if (!sel) {
      state.question = ''
      state.askMeta = null
      return
    }
    state.question = sel.question
    state.askMeta = sel.askMeta
  }

  function ensureAskSelected() {
    if (state.selectedOptionId && state.askMeta) return true
    alert('请先选择所问')
    return false
  }

  function askPickerHtml(emptyHint) {
    const scopes = window.LiuYao.TIME_SCOPES || []
    const groups = window.LiuYao.listGroups ? window.LiuYao.listGroups() : []
    if (!state.selectedGroupKey && state.selectedOptionId) {
      const matched = groups.find((g) => g.options.some((o) => o.id === state.selectedOptionId))
      if (matched) state.selectedGroupKey = matched.key
    }
    const selectedGroup = groups.find((g) => g.key === state.selectedGroupKey)
    if (!selectedGroup) {
      return `
        <div class="ask-picker">
          <div class="field-label">先选类别</div>
          <div class="ask-category-grid">${groups.map((g) => `
            <button type="button" class="ask-category" data-group="${g.key}">
              <span class="ask-category-name">${g.label}</span>
            </button>`).join('')}</div>
        </div>`
    }
    const timeHtml = scopes.map((t) =>
      `<button type="button" class="ask-chip ${state.selectedTimeKey === t.key ? 'on' : ''}" data-time="${t.key}">${t.label}</button>`
    ).join('')
    return `
      <div class="ask-picker">
        <div class="ask-category-head">
          <div class="field-label">当前类别</div>
          <div class="ask-category-row">
            <div class="ask-current-category">${selectedGroup.label}</div>
            <button type="button" class="change-link ask-change-category" data-change-group>返回上一层</button>
          </div>
        </div>
        <div class="field-label" style="margin-top:16px">选择具体事项</div>
        <div class="ask-option-list">${selectedGroup.options.map((o) =>
          `<button type="button" class="ask-option ${o.wide ? 'wide' : ''} ${state.selectedOptionId === o.id ? 'on' : ''}" data-opt="${o.id}">${o.label}</button>`
        ).join('')}</div>
        <div class="field-label" style="margin-top:18px">时间范围</div>
        <div class="ask-time-grid">${timeHtml}</div>
        <div class="ask-hint muted">${state.question || emptyHint}</div>
      </div>`
  }

  function bindAskPicker() {
    app.querySelectorAll('[data-group]').forEach((el) => {
      el.onclick = () => {
        state.selectedGroupKey = el.dataset.group || ''
        state.selectedOptionId = ''
        syncAskSelection()
        render()
      }
    })
    const changeGroup = app.querySelector('[data-change-group]')
    if (changeGroup) {
      changeGroup.onclick = () => {
        state.selectedGroupKey = ''
        state.selectedOptionId = ''
        syncAskSelection()
        render()
      }
    }
    app.querySelectorAll('[data-time]').forEach((el) => {
      el.onclick = () => {
        state.selectedTimeKey = el.dataset.time || ''
        syncAskSelection()
        render()
      }
    })
    app.querySelectorAll('[data-opt]').forEach((el) => {
      el.onclick = () => {
        state.selectedOptionId = el.dataset.opt || ''
        syncAskSelection()
        render()
      }
    })
  }

  function requirePendingAsk(next) {
    if (state.selectedOptionId && state.askMeta && state.question) return true
    state.askNext = next || 'cast'
    go('ask', {}, { replace: true })
    return false
  }

  function renderAsk() {
    setNav('选择所问')
    const next = state.askNext === 'meihua' ? 'meihua' : 'cast'
    const nextLabel = next === 'meihua' ? '梅花起卦' : '六爻卜卦'
    const confirmLabel = '去卜卦'
    const canConfirm = !!(state.selectedOptionId && state.question)
    app.innerHTML = `
      <div class="title-zh ask-title-center">所问</div>
      <div class="ask-before-note">
        <div>占贵诚敬，一事一问；毋以戏筮，毋再三渎问。</div>
        <div>澄心定念，明所求而后起卦。</div>
      </div>
      ${askPickerHtml('请点选一项')}
      <button class="btn btn-primary" id="askConfirm" ${canConfirm ? '' : 'disabled'}>${canConfirm ? confirmLabel : '选择所问'}</button>
      <button class="btn btn-ghost" data-back style="margin-top:12px">返回</button>`
    bindNav()
    bindAskPicker()
    const confirm = document.getElementById('askConfirm')
    if (confirm) confirm.onclick = () => {
      if (!ensureAskSelected()) return
      state.askNext = next
      if (next === 'meihua') {
        go('meihua')
      } else {
        state.step = 0; state.yaos = []; state.current = null
        state.displayCoins = ['', '', '']
        go('cast')
      }
    }
  }

  function renderCast() {
    setNav('卜卦')
    if (!requirePendingAsk('cast')) return

    const stageBody = state.mode === 'shake' ? `
      <div class="stage-live">
        <div class="coin-stage">
          <div class="coins ${state.shaking ? 'shake' : ''}">
            ${[0,1,2].map((i) => {
              const c = (state.displayCoins && state.displayCoins[i]) || null
              const face = c ? (c === 'yang' ? 'yang' : 'yin') : 'yang idle'
              return `<div class="coin ${face}">
                <i class="coin-shadow"></i>
                <div class="coin-body">
                  <img class="coin-face coin-obverse" src="${window.__COIN_YANG || './assets/coins/qianlong-yang.jpg'}" alt="字阳" />
                  <img class="coin-face coin-reverse" src="${window.__COIN_YIN || './assets/coins/qianlong-yin.jpg'}" alt="背阴" />

          </div>
          <div class="result-line">${state.current

            : '<span class="muted" style="font-size:14px;letter-spacing:.14em">静心片刻，然后摇卦</span>'}</div>

      </div>` : `

        </div>
        ${miniGua()}

      `

    app.innerHTML = `
      <div class="title-zh cast-title">卜卦</div>
      <div class="subtitle cast-subtitle">六次成爻 · 自下而上</div>
      <div class="mode-row">
        <div class="mode ${state.mode === 'shake' ? 'on' : ''}" id="modeShake">摇铜钱</div>
        <div class="mode ${state.mode === 'manual' ? 'on' : ''}" id="modeManual">手记爻象</div>
      </div>
      <div class="frame">
        ${corners()}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span class="seal">第 ${Math.min(state.step + 1, 6)} 爻</span>
          <span class="muted">${state.step} / 6</span>
        </div>
        ${state.mode === 'shake'
          ? `<button class="btn btn-primary cast-shake-slot" id="shake" ${state.shaking || state.step >= 6 ? 'disabled' : ''}><span class="shell-inset" aria-hidden="true"></span><span class="shell-label">${state.step >= 6 ? '六爻已成' : state.shaking ? '摇卦中…' : '摇铜钱'}</span></button>`
          : beads()}
        ${stageBody}
      </div>
      ${state.step >= 6
        ? `<div class="row"><button class="btn btn-ghost" data-back>返回</button><button class="btn btn-primary" id="submit">排卦</button></div>`
        : state.mode === 'manual'
          ? `<div class="row"><button class="btn btn-ghost" data-back>返回</button><button class="btn btn-primary" id="undoYao" ${state.step ? '' : 'disabled'}>${state.step ? '撤回一爻' : '请选择爻象'}</button></div>`
          : `<div class="row"><button class="btn btn-ghost" data-back>返回</button><button class="btn btn-primary" id="submit" disabled>排卦</button></div>`}`
    bindNav()
    const changeAsk = document.getElementById('changeAsk')
    if (changeAsk) changeAsk.onclick = () => { state.askNext = 'cast'; go('ask') }
    document.getElementById('modeShake').onclick = () => {
      state.mode = 'shake'; state.step = 0; state.yaos = []; state.current = null
      state.displayCoins = ['', '', '']; render()
    }
    document.getElementById('modeManual').onclick = () => {
      state.mode = 'manual'; state.step = 0; state.yaos = []; state.current = null
      state.displayCoins = ['', '', '']; render()
    }
    const shake = document.getElementById('shake')
    if (shake) shake.onclick = () => {
      if (state.shaking || state.step >= 6) return
      if (!ensureAskSelected()) { state.askNext = 'cast'; go('ask'); return }
      const result = window.LiuYao.tossThreeCoins()
      state.shaking = true
      state.current = null
      state.displayCoins = result.coins
      render()
      setTimeout(() => pushYao(result), 1600)
    }
    app.querySelectorAll('[data-manual]').forEach((el) => {
      el.onclick = () => {
        if (state.step >= 6) return
        if (!ensureAskSelected()) { state.askNext = 'cast'; go('ask'); return }
        pushYao(window.LiuYao.manualYao(el.dataset.manual))
      }
    })
    const reset = document.getElementById('reset')
    if (reset) reset.onclick = () => {
      state.step = 0; state.yaos = []; state.current = null
      state.displayCoins = ['', '', '']; render()
    }
    const undoYao = document.getElementById('undoYao')
    if (undoYao) undoYao.onclick = () => {
      if (!state.step) return
      state.yaos = state.yaos.slice(0, -1)
      state.step = state.yaos.length
      state.current = state.yaos[state.yaos.length - 1] || null
      state.displayCoins = state.current ? state.current.coins : ['', '', '']
      render()
    }
    const submit = document.getElementById('submit')
    if (submit) submit.onclick = () => {
      if (!ensureAskSelected()) { state.askNext = 'cast'; go('ask'); return }
      state.cast = window.LiuYao.arrangeCast(state.yaos, {
        question: state.question.trim(),
        askMeta: state.askMeta
      })
      state._topicTouched = false
      state._topicAuto = false
      go('result')
    }
  }

        ${rows}
